plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.example.bluelink'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.bluelink'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '2.1'
    }
    signingConfigs {
        // Постоянный ключ разработчика лежит в репозитории (это НЕ секрет: приложение личное).
        // Без него каждый прогон CI подписывал APK новым случайным debug-ключом,
        // из-за чего обновление поверх установленной версии было невозможно.
        release {
            def envStore = System.getenv('BLUELINK_KEYSTORE_FILE')
            if (envStore) {
                storeFile file(envStore)
                storePassword System.getenv('BLUELINK_STORE_PASSWORD')
                keyAlias System.getenv('BLUELINK_KEY_ALIAS') ?: 'bluelink'
                keyPassword System.getenv('BLUELINK_KEY_PASSWORD') ?: System.getenv('BLUELINK_STORE_PASSWORD')
            } else {
                storeFile rootProject.file('bluelink-dev.p12')
                storePassword 'bluelink-dev-2026'
                keyAlias 'bluelink'
                keyPassword 'bluelink-dev-2026'
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Сжатие кода выключено намеренно: приложение небольшое, а экономия 200–300 КБ
            // не стоит риска, что R8 что-то вырежет в обработчиках Bluetooth.
            minifyEnabled false
            shrinkResources false
        }
    }
}
kotlin { jvmToolchain(17) }
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-ktx:1.13.1'
}
