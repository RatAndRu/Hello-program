plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.example.obyom'
    compileSdk 34
    defaultConfig { applicationId 'com.example.obyom'; minSdk 26; targetSdk 34; versionCode 20; versionName '2.9' }
    // Веб-часть (obyom/web) целиком кладётся в assets APK — приложение работает без интернета.
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    signingConfigs {
        release {
            def ks = System.getenv('OBYOM_KEYSTORE_FILE') ?: System.getenv('PINPHOTOS_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('OBYOM_STORE_PASSWORD') ?: System.getenv('PINPHOTOS_STORE_PASSWORD')
                keyAlias System.getenv('OBYOM_KEY_ALIAS') ?: System.getenv('PINPHOTOS_KEY_ALIAS') ?: 'pinphotos'
                keyPassword System.getenv('OBYOM_KEY_PASSWORD') ?: System.getenv('PINPHOTOS_KEY_PASSWORD') ?: System.getenv('OBYOM_STORE_PASSWORD') ?: System.getenv('PINPHOTOS_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('OBYOM_KEYSTORE_FILE') || System.getenv('PINPHOTOS_KEYSTORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
kotlin { jvmToolchain(17) }
dependencies { }
