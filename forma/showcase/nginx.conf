worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        model/gltf-binary glb;
        text/plain forma;
        image/webp webp;
    }

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    etag on;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript model/gltf-binary;

    server {
        listen 8000;
        listen [::]:8000;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location = /healthz {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            try_files /healthz =500;
        }

        location = /assets/catalog.json {
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=3600, must-revalidate, no-transform" always;
            try_files $uri =404;
        }

        location /api/ {
            default_type application/json;
            return 410 '{"error":"Static showcase: editor API is not available"}';
        }

        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
