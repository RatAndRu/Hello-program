<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<title>Пайплайн ИИ</title>
<rect width="1000" height="810" fill="#ffffff"/>
<text x="28.0" y="42.0" font-size="22" fill="#1f2933" text-anchor="start" font-weight="bold">Как просить нейросеть придумать оригами по теме</text>
<text x="28.0" y="68.0" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">семь шагов; ИИ делает смысл и оценку, алгоритм — геометрию, проверка — отбор</text>
<line x1="28" y1="86" x2="972" y2="86" stroke="#d5dbe1"/>
<rect x="28" y="108" width="137" height="118" rx="8" fill="#fcfdfe" stroke="#2b6cb0" stroke-width="1.4"/>
<text x="40.0" y="132.0" font-size="11.8" fill="#1f2933" text-anchor="start" font-weight="bold">1. Тема</text>
<text x="40.0" y="152.0" font-size="9.8" fill="#6b7785" text-anchor="start" font-weight="normal">«оригами машины»</text>
<rect x="40.0" y="180.0" width="32.4" height="18" rx="9" fill="#2b6cb0" opacity="0.12"/><rect x="40.0" y="180.0" width="32.4" height="18" rx="9" fill="none" stroke="#2b6cb0" stroke-width="0.9"/><text x="56.2" y="193.5" font-size="10.5" fill="#2b6cb0" text-anchor="middle" font-weight="bold">ИИ</text>
<line x1="167.0" y1="167.0" x2="165.0" y2="167.0" stroke="#6b7785" stroke-width="1.4"/><polygon points="171.0,167.0 165.0,170.0 165.0,164.0" fill="#6b7785"/>
<rect x="173" y="108" width="137" height="118" rx="8" fill="#fcfdfe" stroke="#2b6cb0" stroke-width="1.4"/>
<text x="185.0" y="132.0" font-size="11.8" fill="#1f2933" text-anchor="start" font-weight="bold">2. Палочки</text>
<text x="185.0" y="152.0" font-size="9.8" fill="#6b7785" text-anchor="start" font-weight="normal">6 лучей из центра</text>
<rect x="185.0" y="180.0" width="32.4" height="18" rx="9" fill="#2b6cb0" opacity="0.12"/><rect x="185.0" y="180.0" width="32.4" height="18" rx="9" fill="none" stroke="#2b6cb0" stroke-width="0.9"/><text x="201.2" y="193.5" font-size="10.5" fill="#2b6cb0" text-anchor="middle" font-weight="bold">ИИ</text>
<line x1="312.0" y1="167.0" x2="310.0" y2="167.0" stroke="#6b7785" stroke-width="1.4"/><polygon points="316.0,167.0 310.0,170.0 310.0,164.0" fill="#6b7785"/>
<rect x="318" y="108" width="137" height="118" rx="8" fill="#fcfdfe" stroke="#1e8449" stroke-width="1.4"/>
<text x="330.0" y="132.0" font-size="11.8" fill="#1f2933" text-anchor="start" font-weight="bold">3. Упаковка</text>
<text x="330.0" y="152.0" font-size="9.8" fill="#6b7785" text-anchor="start" font-weight="normal">площадь листа</text>
<rect x="330.0" y="180.0" width="81.6" height="18" rx="9" fill="#1e8449" opacity="0.12"/><rect x="330.0" y="180.0" width="81.6" height="18" rx="9" fill="none" stroke="#1e8449" stroke-width="0.9"/><text x="370.8" y="193.5" font-size="10.5" fill="#1e8449" text-anchor="middle" font-weight="bold">алгоритм</text>
<line x1="457.0" y1="167.0" x2="455.0" y2="167.0" stroke="#6b7785" stroke-width="1.4"/><polygon points="461.0,167.0 455.0,170.0 455.0,164.0" fill="#6b7785"/>
<rect x="463" y="108" width="137" height="118" rx="8" fill="#fcfdfe" stroke="#1e8449" stroke-width="1.4"/>
<text x="475.0" y="132.0" font-size="11.8" fill="#1f2933" text-anchor="start" font-weight="bold">4. Развёртка</text>
<text x="475.0" y="152.0" font-size="9.8" fill="#6b7785" text-anchor="start" font-weight="normal">линии горы/долины</text>
<rect x="475.0" y="180.0" width="81.6" height="18" rx="9" fill="#1e8449" opacity="0.12"/><rect x="475.0" y="180.0" width="81.6" height="18" rx="9" fill="none" stroke="#1e8449" stroke-width="0.9"/><text x="515.8" y="193.5" font-size="10.5" fill="#1e8449" text-anchor="middle" font-weight="bold">алгоритм</text>
<rect x="28" y="300" width="137" height="118" rx="8" fill="#fcfdfe" stroke="#1e8449" stroke-width="1.4"/>
<text x="40.0" y="324.0" font-size="11.8" fill="#1f2933" text-anchor="start" font-weight="bold">5. Шаги</text>
<text x="40.0" y="344.0" font-size="9.8" fill="#6b7785" text-anchor="start" font-weight="normal">20–30 сгибов</text>
<rect x="40.0" y="372.0" width="81.6" height="18" rx="9" fill="#1e8449" opacity="0.12"/><rect x="40.0" y="372.0" width="81.6" height="18" rx="9" fill="none" stroke="#1e8449" stroke-width="0.9"/><text x="80.8" y="385.5" font-size="10.5" fill="#1e8449" text-anchor="middle" font-weight="bold">алгоритм</text>
<line x1="167.0" y1="359.0" x2="165.0" y2="359.0" stroke="#6b7785" stroke-width="1.4"/><polygon points="171.0,359.0 165.0,362.0 165.0,356.0" fill="#6b7785"/>
<rect x="173" y="300" width="137" height="118" rx="8" fill="#fcfdfe" stroke="#b7791f" stroke-width="1.4"/>
<text x="185.0" y="324.0" font-size="11.8" fill="#1f2933" text-anchor="start" font-weight="bold">6. Проверка</text>
<text x="185.0" y="344.0" font-size="9.8" fill="#6b7785" text-anchor="start" font-weight="normal">Кавасаки, Маэкава</text>
<rect x="185.0" y="372.0" width="81.6" height="18" rx="9" fill="#b7791f" opacity="0.12"/><rect x="185.0" y="372.0" width="81.6" height="18" rx="9" fill="none" stroke="#b7791f" stroke-width="0.9"/><text x="225.8" y="385.5" font-size="10.5" fill="#b7791f" text-anchor="middle" font-weight="bold">проверка</text>
<line x1="312.0" y1="359.0" x2="310.0" y2="359.0" stroke="#6b7785" stroke-width="1.4"/><polygon points="316.0,359.0 310.0,362.0 310.0,356.0" fill="#6b7785"/>
<rect x="318" y="300" width="137" height="118" rx="8" fill="#fcfdfe" stroke="#2b6cb0" stroke-width="1.4"/>
<text x="330.0" y="324.0" font-size="11.8" fill="#1f2933" text-anchor="start" font-weight="bold">7. Оценка вида</text>
<text x="330.0" y="344.0" font-size="9.8" fill="#6b7785" text-anchor="start" font-weight="normal">силуэт + VLM</text>
<rect x="330.0" y="372.0" width="32.4" height="18" rx="9" fill="#2b6cb0" opacity="0.12"/><rect x="330.0" y="372.0" width="32.4" height="18" rx="9" fill="none" stroke="#2b6cb0" stroke-width="0.9"/><text x="346.2" y="385.5" font-size="10.5" fill="#2b6cb0" text-anchor="middle" font-weight="bold">ИИ</text>
<path d="M 531.5,228.0 L 531.5,234.0 L 96.5,234.0" fill="none" stroke="#6b7785" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="96.5" y1="234.0" x2="96.5" y2="290.0" stroke="#6b7785" stroke-width="1.4"/><polygon points="96.5,296.0 93.5,290.0 99.5,290.0" fill="#6b7785"/>
<rect x="473" y="300" width="499" height="118" rx="8" fill="#fcfdfe" stroke="#d5dbe1"/>
<text x="489.0" y="326.0" font-size="12.2" fill="#1f2933" text-anchor="start" font-weight="bold">Кто что делает</text>
<rect x="489.0" y="340.0" width="32.4" height="18" rx="9" fill="#2b6cb0" opacity="0.12"/><rect x="489.0" y="340.0" width="32.4" height="18" rx="9" fill="none" stroke="#2b6cb0" stroke-width="0.9"/><text x="505.2" y="353.5" font-size="10.5" fill="#2b6cb0" text-anchor="middle" font-weight="bold">ИИ</text>
<text x="605.0" y="356.0" font-size="10.4" fill="#6b7785" text-anchor="start" font-weight="normal">придумывает тему, пропорции и критикует вид</text>
<rect x="489.0" y="364.0" width="81.6" height="18" rx="9" fill="#1e8449" opacity="0.12"/><rect x="489.0" y="364.0" width="81.6" height="18" rx="9" fill="none" stroke="#1e8449" stroke-width="0.9"/><text x="529.8" y="377.5" font-size="10.5" fill="#1e8449" text-anchor="middle" font-weight="bold">алгоритм</text>
<text x="605.0" y="380.0" font-size="10.4" fill="#6b7785" text-anchor="start" font-weight="normal">считает упаковку, развёртку и шаги</text>
<rect x="489.0" y="388.0" width="81.6" height="18" rx="9" fill="#b7791f" opacity="0.12"/><rect x="489.0" y="388.0" width="81.6" height="18" rx="9" fill="none" stroke="#b7791f" stroke-width="0.9"/><text x="529.8" y="401.5" font-size="10.5" fill="#b7791f" text-anchor="middle" font-weight="bold">проверка</text>
<text x="605.0" y="404.0" font-size="10.4" fill="#6b7785" text-anchor="start" font-weight="normal">отбрасывает неразрешимые складки</text>
<text x="28.0" y="470.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Почему нельзя просить развёртку «одним куском»:</text>
<rect x="28" y="480" width="944" height="38" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<text x="44.0" y="506.0" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">42–53 %</text>
<text x="196.0" y="506.0" font-size="11.4" fill="#1f2933" text-anchor="start" font-weight="normal">лучшие MLLM на OrigamiSpace (350 задач), эксперты — 98–100 %</text>
<rect x="28" y="526" width="944" height="38" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<text x="44.0" y="552.0" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">28.6 % → 66.9 %</text>
<text x="196.0" y="552.0" font-size="11.4" fill="#1f2933" text-anchor="start" font-weight="normal">тот же GPT-4o, но 10 раундов обратной связи от компилятора развёрток</text>
<rect x="28" y="572" width="944" height="38" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<text x="44.0" y="598.0" font-size="14" fill="#c0392b" text-anchor="start" font-weight="bold">≈60 %</text>
<text x="196.0" y="598.0" font-size="11.4" fill="#1f2933" text-anchor="start" font-weight="normal">потолок плоско-складываемости при прямом дообучении модели на CP</text>
<rect x="28" y="618" width="944" height="38" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<text x="44.0" y="644.0" font-size="14" fill="#b7791f" text-anchor="start" font-weight="bold">100 моделей</text>
<text x="196.0" y="644.0" font-size="11.4" fill="#1f2933" text-anchor="start" font-weight="normal">весь датасет COrigami: размеченных развёрток в мире очень мало</text>
<text x="28.0" y="686.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Правило формулировки:</text>
<text x="28.0" y="710.0" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">просите не развёртку, а «схему из палочек + список шагов»; геометрию считайте сами, а модели оставьте смысл, пропорции и критику вида.</text>
<text x="28.0" y="728.0" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal">Ограничение: движок сегодня не умеет ни второго сгиба на объёмной детали, ни разгиба — значит, шаги 5–6 придётся реализовать до того, как</text>
<text x="28.0" y="744.8" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal">звать ИИ.</text>
</svg>
