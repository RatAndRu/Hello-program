<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<title>Где живёт нейросеть</title>
<rect width="1000" height="720" fill="#ffffff"/>
<text x="28.0" y="42.0" font-size="22" fill="#1f2933" text-anchor="start" font-weight="bold">Где живёт нейросеть: данные, обучение, запуск</text>
<text x="28.0" y="68.0" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">три разные машины; путать их — главная ошибка в планах «обучу на GitHub»</text>
<line x1="28" y1="86" x2="972" y2="86" stroke="#d5dbe1"/>
<rect x="28" y="104" width="300" height="404" rx="10" fill="#fcfdfe" stroke="#2b6cb0" stroke-width="1.4"/>
<text x="44.0" y="132.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Данные</text>
<rect x="42" y="156" width="272" height="100" rx="7" fill="#ffffff" stroke="#d5dbe1"/>
<text x="54.0" y="178.0" font-size="11.6" fill="#2b6cb0" text-anchor="start" font-weight="bold">своё ядро ФОРМЫ</text>
<text x="54.0" y="198.0" font-size="10.2" fill="#1f2933" text-anchor="start" font-weight="normal">случайные сцены → рендер + маска + SDF</text>
<text x="54.0" y="226.0" font-size="9.6" fill="#6b7785" text-anchor="start" font-weight="normal">метки точные, даром</text>
<rect x="42" y="272" width="272" height="100" rx="7" fill="#ffffff" stroke="#d5dbe1"/>
<text x="54.0" y="294.0" font-size="11.6" fill="#2b6cb0" text-anchor="start" font-weight="bold">фото из сети</text>
<text x="54.0" y="314.0" font-size="10.2" fill="#1f2933" text-anchor="start" font-weight="normal">100–50 000 снимков</text>
<text x="54.0" y="342.0" font-size="9.6" fill="#6b7785" text-anchor="start" font-weight="normal">метки руками или готовой моделью</text>
<rect x="42" y="388" width="272" height="100" rx="7" fill="#ffffff" stroke="#d5dbe1"/>
<text x="54.0" y="410.0" font-size="11.6" fill="#2b6cb0" text-anchor="start" font-weight="bold">разметка</text>
<text x="54.0" y="430.0" font-size="10.2" fill="#1f2933" text-anchor="start" font-weight="normal">маска, кромки, габарит</text>
<text x="54.0" y="458.0" font-size="9.6" fill="#6b7785" text-anchor="start" font-weight="normal">SAM/Depth Anything вместо человека</text>
<line x1="330.0" y1="306.0" x2="341.0" y2="306.0" stroke="#6b7785" stroke-width="1.6"/><polygon points="348.0,306.0 341.0,309.5 341.0,302.5" fill="#6b7785"/>
<rect x="350" y="104" width="300" height="404" rx="10" fill="#fcfdfe" stroke="#b7791f" stroke-width="1.4"/>
<text x="366.0" y="132.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Обучение</text>
<rect x="364" y="156" width="272" height="100" rx="7" fill="#ffffff" stroke="#d5dbe1"/>
<text x="376.0" y="178.0" font-size="11.6" fill="#b7791f" text-anchor="start" font-weight="bold">ноутбук, 2 ядра</text>
<text x="376.0" y="198.0" font-size="10.2" fill="#1f2933" text-anchor="start" font-weight="normal">150 GFLOP/s, 1–2 дня на голову</text>
<text x="376.0" y="226.0" font-size="9.6" fill="#6b7785" text-anchor="start" font-weight="normal">бесплатно, медленно</text>
<rect x="364" y="272" width="272" height="100" rx="7" fill="#ffffff" stroke="#d5dbe1"/>
<text x="376.0" y="294.0" font-size="11.6" fill="#b7791f" text-anchor="start" font-weight="bold">GitHub runner, 4 ядра</text>
<text x="376.0" y="314.0" font-size="10.2" fill="#1f2933" text-anchor="start" font-weight="normal">6 ч на job, без GPU</text>
<text x="376.0" y="342.0" font-size="9.6" fill="#6b7785" text-anchor="start" font-weight="normal">бесплатно для публичных репо</text>
<rect x="364" y="388" width="272" height="100" rx="7" fill="#ffffff" stroke="#d5dbe1"/>
<text x="376.0" y="410.0" font-size="11.6" fill="#b7791f" text-anchor="start" font-weight="bold">GPU в аренду</text>
<text x="376.0" y="430.0" font-size="10.2" fill="#1f2933" text-anchor="start" font-weight="normal">T4-класс, 1–3 ч на голову</text>
<text x="376.0" y="458.0" font-size="9.6" fill="#6b7785" text-anchor="start" font-weight="normal">10–30 ₽/ч, нужен за рубежом</text>
<line x1="652.0" y1="306.0" x2="663.0" y2="306.0" stroke="#6b7785" stroke-width="1.6"/><polygon points="670.0,306.0 663.0,309.5 663.0,302.5" fill="#6b7785"/>
<rect x="672" y="104" width="300" height="404" rx="10" fill="#fcfdfe" stroke="#1e8449" stroke-width="1.4"/>
<text x="688.0" y="132.0" font-size="15" fill="#1f2933" text-anchor="start" font-weight="bold">Запуск</text>
<rect x="686" y="156" width="272" height="100" rx="7" fill="#ffffff" stroke="#d5dbe1"/>
<text x="698.0" y="178.0" font-size="11.6" fill="#1e8449" text-anchor="start" font-weight="bold">ноутбук, ONNX</text>
<text x="698.0" y="198.0" font-size="10.2" fill="#1f2933" text-anchor="start" font-weight="normal">1–20 M параметров → 45 мс</text>
<text x="698.0" y="226.0" font-size="9.6" fill="#6b7785" text-anchor="start" font-weight="normal">5–80 МБ, без интернета</text>
<rect x="686" y="272" width="272" height="100" rx="7" fill="#ffffff" stroke="#d5dbe1"/>
<text x="698.0" y="294.0" font-size="11.6" fill="#1e8449" text-anchor="start" font-weight="bold">браузер, WASM</text>
<text x="698.0" y="314.0" font-size="10.2" fill="#1f2933" text-anchor="start" font-weight="normal">то же, 100–300 мс</text>
<text x="698.0" y="342.0" font-size="9.6" fill="#6b7785" text-anchor="start" font-weight="normal">вместе с игрой на GitHub Pages</text>
<rect x="686" y="388" width="272" height="100" rx="7" fill="#ffffff" stroke="#d5dbe1"/>
<text x="698.0" y="410.0" font-size="11.6" fill="#1e8449" text-anchor="start" font-weight="bold">сервер</text>
<text x="698.0" y="430.0" font-size="10.2" fill="#1f2933" text-anchor="start" font-weight="normal">только если модель большая</text>
<text x="698.0" y="458.0" font-size="9.6" fill="#6b7785" text-anchor="start" font-weight="normal">дорого, нужен хостинг</text>
<text x="28.0" y="552.0" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold">Что это значит на практике</text>
<text x="28.0" y="576.0" font-size="11.8" fill="#1f2933" text-anchor="start" font-weight="normal">Данные делает наше ядро, обучение — чужая машина на несколько часов, запуск — ноутбук и браузер. GitHub стоит только в середине и только</text>
<text x="28.0" y="592.5" font-size="11.8" fill="#1f2933" text-anchor="start" font-weight="normal">для маленьких сетей: 4 ядра, 16 ГБ, 14 ГБ диска, 6 часов на job, без GPU.</text>
<rect x="28" y="628" width="944" height="64" rx="8" fill="#eef3f9" stroke="#2b6cb0"/>
<text x="44.0" y="652.0" font-size="13" fill="#2b6cb0" text-anchor="start" font-weight="bold">1,7–4,4 M параметров</text>
<text x="268.0" y="652.0" font-size="11.6" fill="#1f2933" text-anchor="start" font-weight="normal">обучается за 2 job'а по 6 ч</text>
<text x="560.0" y="652.0" font-size="12.4" fill="#1e8449" text-anchor="start" font-weight="bold">17 МБ весов</text>
<text x="660.0" y="652.0" font-size="11.6" fill="#1f2933" text-anchor="start" font-weight="normal">45 мс на кадр на CPU</text>
<text x="44.0" y="676.0" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">70 M и больше</text>
<text x="268.0" y="676.0" font-size="11.6" fill="#1f2933" text-anchor="start" font-weight="normal">уже 15–27 job'ов, недели</text>
<text x="560.0" y="676.0" font-size="12.4" fill="#c0392b" text-anchor="start" font-weight="bold">~1 млрд (TripoSR)</text>
<text x="700.0" y="676.0" font-size="11.6" fill="#1f2933" text-anchor="start" font-weight="normal">10³–10⁵ GPU-часов</text>
</svg>
