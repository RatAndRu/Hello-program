<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<title>Сеть и геометрия</title>
<rect width="1000" height="700" fill="#ffffff"/>
<text x="28.0" y="42.0" font-size="22" fill="#1f2933" text-anchor="start" font-weight="bold">Что делает сеть, а что геометрия: граница проходит по проверяемости</text>
<text x="28.0" y="68.0" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">сеть выдаёт числа-подсказки; всё, что можно посчитать точно, считает ядро</text>
<line x1="28" y1="86" x2="972" y2="86" stroke="#d5dbe1"/>
<rect x="28" y="100" width="944" height="128" rx="9" fill="#eef7f0" stroke="#1e8449"/>
<text x="44.0" y="124.0" font-size="12.6" fill="#1e8449" text-anchor="start" font-weight="bold">НЕЙРОСЕТЬ — там, где правила нет</text>
<rect x="28" y="242" width="944" height="128" rx="9" fill="#f7fafc" stroke="#2b6cb0"/>
<text x="44.0" y="266.0" font-size="12.6" fill="#2b6cb0" text-anchor="start" font-weight="bold">ЯДРО — там, где есть формула или проверка</text>
<rect x="44" y="140" width="168" height="70" rx="7" fill="#ffffff" stroke="#1e8449"/>
<text x="128.0" y="166.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">картинка</text>
<text x="128.0" y="183.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">или текст</text>
<rect x="236" y="140" width="168" height="70" rx="7" fill="#ffffff" stroke="#1e8449"/>
<text x="320.0" y="166.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">маска</text>
<text x="320.0" y="183.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">силуэта</text>
<rect x="428" y="140" width="168" height="70" rx="7" fill="#ffffff" stroke="#1e8449"/>
<text x="512.0" y="166.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">20 чисел:</text>
<text x="512.0" y="183.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">габарит, наклон</text>
<rect x="620" y="140" width="168" height="70" rx="7" fill="#ffffff" stroke="#1e8449"/>
<text x="704.0" y="166.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">токены DSL:</text>
<text x="704.0" y="183.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">примитив + числа</text>
<line x1="214.0" y1="175.0" x2="226.0" y2="175.0" stroke="#1e8449" stroke-width="1.5"/><polygon points="232.0,175.0 226.0,178.0 226.0,172.0" fill="#1e8449"/>
<line x1="406.0" y1="175.0" x2="418.0" y2="175.0" stroke="#1e8449" stroke-width="1.5"/><polygon points="424.0,175.0 418.0,178.0 418.0,172.0" fill="#1e8449"/>
<line x1="598.0" y1="175.0" x2="610.0" y2="175.0" stroke="#1e8449" stroke-width="1.5"/><polygon points="616.0,175.0 610.0,178.0 610.0,172.0" fill="#1e8449"/>
<rect x="44" y="282" width="168" height="70" rx="7" fill="#ffffff" stroke="#2b6cb0"/>
<text x="128.0" y="308.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">разбор</text>
<text x="128.0" y="325.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">сценария</text>
<rect x="236" y="282" width="168" height="70" rx="7" fill="#ffffff" stroke="#2b6cb0"/>
<text x="320.0" y="308.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">сборка</text>
<text x="320.0" y="325.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">тел</text>
<rect x="428" y="282" width="168" height="70" rx="7" fill="#ffffff" stroke="#2b6cb0"/>
<text x="512.0" y="308.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">проверки</text>
<text x="512.0" y="325.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">25 правил</text>
<rect x="620" y="282" width="168" height="70" rx="7" fill="#ffffff" stroke="#2b6cb0"/>
<text x="704.0" y="308.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">метрики</text>
<text x="704.0" y="325.0" font-size="10.6" fill="#1f2933" text-anchor="middle" font-weight="normal">точные</text>
<line x1="214.0" y1="317.0" x2="226.0" y2="317.0" stroke="#2b6cb0" stroke-width="1.5"/><polygon points="232.0,317.0 226.0,320.0 226.0,314.0" fill="#2b6cb0"/>
<line x1="406.0" y1="317.0" x2="418.0" y2="317.0" stroke="#2b6cb0" stroke-width="1.5"/><polygon points="424.0,317.0 418.0,320.0 418.0,314.0" fill="#2b6cb0"/>
<line x1="598.0" y1="317.0" x2="610.0" y2="317.0" stroke="#2b6cb0" stroke-width="1.5"/><polygon points="616.0,317.0 610.0,320.0 610.0,314.0" fill="#2b6cb0"/>
<line x1="704.0" y1="278.0" x2="704.0" y2="220.0" stroke="#6b7785" stroke-width="1.4"/><polygon points="704.0,214.0 707.0,220.0 701.0,220.0" fill="#6b7785"/>
<text x="716.0" y="250.0" font-size="9.4" fill="#6b7785" text-anchor="start" font-weight="normal">проверка не прошла — назад в сеть</text>
<text x="28.0" y="404.0" font-size="12.6" fill="#1f2933" text-anchor="start" font-weight="bold">Сколько параметров нужно, чтобы это работало</text>
<line x1="120" y1="470" x2="940" y2="470" stroke="#d5dbe1" stroke-width="2"/>
<line x1="120" y1="463" x2="120" y2="477" stroke="#1e8449" stroke-width="2"/>
<circle cx="120" cy="470" r="4" fill="#1e8449"/>
<text x="120.0" y="456.0" font-size="10.6" fill="#1e8449" text-anchor="start" font-weight="bold">0,14 M</text>
<text x="120.0" y="494.0" font-size="9.2" fill="#6b7785" text-anchor="start" font-weight="normal">эта демонстрация</text>
<line x1="407" y1="463" x2="407" y2="477" stroke="#1e8449" stroke-width="2"/>
<circle cx="407" cy="470" r="4" fill="#1e8449"/>
<text x="407.0" y="456.0" font-size="10.6" fill="#1e8449" text-anchor="middle" font-weight="bold">0,1–1 M</text>
<text x="407.0" y="494.0" font-size="9.2" fill="#6b7785" text-anchor="middle" font-weight="normal">голова: 20 чисел</text>
<line x1="612" y1="463" x2="612" y2="477" stroke="#b7791f" stroke-width="2"/>
<circle cx="612" cy="470" r="4" fill="#b7791f"/>
<text x="612.0" y="456.0" font-size="10.6" fill="#b7791f" text-anchor="middle" font-weight="bold">4,4 M</text>
<text x="612.0" y="494.0" font-size="9.2" fill="#6b7785" text-anchor="middle" font-weight="normal">SDF 32³, 12,7 ч</text>
<line x1="776" y1="463" x2="776" y2="477" stroke="#c0392b" stroke-width="2"/>
<circle cx="776" cy="470" r="4" fill="#c0392b"/>
<text x="776.0" y="456.0" font-size="10.6" fill="#c0392b" text-anchor="middle" font-weight="bold">70 M</text>
<text x="776.0" y="494.0" font-size="9.2" fill="#6b7785" text-anchor="middle" font-weight="normal">U-Net 96, 6,8 сут</text>
<line x1="915" y1="463" x2="915" y2="477" stroke="#c0392b" stroke-width="2"/>
<circle cx="915" cy="470" r="4" fill="#c0392b"/>
<text x="915.4" y="456.0" font-size="10.6" fill="#c0392b" text-anchor="middle" font-weight="bold">~1000 M</text>
<text x="915.4" y="494.0" font-size="9.2" fill="#6b7785" text-anchor="middle" font-weight="normal">TripoSR: 10³–10⁵ GPU-ч</text>
<text x="28.0" y="530.0" font-size="11.2" fill="#1f2933" text-anchor="start" font-weight="normal">Слева — то, что считается на ноутбуке за минуты и даёт проверяемый результат. Справа — то, что требует GPU, недель и всё равно ошибается: большая</text>
<text x="28.0" y="545.7" font-size="11.2" fill="#1f2933" text-anchor="start" font-weight="normal">модель не гарантирует правильной геометрии, она гарантирует только правдоподобную картинку.</text>
<text x="28.0" y="586.0" font-size="11.2" fill="#6b7785" text-anchor="start" font-weight="normal">Поэтому у нас сеть отвечает за выбор и оценку, а сборку, топологию и допуски делает код, у которого есть ответ «да/нет». Это не компромисс, а</text>
<text x="28.0" y="601.7" font-size="11.2" fill="#6b7785" text-anchor="start" font-weight="normal">разделение ответственности: у чисел сети нет способа доказать свою правоту.</text>
</svg>
