<text x="28.0" y="786.0" font-size="12.2" fill="#1f2933" text-anchor="start" font-weight="normal">«Только эти два» — не придирка: восемь из двенадцати сгибов физически остаются тем же перегибом листа, но требуют нового слоя, новой</text>
