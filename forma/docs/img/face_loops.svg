<circle cx="299" cy="282" r="8.5" fill="#b7791f"/>
<text x="299" y="286" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<circle cx="211" cy="404" r="8.5" fill="#1e8449"/>
<text x="211" y="408" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<circle cx="339" cy="404" r="8.5" fill="#1e8449"/>
<text x="339" y="408" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text>
<circle cx="242" cy="364" r="8.5" fill="#b7791f"/>
<text x="242" y="368" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<circle cx="308" cy="364" r="8.5" fill="#b7791f"/>
<text x="308" y="368" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="bold">3</text>
<text x="275" y="600" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">орбитальная петля + 2 кольца наружу, петля по кромке века</text>
<text x="275" y="620" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">оральная петля: кромка + 2–3 кольца + ряд внутрь</text>
<text x="275" y="640" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="normal">петли носа уходят вниз к рту, а не в щёку</text>
<ellipse cx="720" cy="340" rx="150.0" ry="200.0" fill="#fffafa" stroke="#c0392b" stroke-width="2"/>
<text x="720" y="118" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">неправильно</text>
