<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="812" viewBox="0 0 1000 812" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<title>Карта петель лица</title>
<rect width="1000" height="812" fill="#ffffff"/>
<text x="28" y="38" font-size="22" fill="#1f2933" text-anchor="start" font-weight="bold">Карта петель лица: что правильно и что нет</text>
<text x="28" y="62" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">Орбитальная и оральная петли строятся первыми; полюса — только на плоском. Справа — типичные ошибки новичка.</text>
<ellipse cx="275" cy="340" rx="150.0" ry="200.0" fill="#fbfefc" stroke="#1e8449" stroke-width="2"/>
<text x="275" y="118" font-size="15" fill="#1e8449" text-anchor="middle" font-weight="bold">правильно</text>
