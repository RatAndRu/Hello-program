<text x="778" y="284" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<circle cx="664" cy="412" r="11.5" fill="#c0392b"/>
<text x="664" y="416" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<circle cx="776" cy="412" r="11.5" fill="#c0392b"/>
<text x="776" y="416" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">6</text>
<circle cx="720" cy="440" r="11.5" fill="#c0392b"/>
<text x="720" y="444" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">8</text>
<ellipse cx="720" cy="412" rx="56" ry="24" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="720" y="600" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">петли идут поперёк мышц и через глаз / рот</text>
<text x="720" y="620" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">полюса 6 и 8 — в самых подвижных точках</text>
<text x="720" y="640" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="normal">плотность ровная «как получилось»</text>
<line x1="60" y1="686" x2="940" y2="686" stroke="#d5dbe1"/>
<circle cx="67" cy="710" r="7" fill="#2b6cb0"/>
<text x="82" y="714" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">орбитальная и носовая петли</text>
<circle cx="537" cy="710" r="7" fill="#8e44ad"/>
<text x="552" y="714" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">оральная петля</text>
<circle cx="67" cy="734" r="7" fill="#6b7785"/>
<text x="82" y="738" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">носогубная связка</text>
<circle cx="537" cy="734" r="7" fill="#1e8449"/>
<text x="552" y="738" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">5-полюс: разводка на скуле и уголке рта</text>
<circle cx="67" cy="758" r="7" fill="#b7791f"/>
<text x="82" y="762" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">3-полюс: терминатор у слёзника и ноздри</text>
<text x="60" y="800" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">6-полюс на деформации запрещён. Полюс в уголке рта неизбежен — его отодвигают на 1–2 квада наружу, а не оставляют в подвижной точке.</text>
</svg>
