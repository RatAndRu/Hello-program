<text x="478" y="644" font-size="12" fill="#2b6cb0" text-anchor="middle" font-weight="bold">тело с толщиной h</text>
<text x="648" y="488" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Те же правила у lathe (вращение)</text>
<text x="648" y="510" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">и sweep (протяжка по пути).</text>
<text x="648" y="532" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal"></text>
<text x="648" y="554" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Дуга не «тоньше» линии: она задаёт</text>
<text x="648" y="576" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">форму, а размер детали задаёт</text>
<text x="648" y="598" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">операция над контуром.</text>
<text x="648" y="620" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal"></text>
<text x="648" y="642" font-size="12" fill="#1e8449" text-anchor="start" font-weight="normal">Нужен график кривой в DSL, а не её</text>
<text x="648" y="664" font-size="12" fill="#1e8449" text-anchor="start" font-weight="normal">копия из точек.</text>
