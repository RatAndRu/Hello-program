<text x="198" y="344" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">70 точек · 140 чисел</text>
<text x="198" y="364" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">шаг 5.67 мм, связь с радиусом потеряна</text>
<ellipse cx="458" cy="254" rx="88" ry="62" fill="rgba(30,132,73,.06)" stroke="#1e8449" stroke-width="1.8"/>
<line x1="370" y1="254" x2="546" y2="254" stroke="#1e8449" stroke-width="0.9" stroke-dasharray="4 4"/>
<line x1="458" y1="192" x2="458" y2="316" stroke="#1e8449" stroke-width="0.9" stroke-dasharray="4 4"/>
<text x="458" y="344" font-size="12" fill="#1e8449" text-anchor="middle" font-weight="bold">2 числа · дуга остаётся дугой</text>
<text x="458" y="364" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">отклонение от идеального эллипса 0.27 мм</text>
<text x="648" y="200" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Что видно: контур «почти эллипс»</text>
<text x="648" y="222" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">(0.27 мм), но записан как данные.</text>
<text x="648" y="244" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal"></text>
<text x="648" y="266" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Профиль в DSL принимает только</text>
<text x="648" y="288" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal">[[x, y], …] — подать кривую нечем,</text>
<text x="648" y="310" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal">поэтому её копируют точками.</text>
<text x="648" y="332" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal"></text>
<text x="648" y="354" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">При правке радиуса список надо</text>
<text x="648" y="376" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">пересчитывать целиком.</text>
<rect x="28" y="392" width="944" height="268" rx="8" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="392" width="5" height="268" rx="2" fill="#1e8449"/>
<text x="48" y="424" font-size="15.5" fill="#1f2933" text-anchor="start" font-weight="bold">2. У линии нет толщины — толщину даёт операция</text>
<text x="48" y="447" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">контур задаёт сечение; тело появляется на выдавливании, вращении или протяжке</text>
