<text x="48" y="946" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal">профиль зуба, развёрнутый по радиусу</text>
<line x1="408" y1="780" x2="434" y2="780" stroke="#1e8449" stroke-width="2.4"/>
<text x="444" y="784" font-size="12" fill="#1e8449" text-anchor="start" font-weight="bold">эвольвента — нужна кривая (40+ точек)</text>
<line x1="408" y1="810" x2="434" y2="810" stroke="#c0392b" stroke-width="2.4" stroke-dasharray="6 3"/>
<text x="444" y="814" font-size="12" fill="#c0392b" text-anchor="start" font-weight="bold">трапеция из 4 точек — как сейчас</text>
<text x="408" y="848" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Модуль 2 мм, 20 зубьев: профили</text>
<text x="408" y="870" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">расходятся на 0.41 мм.</text>
<text x="408" y="892" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal"></text>
<text x="408" y="914" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Толщина зуба на вершине:</text>
<text x="408" y="936" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal">2.21 мм у трапеции против 1.39 мм</text>
<text x="408" y="958" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal">у эвольвенты — на 59 % толще.</text>
<text x="408" y="980" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">Такой зуб не сядет в паз настоящей</text>
