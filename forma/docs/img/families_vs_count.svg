<text x="48" y="136" font-size="15.5" fill="#1f2933" text-anchor="start" font-weight="bold">A. Пять видов пружин — одна основа, разные концы и профиль</text>
<text x="48" y="159" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">сжатия, растяжения, кручения, тарельчатая (Belleville), волновая</text>
