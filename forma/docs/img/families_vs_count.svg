<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="995" viewBox="0 0 1000 995" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<title>Семейства вместо количества</title>
<rect width="1000" height="995" fill="#ffffff"/>
<text x="28" y="42" font-size="22" fill="#1f2933" text-anchor="start" font-weight="bold">Семейства вместо количества: цена команды и цена варианта</text>
<text x="28" y="68" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">Числа посчитаны по реестру команд репозитория; внешние замеры по выбору инструментов — в тексте со ссылками.</text>
<line x1="28" y1="86" x2="972" y2="86" stroke="#d5dbe1"/>
