<text x="310" y="322" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">концы — крючки</text>
<ellipse cx="476.5" cy="226" rx="7" ry="30" fill="none" stroke="#2b6cb0" stroke-width="1.9"/>
