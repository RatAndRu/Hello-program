<text x="868" y="304" font-size="12" fill="#1f2933" text-anchor="middle" font-weight="bold">волновая</text>
<text x="868" y="322" font-size="11" fill="#6b7785" text-anchor="middle" font-weight="normal">торец — волна</text>
<text x="48" y="344" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">Основа одна: винтовая линия или тело вращения. Отличаются концы, профиль витка и число витков.</text>
<rect x="28" y="372" width="944" height="250" rx="8" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="372" width="5" height="250" rx="2" fill="#b7791f"/>
<text x="48" y="404" font-size="15.5" fill="#1f2933" text-anchor="start" font-weight="bold">B. Сколько стоит одна команда в промпте агента</text>
<text x="48" y="427" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">посчитано по forma/instruction.py: 227 команд, знаки в UTF-8</text>
<text x="361" y="461" font-size="11.5" fill="#6b7785" text-anchor="end" font-weight="normal">описание команды в реестре</text>
<rect x="373" y="447" width="82.2" height="18" rx="3" fill="#1f2933" opacity="0.85"/>
<text x="463.2015859030837" y="461" font-size="11.5" fill="#1f2933" text-anchor="start" font-weight="bold">343 зн. ≈ 107 токенов</text>
<text x="361" y="493" font-size="11.5" fill="#6b7785" text-anchor="end" font-weight="normal">строка команды в полном каталоге</text>
<rect x="373" y="479" width="281.5" height="18" rx="3" fill="#2b6cb0" opacity="0.85"/>
<text x="662.4777092511013" y="493" font-size="11.5" fill="#2b6cb0" text-anchor="start" font-weight="bold">1173 зн. ≈ 367 токенов</text>
<text x="361" y="525" font-size="11.5" fill="#6b7785" text-anchor="end" font-weight="normal">одно значение variant</text>
<rect x="373" y="511" width="15.6" height="18" rx="3" fill="#1e8449" opacity="0.85"/>
<text x="396.6" y="525" font-size="11.5" fill="#1e8449" text-anchor="start" font-weight="bold">65 зн. ≈ 20 токенов</text>
<text x="48" y="556" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Реестр 227 команд: 77749 знаков ≈ 24297 токенов. Каталог «все команды»: 83 тыс. токенов.</text>
<text x="48" y="578" font-size="12" fill="#c0392b" text-anchor="start" font-weight="normal">Инструкция целиком: 283500 знаков ≈ 88594 тыс. токенов — это уже почти всё окно модели.</text>
<text x="48" y="600" font-size="12" fill="#1e8449" text-anchor="start" font-weight="normal">+26 команд × 367 токенов ≈ 9.5 тыс. токенов; +60 значений variant × 20 ≈ 1.2 тыс.</text>
<rect x="28" y="638" width="944" height="320" rx="8" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="638" width="5" height="320" rx="2" fill="#1e8449"/>
<text x="48" y="670" font-size="15.5" fill="#1f2933" text-anchor="start" font-weight="bold">C. Вариант внутри команды против новой команды</text>
<text x="48" y="693" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">одинаковое покрытие — разная цена в выборе и в промпте</text>
<text x="68" y="730" font-size="13" fill="#c0392b" text-anchor="start" font-weight="bold">ПЯТЬ КОМАНД</text>
<text x="528" y="730" font-size="13" fill="#1e8449" text-anchor="start" font-weight="bold">ОДНА КОМАНДА С ВАРИАНТОМ</text>
<rect x="68" y="742" width="330" height="24" rx="4" fill="#fdeceb" stroke="#c0392b" stroke-width="0.8"/>
<text x="78" y="760" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="normal">spring_compression</text>
<rect x="68" y="768" width="330" height="24" rx="4" fill="#fdeceb" stroke="#c0392b" stroke-width="0.8"/>
<text x="78" y="786" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="normal">spring_extension</text>
<rect x="68" y="794" width="330" height="24" rx="4" fill="#fdeceb" stroke="#c0392b" stroke-width="0.8"/>
<text x="78" y="812" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="normal">spring_torsion</text>
<rect x="68" y="820" width="330" height="24" rx="4" fill="#fdeceb" stroke="#c0392b" stroke-width="0.8"/>
<text x="78" y="838" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="normal">spring_disc</text>
<rect x="68" y="846" width="330" height="24" rx="4" fill="#fdeceb" stroke="#c0392b" stroke-width="0.8"/>
<text x="78" y="864" font-size="12.5" fill="#c0392b" text-anchor="start" font-weight="normal">spring_wave</text>
<text x="68" y="890" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal">пять описаний, пять примеров, пять мест, где можно ошибиться</text>
<rect x="528" y="740" width="330" height="192" rx="6" fill="#eaf5ee" stroke="#1e8449" stroke-width="1.2"/>
<text x="540" y="764" font-size="13" fill="#1e8449" text-anchor="start" font-weight="bold">spring variant=…</text>
<text x="554" y="784" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">· сжатия</text>
<text x="554" y="803" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">· растяжения</text>
<text x="554" y="822" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">· кручения</text>
<text x="554" y="841" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">· тарельчатая</text>
<text x="554" y="860" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">· волновая</text>
<text x="540" y="916" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal">одно описание, общая физика, проверка одна</text>
<text x="48" y="936" font-size="12" fill="#1f2933" text-anchor="start" font-weight="normal">Правило: новый примитив — только если у формы другая геометрия, а не другой режим работы той же геометрии.</text>
</svg>
