<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<title>Слои игрового движка</title>
<rect width="1000" height="830" fill="#ffffff"/>
<text x="28.0" y="42.0" font-size="22" fill="#1f2933" text-anchor="start" font-weight="bold">Двенадцать слоёв игрового движка: что из этого у нас уже есть</text>
<text x="28.0" y="68.0" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">слева — слой и его работа; в середине — порядок объёма кода; справа — статус в ФОРМЕ</text>
<line x1="28" y1="86" x2="972" y2="86" stroke="#d5dbe1"/>
<rect x="28" y="100" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="100" width="3.5" height="46" fill="#c0392b"/>
<text x="44.0" y="120.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">1. Рантайм и память</text>
<text x="44.0" y="137.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">запуск сцены, сборка мусора, горячая перезагрузка скриптов</text>
<text x="520.0" y="127.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁴–10⁵</text>
<rect x="660.0" y="112.0" width="36.2" height="18" rx="9" fill="#c0392b" opacity="0.12"/><rect x="660.0" y="112.0" width="36.2" height="18" rx="9" fill="none" stroke="#c0392b" stroke-width="0.9"/><text x="678.1" y="125.5" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="bold">нет</text>
<rect x="28" y="152" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="152" width="3.5" height="46" fill="#b7791f"/>
<text x="44.0" y="172.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">2. Сериализация сцены</text>
<text x="44.0" y="189.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">сцены и префабы как файлы, ссылки на ассеты, миграции</text>
<text x="520.0" y="179.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁴</text>
<rect x="660.0" y="164.0" width="102.2" height="18" rx="9" fill="#b7791f" opacity="0.12"/><rect x="660.0" y="164.0" width="102.2" height="18" rx="9" fill="none" stroke="#b7791f" stroke-width="0.9"/><text x="711.1" y="177.5" font-size="10.5" fill="#b7791f" text-anchor="middle" font-weight="bold">нет (есть DSL)</text>
<rect x="28" y="204" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="204" width="3.5" height="46" fill="#1e8449"/>
<text x="44.0" y="224.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">3. Рендерер</text>
<text x="44.0" y="241.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">конвейеры, шейдеры, тени, постобработка, батчинг</text>
<text x="520.0" y="231.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁵–10⁶</text>
<rect x="660.0" y="216.0" width="108.5" height="18" rx="9" fill="#1e8449" opacity="0.12"/><rect x="660.0" y="216.0" width="108.5" height="18" rx="9" fill="none" stroke="#1e8449" stroke-width="0.9"/><text x="714.2" y="229.5" font-size="10.5" fill="#1e8449" text-anchor="middle" font-weight="bold">чужой: three.js</text>
<rect x="28" y="256" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="256" width="3.5" height="46" fill="#b7791f"/>
<text x="44.0" y="276.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">4. Физика</text>
<text x="44.0" y="293.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">столкновения, твёрдые тела, шарниры, ткань</text>
<text x="520.0" y="283.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁵</text>
<rect x="660.0" y="268.0" width="150.8" height="18" rx="9" fill="#b7791f" opacity="0.12"/><rect x="660.0" y="268.0" width="150.8" height="18" rx="9" fill="none" stroke="#b7791f" stroke-width="0.9"/><text x="735.4" y="281.5" font-size="10.5" fill="#b7791f" text-anchor="middle" font-weight="bold">чужой: не подключён</text>
<rect x="28" y="308" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="308" width="3.5" height="46" fill="#b7791f"/>
<text x="44.0" y="328.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">5. Анимация</text>
<text x="44.0" y="345.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">скелет, морфы, стейт-машины, кривые</text>
<text x="520.0" y="335.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁴–10⁵</text>
<rect x="660.0" y="320.0" width="130.5" height="18" rx="9" fill="#b7791f" opacity="0.12"/><rect x="660.0" y="320.0" width="130.5" height="18" rx="9" fill="none" stroke="#b7791f" stroke-width="0.9"/><text x="725.2" y="333.5" font-size="10.5" fill="#b7791f" text-anchor="middle" font-weight="bold">часть: morph, keys</text>
<rect x="28" y="360" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="360" width="3.5" height="46" fill="#b7791f"/>
<text x="44.0" y="380.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">6. Импорт ассетов</text>
<text x="44.0" y="397.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">FBX/GLB/PNG/звук → внутренний формат и GUID</text>
<text x="520.0" y="387.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁴</text>
<rect x="660.0" y="372.0" width="138.5" height="18" rx="9" fill="#b7791f" opacity="0.12"/><rect x="660.0" y="372.0" width="138.5" height="18" rx="9" fill="none" stroke="#b7791f" stroke-width="0.9"/><text x="729.2" y="385.5" font-size="10.5" fill="#b7791f" text-anchor="middle" font-weight="bold">часть: GLB, OBJ, STL</text>
<rect x="28" y="412" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="412" width="3.5" height="46" fill="#c0392b"/>
<text x="44.0" y="432.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">7. Звук</text>
<text x="44.0" y="449.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">микшер, 3D-панорама, события</text>
<text x="520.0" y="439.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁴</text>
<rect x="660.0" y="424.0" width="36.2" height="18" rx="9" fill="#c0392b" opacity="0.12"/><rect x="660.0" y="424.0" width="36.2" height="18" rx="9" fill="none" stroke="#c0392b" stroke-width="0.9"/><text x="678.1" y="437.5" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="bold">нет</text>
<rect x="28" y="464" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="464" width="3.5" height="46" fill="#c0392b"/>
<text x="44.0" y="484.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">8. Ввод и UI</text>
<text x="44.0" y="501.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">клавиши, геймпад, канвас, раскладка</text>
<text x="520.0" y="491.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁴</text>
<rect x="660.0" y="476.0" width="36.2" height="18" rx="9" fill="#c0392b" opacity="0.12"/><rect x="660.0" y="476.0" width="36.2" height="18" rx="9" fill="none" stroke="#c0392b" stroke-width="0.9"/><text x="678.1" y="489.5" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="bold">нет</text>
<rect x="28" y="516" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="516" width="3.5" height="46" fill="#c0392b"/>
<text x="44.0" y="536.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">9. Навигация и ИИ</text>
<text x="44.0" y="553.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">сетка проходимости, поиск пути, поведение</text>
<text x="520.0" y="543.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁴</text>
<rect x="660.0" y="528.0" width="36.2" height="18" rx="9" fill="#c0392b" opacity="0.12"/><rect x="660.0" y="528.0" width="36.2" height="18" rx="9" fill="none" stroke="#c0392b" stroke-width="0.9"/><text x="678.1" y="541.5" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="bold">нет</text>
<rect x="28" y="568" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="568" width="3.5" height="46" fill="#b7791f"/>
<text x="44.0" y="588.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">10. Редактор</text>
<text x="44.0" y="605.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">инспектор, гизмо, undo, режим Play</text>
<text x="520.0" y="595.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁵</text>
<rect x="660.0" y="580.0" width="118.2" height="18" rx="9" fill="#b7791f" opacity="0.12"/><rect x="660.0" y="580.0" width="118.2" height="18" rx="9" fill="none" stroke="#b7791f" stroke-width="0.9"/><text x="719.1" y="593.5" font-size="10.5" fill="#b7791f" text-anchor="middle" font-weight="bold">свой, но простой</text>
<rect x="28" y="620" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="620" width="3.5" height="46" fill="#b7791f"/>
<text x="44.0" y="640.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">11. Сборка под платформы</text>
<text x="44.0" y="657.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">Windows, Web, Android, консоли, подпись</text>
<text x="520.0" y="647.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁴–10⁵</text>
<rect x="660.0" y="632.0" width="107.0" height="18" rx="9" fill="#b7791f" opacity="0.12"/><rect x="660.0" y="632.0" width="107.0" height="18" rx="9" fill="none" stroke="#b7791f" stroke-width="0.9"/><text x="713.5" y="645.5" font-size="10.5" fill="#b7791f" text-anchor="middle" font-weight="bold">Web (GLB), exe</text>
<rect x="28" y="672" width="944" height="46" rx="6" fill="#fcfdfe" stroke="#d5dbe1"/>
<rect x="28" y="672" width="3.5" height="46" fill="#c0392b"/>
<text x="44.0" y="692.0" font-size="12.4" fill="#1f2933" text-anchor="start" font-weight="bold">12. Сеть и сервисы</text>
<text x="44.0" y="709.0" font-size="10.2" fill="#6b7785" text-anchor="start" font-weight="normal">мультиплеер, аккаунты, магазин, аналитика</text>
<text x="520.0" y="699.0" font-size="11" fill="#2b6cb0" text-anchor="start" font-weight="normal">10⁴</text>
<rect x="660.0" y="684.0" width="36.2" height="18" rx="9" fill="#c0392b" opacity="0.12"/><rect x="660.0" y="684.0" width="36.2" height="18" rx="9" fill="none" stroke="#c0392b" stroke-width="0.9"/><text x="678.1" y="697.5" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="bold">нет</text>
<text x="28.0" y="742.0" font-size="11.6" fill="#1f2933" text-anchor="start" font-weight="normal">Объём — порядок строк кода, а не точная цифра: у Godot 2,1 млн строк C++ (73,6 МБ кода), у three.js 0,5 млн, у Babylon 1,4 млн, у ядра Bevy 0,65 млн. У</text>
<text x="28.0" y="758.2" font-size="11.6" fill="#1f2933" text-anchor="start" font-weight="normal">ФОРМЫ 44,5 тыс. строк Python — и это только геометрия, то есть слои 4–12.</text>
<text x="28.0" y="792.0" font-size="11.6" fill="#6b7785" text-anchor="start" font-weight="normal">Вывод: «свой движок» — это не 12 слоёв, а один. Форма уже доказала, что один слой можно сделать хорошо; делать остальные одиннадцать — это</text>
<text x="28.0" y="808.2" font-size="11.6" fill="#6b7785" text-anchor="start" font-weight="normal">годы.</text>
</svg>
