<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
<title>Пять дефектов сетки</title>
<rect width="1000" height="750" fill="#ffffff"/>
<text x="28" y="40" font-size="22" fill="#1f2933" text-anchor="start" font-weight="bold">Пять типовых дефектов сетки: как выглядит и чем лечится</text>
<text x="28" y="66" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">Слева — дефект, справа — то же место после автоматического лечения. Подписи дают код дефекта и команду.</text>
<line x1="28" y1="84" x2="972" y2="84" stroke="#d5dbe1"/>
<text x="28" y="104" font-size="14.5" fill="#1f2933" text-anchor="start" font-weight="bold">игла (sliver)</text>
<text x="28" y="126" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">min-угол &lt; 3°, высота к основанию &lt; 1/10</text>
<text x="28" y="148" font-size="12" fill="#1e8449" text-anchor="start" font-weight="normal">set_tolerance(0.05·h) — схлопнуть короткое ребро</text>
<text x="472" y="110" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">дефект</text>
<rect x="470" y="118" width="210" height="84" rx="6" fill="#fcfdfe" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="712" y="110" font-size="11" fill="#1e8449" text-anchor="start" font-weight="bold">после лечения</text>
<rect x="710" y="118" width="210" height="84" rx="6" fill="#fcfdfe" stroke="#1e8449" stroke-width="1.4" stroke-dasharray=""/>
<polygon points="500.0,134.0 650.0,134.0 500.0,174.0" fill="rgba(192,57,43,.10)" stroke="#c0392b" stroke-width="1.3"/>
<text x="575.0" y="193" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="normal">высота 3 % длины</text>
<polygon points="744.0,136.0 886.0,136.0 815.0,176.0" fill="rgba(30,132,73,.10)" stroke="#1e8449" stroke-width="1.3"/>
<text x="815.0" y="193" font-size="10.5" fill="#1e8449" text-anchor="middle" font-weight="normal">близко к равностороннему</text>
<line x1="28" y1="200" x2="972" y2="200" stroke="#d5dbe1"/>
<text x="28" y="220" font-size="14.5" fill="#1f2933" text-anchor="start" font-weight="bold">совпавшие вершины → non-manifold</text>
<text x="28" y="242" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">две грани делят ребро, но вершины не сшиты</text>
<text x="28" y="264" font-size="12" fill="#1e8449" text-anchor="start" font-weight="normal">схлопывать рёбра (set_tolerance), не сваривать вершины</text>
<text x="472" y="226" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">дефект</text>
<rect x="470" y="234" width="210" height="84" rx="6" fill="#fcfdfe" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="712" y="226" font-size="11" fill="#1e8449" text-anchor="start" font-weight="bold">после лечения</text>
<rect x="710" y="234" width="210" height="84" rx="6" fill="#fcfdfe" stroke="#1e8449" stroke-width="1.4" stroke-dasharray=""/>
<polygon points="504.0,250.0 578.0,250.0 504.0,292.0" fill="rgba(192,57,43,.10)" stroke="#c0392b" stroke-width="1.3"/>
<polygon points="586.0,250.0 652.0,250.0 652.0,292.0" fill="rgba(192,57,43,.10)" stroke="#c0392b" stroke-width="1.3"/>
<line x1="578" y1="250" x2="586" y2="250" stroke="#c0392b" stroke-width="3"/>
<circle cx="578" cy="250" r="2.8" fill="#c0392b"/>
<circle cx="586" cy="250" r="2.8" fill="#c0392b"/>
<text x="575.0" y="309" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="normal">две вершины в одной точке</text>
<polygon points="744.0,250.0 818.0,250.0 744.0,292.0" fill="rgba(30,132,73,.10)" stroke="#1e8449" stroke-width="1.3"/>
<polygon points="818.0,250.0 892.0,250.0 818.0,292.0" fill="rgba(30,132,73,.10)" stroke="#1e8449" stroke-width="1.3"/>
<circle cx="818" cy="250" r="2.8" fill="#1e8449"/>
<text x="815.0" y="309" font-size="10.5" fill="#1e8449" text-anchor="middle" font-weight="normal">вершина сшита, ребро общее</text>
<line x1="28" y1="316" x2="972" y2="316" stroke="#d5dbe1"/>
<text x="28" y="336" font-size="14.5" fill="#1f2933" text-anchor="start" font-weight="bold">T-стык / дырка (boundary)</text>
<text x="28" y="358" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">у ребра один сосед: грань «нависает» над краем</text>
<text x="28" y="380" font-size="12" fill="#1e8449" text-anchor="start" font-weight="normal">grid fill по петле; для тела — запрет на экспорт</text>
<text x="472" y="342" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">дефект</text>
<rect x="470" y="350" width="210" height="84" rx="6" fill="#fcfdfe" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="712" y="342" font-size="11" fill="#1e8449" text-anchor="start" font-weight="bold">после лечения</text>
<rect x="710" y="350" width="210" height="84" rx="6" fill="#fcfdfe" stroke="#1e8449" stroke-width="1.4" stroke-dasharray=""/>
<rect x="506" y="366" width="140" height="44" rx="4" fill="#c0392b" fill-opacity="0.06" stroke="#c0392b" stroke-width="2"/>
<text x="575.0" y="425" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="normal">ребро с одной гранью</text>
<rect x="746" y="366" width="140" height="44" rx="4" fill="rgba(30,132,73,.07)" stroke="#1e8449" stroke-width="2"/>
<line x1="746" y1="388" x2="886" y2="388" stroke="#1e8449" stroke-width="1"/>
<line x1="816" y1="366" x2="816" y2="410" stroke="#1e8449" stroke-width="1"/>
<text x="815.0" y="425" font-size="10.5" fill="#1e8449" text-anchor="middle" font-weight="normal">grid fill по петле</text>
<line x1="28" y1="432" x2="972" y2="432" stroke="#d5dbe1"/>
<text x="28" y="452" font-size="14.5" fill="#1f2933" text-anchor="start" font-weight="bold">вырожденная грань (degenerate)</text>
<text x="28" y="474" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">площадь ≈ 0, нормаль не считается</text>
<text x="28" y="496" font-size="12" fill="#1e8449" text-anchor="start" font-weight="normal">удалить грань, затем dissolve коллинеарных вершин</text>
<text x="472" y="458" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">дефект</text>
<rect x="470" y="466" width="210" height="84" rx="6" fill="#fcfdfe" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="712" y="458" font-size="11" fill="#1e8449" text-anchor="start" font-weight="bold">после лечения</text>
<rect x="710" y="466" width="210" height="84" rx="6" fill="#fcfdfe" stroke="#1e8449" stroke-width="1.4" stroke-dasharray=""/>
<polygon points="506,522 650,522 530,522" fill="rgba(192,57,43,.35)" stroke="#c0392b" stroke-width="2"/>
<text x="575.0" y="502" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">S = 0</text>
<text x="575.0" y="541" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="normal">три точки на одной прямой</text>
<polygon points="756.0,524.0 878.0,524.0 816.0,486.0" fill="rgba(30,132,73,.10)" stroke="#1e8449" stroke-width="1.3"/>
<text x="815.0" y="541" font-size="10.5" fill="#1e8449" text-anchor="middle" font-weight="normal">грань удалена, вершины слиты</text>
<line x1="28" y1="548" x2="972" y2="548" stroke="#d5dbe1"/>
<text x="28" y="568" font-size="14.5" fill="#1f2933" text-anchor="start" font-weight="bold">лесенка на изгибе (density)</text>
<text x="28" y="590" font-size="12" fill="#6b7785" text-anchor="start" font-weight="normal">шаг 0.4 мм рядом с шагом 12 мм</text>
<text x="28" y="612" font-size="12" fill="#1e8449" text-anchor="start" font-weight="normal">smooth_out + refine_to_tolerance, затем simplify</text>
<text x="472" y="574" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">дефект</text>
<rect x="470" y="582" width="210" height="84" rx="6" fill="#fcfdfe" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="712" y="574" font-size="11" fill="#1e8449" text-anchor="start" font-weight="bold">после лечения</text>
<rect x="710" y="582" width="210" height="84" rx="6" fill="#fcfdfe" stroke="#1e8449" stroke-width="1.4" stroke-dasharray=""/>
<polyline points="506,640 506,616 594,616 594,640 646,640" fill="none" stroke="#c0392b" stroke-width="2"/>
<text x="575.0" y="657" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="normal">шаг 12 мм рядом с 0.4 мм</text>
<path d="M 746 640 C 786 590, 848 590, 886 640" fill="rgba(30,132,73,.08)" stroke="#1e8449" stroke-width="2"/>
<circle cx="763.5" cy="626.21875" r="1.8" fill="#1e8449"/>
<circle cx="781.0" cy="616.375" r="1.8" fill="#1e8449"/>
<circle cx="798.5" cy="610.46875" r="1.8" fill="#1e8449"/>
<circle cx="816.0" cy="608.5" r="1.8" fill="#1e8449"/>
<circle cx="833.5" cy="610.46875" r="1.8" fill="#1e8449"/>
<circle cx="851.0" cy="616.375" r="1.8" fill="#1e8449"/>
<circle cx="868.5" cy="626.21875" r="1.8" fill="#1e8449"/>
<text x="815.0" y="657" font-size="10.5" fill="#1e8449" text-anchor="middle" font-weight="normal">плотность по кривизне</text>
<text x="28" y="730" font-size="12.5" fill="#6b7785" text-anchor="start" font-weight="normal">Все пять ловятся одним проходом по массивам вершин и граней за 0.1–0.3 с на 10 тыс. треугольников (см. topology_autofix_spec.md).</text>
</svg>
