# Приложение для учебного сайта по топологии (отдельное от forma3d-ratandru,
# чтобы статическая страница не влияла на сборку стенда forma).
app = 'topology-course-ratandru'
primary_region = 'ams'

[build]
  dockerfile = 'deploy/Dockerfile'

[http_service]
  internal_port = 80
  force_https = true
  # Машина держится запущенной: страница должна открываться сразу, без холодного старта.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '5s'
    interval = '15s'
    method = 'GET'
    timeout = '3s'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
