app = 'forma3d-ratandru'
primary_region = 'ams'

[build]
  dockerfile = 'forma/Dockerfile'

[env]
  FORMA_DEMO = '1'
  FORMA_START_PROJECT = 'train_carriage'
  FORMA_TOKEN = 'forma3d-public-demo-v1'
  FORMA_DATA = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'
    timeout = '5s'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
