name: AirMouse — сборка Windows EXE

# Сборка готового приложения на серверах GitHub (Windows).
# Запуск: тег airmouse-v* (создаёт Release с zip) или вручную из вкладки Actions
# (ручной запуск работает, когда файл воркфлоу есть и в ветке по умолчанию).
on:
  workflow_dispatch:
  push:
    tags:
      - 'airmouse-v*'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          # mediapipe ставим без зависимостей: иначе он тащит opencv-contrib-python
          # (cv2.pyd 108 МБ вместо 68) и matplotlib — это лишние ~45 МБ в сборке.
          pip install --no-deps mediapipe==1.2.3
          pip install -r requirements.txt
          pip install pyinstaller pytest
          python -c "import cv2, mediapipe, numpy; print('cv2', cv2.__version__, '| mediapipe', mediapipe.__version__, '| numpy', numpy.__version__)"
          python -c "import importlib.util as u; print('contrib установлен:', u.find_spec('cv2') is not None)"
          pip list | grep -iE "opencv|mediapipe|numpy" | sed 's/^/::notice:: /' 

      - name: Модели MediaPipe
        run: |
          mkdir -p models
          curl -fsSL -o models/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          curl -fsSL -o models/face_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
          ls -la models

      - name: Проверки логики (pytest + selftest)
        run: |
          set +e
          python -m pytest tests -q > checks.log 2>&1
          py_status=$?
          python -m airmouse selftest >> checks.log 2>&1
          st_status=$?
          cat checks.log
          if [ $py_status -ne 0 ] || [ $st_status -ne 0 ]; then
            echo "::error::pytest=$py_status selftest=$st_status"
            tail -n 40 checks.log | sed 's/^/::error::/'
            exit 1
          fi

      - name: Сборка EXE
        run: |
          set +e
          python -m PyInstaller --noconfirm --clean packaging/airmouse.spec > build.log 2>&1
          status=$?
          tail -n 60 build.log
          if [ $status -ne 0 ]; then
            echo "::error::PyInstaller exit=$status"
            tail -n 50 build.log | sed 's/^/::error::/'
            exit $status
          fi

      - name: Документация и модели рядом с EXE
        run: |
          mkdir -p dist/AirMouse/models
          cp models/*.task dist/AirMouse/models/
          cp README.md dist/AirMouse/ || true
          cp ./*.txt dist/AirMouse/ 2>/dev/null || true
          python -c "open(r'dist/AirMouse/run.bat','wb').write(b'@echo off\r\ncd /d \"%~dp0\"\r\nstart \"\" AirMouse.exe\r\n')"
          du -sh dist/AirMouse
          ls -la dist/AirMouse | head -20

      - name: Размер сборки
        shell: bash
        run: |
          echo "::notice::всего распаковано, МБ: $(du -sm dist/AirMouse | cut -f1)"
          du -sm dist/AirMouse/*.exe 2>/dev/null | sed 's/^/::notice::: exe /'
          du -sm dist/AirMouse/_internal/* 2>/dev/null | sort -rn | head -6 | sed 's/^/::notice::: папка /'
          find dist/AirMouse -type f -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -8 |
            awk -F'\t' '{printf "::notice::: %.1f МБ  %s\n", $1/1048576, $2}'
          echo "::group::полный список"
          find dist/AirMouse -type f -printf '%s\t%p\n' | sort -rn | head -40
          echo "::endgroup::"

      - name: Дымовой тест собранного EXE
        run: |
          set +e
          cd dist/AirMouse
          mkdir -p ../smoke-logs
          fail=0
          run_console() {
            local name=$1; shift
            "$@" > "../smoke-logs/$name.log" 2>&1
            local status=$?
            echo "::notice::$* -> exit=$status"
            tail -n 10 "../smoke-logs/$name.log" | sed 's/^/::notice::  /'
            if [ $status -ne 0 ]; then
              fail=1
              echo "::error::$* завершился с кодом $status (см. артефакт smoke-logs)"
            fi
          }
          run_console version ./AirMouse-debug.exe --version
          run_console selftest ./AirMouse-debug.exe selftest
          run_console lip ./AirMouse-debug.exe lip list
          run_console demo ./AirMouse-debug.exe demo --out smoke-out

          # Оконная сборка: запускаем с таймаутом, чтобы сборка не зависла на диалоге
          powershell -NoProfile -Command '$p = Start-Process -FilePath ".\AirMouse.exe" -ArgumentList "--version" -PassThru; if (-not $p.WaitForExit(20000)) { $p.Kill(); exit 3 } else { exit $p.ExitCode }' > ../smoke-logs/version-gui.log 2>&1
          wstatus=$?
          echo "::notice::AirMouse.exe (без консоли) --version -> exit=$wstatus"
          cat ../smoke-logs/version-gui.log | sed 's/^/::notice::  /'
          if [ $wstatus -ne 0 ]; then
            fail=1
            echo "::error::AirMouse.exe (без консоли) --version вернул $wstatus"
          fi

          for f in AirMouse.exe AirMouse-debug.exe models/hand_landmarker.task models/face_landmarker.task; do
            if [ -f "$f" ]; then
              echo "::notice::: есть $f ($(stat -c%s "$f") байт)"
            else
              echo "::error::: нет $f"
              fail=1
            fi
          done
          ls -la > ../smoke-logs/listing.log 2>&1
          du -sh . >> ../smoke-logs/listing.log 2>&1
          if [ $fail -ne 0 ]; then
            echo "::error::дымовой тест EXE не пройден"
            exit 1
          fi
          echo "::notice::дымовой тест EXE пройден"

      - name: Логи дымового теста
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: dist/smoke-logs
          if-no-files-found: warn

      - name: Архив
        shell: bash
        run: |
          set +e
          mkdir -p smoke-logs
          cd dist
          SZ="/c/Program Files/7-Zip/7z.exe"
          if [ -x "$SZ" ]; then
            "$SZ" a -tzip -mx=9 -mmt=on AirMouse-windows.zip AirMouse > ../smoke-logs/7z.log 2>&1
            code=$?
            echo "::notice::7z exit=$code"
            tail -n 4 ../smoke-logs/7z.log | sed 's/^/::notice::  /'
            if [ $code -ne 0 ]; then
              echo "::error::7z завершился с кодом $code — архивируем встроенным Compress-Archive"
              rm -f AirMouse-windows.zip
              powershell -Command "Compress-Archive -Path 'AirMouse' -DestinationPath 'AirMouse-windows.zip' -Force"
            fi
          else
            echo "::notice::7-Zip не найден, используем Compress-Archive"
            powershell -Command "Compress-Archive -Path 'AirMouse' -DestinationPath 'AirMouse-windows.zip' -Force"
          fi
          if [ ! -f AirMouse-windows.zip ]; then
            echo "::error::архив не создан"
            exit 1
          fi
          echo "::notice::размер архива, МБ: $(( $(stat -c%s AirMouse-windows.zip) / 1048576 ))"
          ls -la AirMouse-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AirMouse-windows
          path: dist/AirMouse-windows.zip
          retention-days: 30

      - name: Release (для тега airmouse-v*)
        if: startsWith(github.ref, 'refs/tags/airmouse-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AirMouse-windows.zip
          name: AirMouse ${{ github.ref_name }}
          body: |
            Готовое приложение для Windows: распакуйте архив и запустите `AirMouse.exe`.
            Модели MediaPipe уже внутри, Python устанавливать не нужно.
