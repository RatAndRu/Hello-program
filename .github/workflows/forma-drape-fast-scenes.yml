name: Форма 3D — проверка и ZIP облегчённых сцен

# Отдельная публикация только двух сценариев для уже выпущенной 0.76.1.
# Код программы, номер версии и ранее собранный EXE при этом не меняются.
on:
  push:
    paths:
      - '.github/workflows/forma-drape-fast-scenes.yml'
      - 'forma/examples/drape_tablecloth_fast_076.forma'
      - 'forma/examples/drape_atelier_fast_076.forma'
      - 'forma/examples/drape_fast_README_076.txt'
      - 'forma/tests/test_drape_fast_examples.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  verify-and-publish:
    name: Проверить сцены в Windows и собрать ZIP
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Получить точный коммит
        uses: actions/checkout@v4
      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: forma/requirements.txt
      - name: Установить зависимости и независимую проверку FCL
        working-directory: forma
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest python-fcl
          python -c "import fcl; print('FCL подключён')"
      - name: Проверить полный путь сборки, GLB, полигонаж и геометрию
        working-directory: forma
        run: python -m pytest -q -s tests/test_drape_fast_examples.py
      - name: Скачать ранее выпущенный EXE 0.76.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download forma3d-exe-request-43053440526-1
          --repo "$GITHUB_REPOSITORY" --pattern Forma3D.exe --dir "$RUNNER_TEMP"
      - name: Открыть оба проекта через API выпущенного EXE
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import io
          import json
          import os
          import shutil
          import socket
          import subprocess
          import tempfile
          import time
          from urllib.request import Request, urlopen
          import trimesh

          exe = Path(os.environ['RUNNER_TEMP']) / 'Forma3D.exe'
          expected_sha = '8bb7ab1bac662c7ebe6c9b7feb883b031dfa74563a5aee5897bc04fd9e391fca'
          assert sha256(exe.read_bytes()).hexdigest() == expected_sha, 'EXE не совпал с 0.76.1'
          support = {'пол', 'столешница', 'ножка_левая_передняя', 'ножка_правая_передняя',
                     'ножка_левая_задняя', 'ножка_правая_задняя'}
          cases = [
              ('drape_tablecloth_fast_076', support | {'скатерть'}, 5000),
              ('drape_atelier_fast_076', support | {'слои', 'слои.02', 'упавший_рукав',
                                                   'упавший_шар', 'скатерть'}, 10000),
          ]
          measurements = []
          with tempfile.TemporaryDirectory() as temp:
              project_dir = Path(temp) / 'projects'
              project_dir.mkdir()
              for name, _objects, _limit in cases:
                  shutil.copyfile(Path('forma/examples') / (name + '.forma'),
                                  project_dir / (name + '.forma'))
              with socket.socket() as sock:
                  sock.bind(('127.0.0.1', 0))
                  port = sock.getsockname()[1]
              token = 'drape-ci-local-only'
              base = f'http://127.0.0.1:{port}'
              env = dict(os.environ, FORMA_DATA=temp, FORMA_DOWNLOADS=str(Path(temp) / 'downloads'),
                         FORMA_TOKEN=token)
              process = subprocess.Popen([str(exe), '--no-open', '--port', str(port)], env=env)
              try:
                  deadline = time.monotonic() + 120
                  while True:
                      if process.poll() is not None:
                          raise RuntimeError(f'EXE завершился раньше запуска API: {process.returncode}')
                      try:
                          with urlopen(base + '/api/state?token=' + token, timeout=2) as response:
                              state = json.load(response)
                          break
                      except OSError:
                          if time.monotonic() >= deadline:
                              raise RuntimeError('EXE не запустил API за 120 секунд')
                          time.sleep(0.5)
                  assert state['version'] == '0.76.1', state['version']
                  for name, expected, limit in cases:
                      with urlopen(base + '/api/project?name=' + name + '&token=' + token,
                                   timeout=20) as response:
                          project = json.load(response)
                      script = (project_dir / (name + '.forma')).read_text(encoding='utf-8')
                      assert project['script'] == script, name
                      body = json.dumps({'script': script, 'auto': False}, ensure_ascii=False).encode('utf-8')
                      request = Request(base + '/api/build?token=' + token, data=body,
                                        headers={'Content-Type': 'application/json'})
                      started = time.perf_counter()
                      with urlopen(request, timeout=300) as response:
                          payload = json.load(response)
                      build_seconds = time.perf_counter() - started
                      assert payload.get('ok') and not payload.get('paused'), payload.get('error')
                      visible = {item['name'] for item in payload['objects'] if item['visible']}
                      assert visible == expected, (name, visible)
                      visible_tris = sum(item['tris'] for item in payload['objects'] if item['visible'])
                      with urlopen(base + payload['glb_url'] + '&token=' + token, timeout=120) as response:
                          glb = response.read()
                      loaded = trimesh.load(io.BytesIO(glb), file_type='glb', force='scene', process=False)
                      glb_tris = sum(len(mesh.faces) for mesh in loaded.geometry.values())
                      assert visible_tris == glb_tris, (name, visible_tris, glb_tris)
                      assert 0 < glb_tris < limit and glb_tris <= 100000, (name, glb_tris)
                      elapsed = time.perf_counter() - started
                      measurements.append({'name': name, 'visible_tris': visible_tris,
                                           'glb_tris': glb_tris, 'glb_bytes': len(glb),
                                           'build_seconds': round(build_seconds, 2),
                                           'total_seconds': round(elapsed, 2)})
                      print(f'{name}: EXE API + GLB {glb_tris} трис, '
                            f'{len(glb)} байт, {elapsed:.2f} с')
              finally:
                  subprocess.run(['taskkill', '/PID', str(process.pid), '/T', '/F'],
                                 check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          Path('exe_fast_measurements.json').write_text(
              json.dumps(measurements, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Упаковать и проверить файлы сценариев
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          import os
          import zipfile

          examples = Path('forma/examples')
          files = {
              'projects/drape_tablecloth_fast_076.forma': examples / 'drape_tablecloth_fast_076.forma',
              'projects/drape_atelier_fast_076.forma': examples / 'drape_atelier_fast_076.forma',
              'README_SCENES.txt': examples / 'drape_fast_README_076.txt',
          }
          archive = Path('Forma3D-0.76.1-scenarios-fast.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as zf:
              for name, source in files.items():
                  zf.writestr(name, source.read_bytes())
          with zipfile.ZipFile(archive) as zf:
              assert set(zf.namelist()) == set(files)
              assert zf.testzip() is None
              for name, source in files.items():
                  assert zf.read(name) == source.read_bytes(), name
          print('ZIP:', archive, archive.stat().st_size, 'байт')
          print('SHA-256:', sha256(archive.read_bytes()).hexdigest())
          measured = json.loads(Path('exe_fast_measurements.json').read_text(encoding='utf-8'))
          lines = [
              'Два сценария для существующей версии 0.76.1; новая версия EXE не выпускается.',
              'Windows-проверка полного пути сборки, GLB, полигонажа и FCL выполнена в этом запуске.',
              'Оба проекта также построены через API ранее выпущенного EXE 0.76.1.',
              'Замеры на Windows-раннере CI (время на других компьютерах может отличаться):',
          ]
          for item in measured:
              lines.append(f"- {item['name']}: {item['glb_tris']} трис, "
                           f"сборка {item['build_seconds']} с, сборка и GLB {item['total_seconds']} с.")
          lines += ['Результат драпировки приближённый; равновесие и нерастяжимость не гарантированы.',
                    'Исходный коммит: ' + os.environ['GITHUB_SHA']]
          Path('release-notes-fast.md').write_text('\n\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Сохранить проверенный архив
        uses: actions/upload-artifact@v4
        with:
          name: Forma3D-0.76.1-scenarios-fast
          path: Forma3D-0.76.1-scenarios-fast.zip
          if-no-files-found: error
      - name: Опубликовать архив для этого коммита
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forma3d-scenes-fast-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Форма 3D 0.76.1 — облегчённые сцены ${{ github.run_id }}
          body_path: release-notes-fast.md
          prerelease: true
          fail_on_unmatched_files: true
          files: Forma3D-0.76.1-scenarios-fast.zip
