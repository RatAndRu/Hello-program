name: Опубликовать ZIP изменённых файлов Forma

# Ручной режим для перевыпуска дельты между любыми ревизиями без сборки EXE.
on:
  # Push-запрос работает и тогда, когда workflow ещё существует только ветке.
  push:
    paths:
      - '.github/delta-request.json'
  workflow_dispatch:
    inputs:
      base:
        description: 'Прежний commit или tag'
        required: true
        type: string
      head:
        description: 'Новый commit или tag'
        required: true
        type: string
      release_tag:
        description: 'Существующий release, к которому прикрепить ZIP'
        required: true
        type: string
      archive_name:
        description: 'Имя ZIP (латиница, цифры, точка, _ и -)'
        required: true
        default: 'Forma3D-changed-files.zip'
        type: string

permissions:
  contents: write

jobs:
  publish-delta:
    runs-on: ubuntu-latest
    env:
      BASE: ${{ inputs.base }}
      HEAD: ${{ inputs.head }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARCHIVE_NAME: ${{ inputs.archive_name }}
    steps:
      - name: Получить ревизии
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Прочитать push-запрос
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('.github/delta-request.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              for key in ('BASE', 'HEAD', 'RELEASE_TAG', 'ARCHIVE_NAME'):
                  value = str(request.get(key, '')).strip()
                  if not value or '\n' in value or '\r' in value:
                      raise SystemExit(f'Некорректное поле {key}')
                  out.write(f'{key}={value}\n')
          PY

      - name: Проверить имя и собрать дельту
        run: |
          python - <<'PY'
          import os, re
          name = os.environ['ARCHIVE_NAME']
          if not re.fullmatch(r'[A-Za-z0-9._-]+\.zip', name):
              raise SystemExit('Небезопасное имя архива: ' + name)
          PY
          python forma/tools/build_update_zip.py \
            --base "$BASE" --head "$HEAD" --output "forma/$ARCHIVE_NAME"

      - name: Прикрепить ZIP к указанному релизу
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: forma/${{ env.ARCHIVE_NAME }}
          fail_on_unmatched_files: true
