name: Форма 3D — шесть диагностик драпировки

# Проверяется существующий EXE 0.76.1; этот workflow не выпускает новый решатель.
on:
  push:
    paths:
      - '.github/workflows/forma-drape-six-diagnostic.yml'
      - 'forma/benchmarks/drape_six/**'
      - 'forma/examples/drape_tablecloth_fast_076.forma'
      - 'forma/tools/drape_six_probe.py'
      - 'forma/tools/drape_triangle_probe.py'
      - 'forma/tests/test_drape_six_probe.py'
      - 'forma/docs/drape_six_results.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'

jobs:
  audit:
    name: Windows — сценарии, геометрия, траектория и существующий EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Получить точный коммит
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Убедиться, что исходники приложения совпадают с выпущенным EXE
        run: git diff --exit-code be830038a50535a0e69be0b86855054b415a2b8f "$GITHUB_SHA" -- forma/forma forma/web
      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимости независимых проверок
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.6 manifold3d==3.5.4 trimesh==5.2.0 pytest python-fcl==0.7.0.11 ipctk==1.6.1
          python -c "import fcl, ipctk, manifold3d, trimesh; print('FCL и IPC Toolkit подключены')"
      - name: Проверить конструкцию опытов
        working-directory: forma
        run: python -m pytest -q tests/test_drape_six_probe.py
      - name: Измерить шесть сцен тремя способами
        working-directory: forma
        run: |
          python tools/drape_six_probe.py --mode current --fcl --ccd --glb --output six-current.json
          python tools/drape_six_probe.py --mode stop-xy --fcl --ccd --glb --output six-stop-xy.json
          python tools/drape_six_probe.py --mode surface --fcl --ccd --glb --output six-surface.json
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ('six-current.json', 'six-stop-xy.json', 'six-surface.json'):
              report = json.loads(Path(filename).read_text(encoding='utf-8'))
              cases = report['cases']
              assert len(cases) == 6
              assert len({case['name'] for case in cases}) == 6
              for case in cases:
                  assert case['fcl']['available']
                  assert case['ccd']['initial_error'] is None, case
                  assert case['ccd']['checked_segments'] > 0, case
                  assert case['visible_triangles'] == case['glb']['triangles']
                  assert 0 < case['visible_triangles'] <= 100000
                  assert not case['metadata']['equilibrium_verified']
                  print(filename, case['name'], 'трис', case['visible_triangles'],
                        'рёбра ±%', round(case['edges']['max_abs_percent'], 3),
                        'первый небезопасный отрезок', case['ccd']['first_unsafe_segment'])
              sphere, sleeve = cases[2], cases[5]
              assert sphere['metadata']['rigid'] == 0
              assert not sleeve['initial_setup']['fcl_contact_or_crossing']
              assert sleeve['initial_setup']['fcl_distance_mm'] > 4
          PY
      - name: Скачать существующий проверенный EXE 0.76.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download forma3d-exe-request-43053440526-1
          --repo "$GITHUB_REPOSITORY" --pattern Forma3D.exe --dir "$RUNNER_TEMP"
      - name: Открыть все шесть проектов через API существующего EXE
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import io
          import json
          import os
          import shutil
          import socket
          import subprocess
          import tempfile
          import time
          from urllib.request import Request, urlopen
          import trimesh

          exe = Path(os.environ['RUNNER_TEMP']) / 'Forma3D.exe'
          assert sha256(exe.read_bytes()).hexdigest() == '8bb7ab1bac662c7ebe6c9b7feb883b031dfa74563a5aee5897bc04fd9e391fca'
          root = Path('forma')
          cases = [
              ('01_sheet_over_ball', root / 'benchmarks/drape_six/01_sheet_over_ball.forma', {'площадка', 'шар', 'результат'}),
              ('02_sheet_over_sheet', root / 'benchmarks/drape_six/02_sheet_over_sheet.forma', {'площадка', 'результат'}),
              ('03_soft_sphere', root / 'benchmarks/drape_six/03_soft_sphere.forma', {'площадка', 'результат'}),
              ('04_tablecloth', root / 'examples/drape_tablecloth_fast_076.forma', {'пол', 'столешница', 'ножка_левая_передняя', 'ножка_правая_передняя', 'ножка_левая_задняя', 'ножка_правая_задняя', 'скатерть'}),
              ('05_sleeve', root / 'benchmarks/drape_six/05_sleeve.forma', {'площадка', 'результат'}),
              ('06_sleeve_around_rod', root / 'benchmarks/drape_six/06_sleeve_around_rod.forma', {'площадка', 'стержень', 'результат'}),
          ]
          measurements = []
          with tempfile.TemporaryDirectory() as temp:
              projects = Path(temp) / 'projects'
              projects.mkdir()
              for name, source, _expected in cases:
                  shutil.copyfile(source, projects / (name + '.forma'))
              with socket.socket() as sock:
                  sock.bind(('127.0.0.1', 0))
                  port = sock.getsockname()[1]
              token = 'drape-six-ci-local-only'
              base = f'http://127.0.0.1:{port}'
              env = dict(os.environ, FORMA_DATA=temp, FORMA_DOWNLOADS=str(Path(temp) / 'downloads'), FORMA_TOKEN=token)
              process = subprocess.Popen([str(exe), '--no-open', '--port', str(port)], env=env)
              try:
                  deadline = time.monotonic() + 120
                  while True:
                      if process.poll() is not None:
                          raise RuntimeError(f'EXE завершился до запуска API: {process.returncode}')
                      try:
                          with urlopen(base + '/api/state?token=' + token, timeout=2) as response:
                              state = json.load(response)
                          break
                      except OSError:
                          if time.monotonic() >= deadline:
                              raise RuntimeError('EXE не запустил API за 120 секунд')
                          time.sleep(.5)
                  assert state['version'] == '0.76.1', state['version']
                  for name, source, expected in cases:
                      with urlopen(base + '/api/project?name=' + name + '&token=' + token, timeout=20) as response:
                          project = json.load(response)
                      script = source.read_text(encoding='utf-8')
                      assert project['script'] == script, name
                      data = json.dumps({'script': script, 'auto': False}, ensure_ascii=False).encode('utf-8')
                      request = Request(base + '/api/build?token=' + token, data=data,
                                        headers={'Content-Type': 'application/json'})
                      started = time.perf_counter()
                      with urlopen(request, timeout=300) as response:
                          payload = json.load(response)
                      assert payload.get('ok') and not payload.get('paused'), payload.get('error')
                      visible = {item['name'] for item in payload['objects'] if item['visible']}
                      assert visible == expected, (name, visible, expected)
                      tris = sum(item['tris'] for item in payload['objects'] if item['visible'])
                      with urlopen(base + payload['glb_url'] + '&token=' + token, timeout=120) as response:
                          glb = response.read()
                      loaded = trimesh.load(io.BytesIO(glb), file_type='glb', force='scene', process=False)
                      glb_tris = sum(len(mesh.faces) for mesh in loaded.geometry.values())
                      assert tris == glb_tris and 0 < tris <= 100000, (name, tris, glb_tris)
                      elapsed = time.perf_counter() - started
                      measurements.append({'name': name, 'triangles': tris, 'glb_bytes': len(glb),
                                           'seconds': round(elapsed, 2)})
                      print(name, 'EXE API + GLB:', tris, 'трис,', round(elapsed, 2), 'с')
              finally:
                  subprocess.run(['taskkill', '/PID', str(process.pid), '/T', '/F'],
                                 check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          Path('exe_six_measurements.json').write_text(json.dumps(measurements, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Упаковать диагностические сценарии и результаты
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os
          import zipfile

          root = Path('forma')
          files = {f'projects/{p.name}': p for p in (root / 'benchmarks/drape_six').glob('*.forma')}
          files['projects/04_tablecloth.forma'] = root / 'examples/drape_tablecloth_fast_076.forma'
          files['ИЗМЕРЕНИЯ_LINUX.md'] = root / 'docs/drape_six_results.md'
          files['reports/windows-current.json'] = root / 'six-current.json'
          files['reports/windows-stop-xy.json'] = root / 'six-stop-xy.json'
          files['reports/windows-surface.json'] = root / 'six-surface.json'
          files['reports/windows-exe.json'] = Path('exe_six_measurements.json')
          assert len([name for name in files if name.startswith('projects/')]) == 6
          readme = ('ШЕСТЬ ДИАГНОСТИЧЕСКИХ СЦЕН ДЛЯ ФОРМА 3D 0.76.1\n\n'
                    'Это НЕ новая версия программы и НЕ готовые модели для экспорта.\n'
                    'В некоторых сценах обнаружено пересечение опоры, заметное изменение рёбер '\
                    'или отсутствие остановки. Смотрите ИЗМЕРЕНИЯ_LINUX.md и JSON-отчёты Windows.\n'
                    'Сценарий 04 использует исходный лист 120×120 мм: доставать до пола не нужно.\n'
                    'Все шесть проектов открыты через API существующего EXE; визуальные клики не проверялись.\n'
                    'Исходный коммит: ' + os.environ['GITHUB_SHA'] + '\n')
          archive = Path('Forma3D-drape-diagnostic-six.zip')
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as zf:
              zf.writestr('ПРОЧИТАЙТЕ.txt', readme)
              for name, path in sorted(files.items()):
                  zf.writestr(name, path.read_bytes())
          with zipfile.ZipFile(archive) as zf:
              assert zf.testzip() is None
              for name, path in files.items():
                  assert zf.read(name) == path.read_bytes(), name
          print('ZIP', archive.stat().st_size, 'байт, SHA-256:', sha256(archive.read_bytes()).hexdigest())
          Path('diagnostic-release-notes.md').write_text(
              'Шесть диагностических сцен, не исправленный инструмент и не новая версия EXE.\n\n'
              'Фактические результаты и ограничения — в архиве. Все проекты построены на Windows '\
              'через API существующего EXE 0.76.1.\n\nИсходный коммит: ' + os.environ['GITHUB_SHA'] + '\n',
              encoding='utf-8')
          PY
      - name: Сохранить проверенные файлы
        uses: actions/upload-artifact@v4
        with:
          name: Forma3D-drape-diagnostic-six
          path: |
            Forma3D-drape-diagnostic-six.zip
            forma/six-current.json
            forma/six-stop-xy.json
            forma/six-surface.json
            exe_six_measurements.json
          if-no-files-found: error
      - name: Опубликовать диагностический архив для этого коммита
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forma3d-drape-diagnostic-six-${{ github.run_id }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Форма 3D — шесть диагностических сцен ${{ github.run_id }}
          body_path: diagnostic-release-notes.md
          prerelease: true
          fail_on_unmatched_files: true
          files: Forma3D-drape-diagnostic-six.zip
