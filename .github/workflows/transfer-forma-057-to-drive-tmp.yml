name: Temporary Forma 0.57 Drive transfer

on:
  push:
    branches:
      - arena/4e4defc4-hello-program
    paths:
      - '.github/workflows/transfer-forma-057-to-drive-tmp.yml'

permissions:
  contents: write
  statuses: write

jobs:
  stage-published-zip:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the published CI archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forma-drive"
          gh release download forma3d-exe-120-1 \
            --repo "$GH_REPO" \
            --pattern Forma3D-0.57-exe.zip \
            --dir "$RUNNER_TEMP/forma-drive" \
            --clobber

      - name: Verify and stage the archive as a Git blob
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import zipfile

          archive = Path(os.environ['RUNNER_TEMP']) / 'forma-drive' / 'Forma3D-0.57-exe.zip'
          data = archive.read_bytes()
          if len(data) != 40110163:
              raise SystemExit(f'Unexpected ZIP size: {len(data)}')
          digest = hashlib.sha256(data).hexdigest()
          if digest != '6fa97da83b92325bc9558e7ea28535eb52797f420ff031034a1b77ec9817ee75':
              raise SystemExit(f'Unexpected ZIP SHA-256: {digest}')
          with zipfile.ZipFile(archive) as zf:
              if zf.namelist() != ['Forma3D.exe']:
                  raise SystemExit(f'Unexpected ZIP entries: {zf.namelist()}')
              if zf.testzip() is not None:
                  raise SystemExit('ZIP CRC validation failed')
          request = Path(os.environ['RUNNER_TEMP']) / 'forma-blob-request.json'
          request.write_text(json.dumps({
              'encoding': 'base64',
              'content': base64.b64encode(data).decode('ascii'),
          }), encoding='utf-8')
          print(f'Validated published ZIP: {len(data)} bytes, SHA-256 {digest}')
          PY
          archive="$RUNNER_TEMP/forma-drive/Forma3D-0.57-exe.zip"
          blob_sha="$(gh api "repos/$GH_REPO/git/blobs" \
            --input "$RUNNER_TEMP/forma-blob-request.json" \
            --jq '.sha')"
          local_sha="$(git hash-object "$archive")"
          if [ "$blob_sha" != "$local_sha" ]; then
            echo "Blob SHA mismatch: $blob_sha != $local_sha" >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context=arena/drive-transfer-057 \
            -f description="$blob_sha" \
            -f target_url="https://api.github.com/repos/$GH_REPO/git/blobs/$blob_sha" \
            > /dev/null
          echo "Archive staged with verified Git blob SHA $blob_sha"
