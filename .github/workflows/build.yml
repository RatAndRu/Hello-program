name: Собрать приложение

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  web:
    name: Веб-сборка и проверка геометрии
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Проверка геометрии
        run: npm run selftest
      - name: Сборка интерфейса
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sgib-web
          path: dist
          if-no-files-found: error

  desktop:
    name: Приложение для ПК (${{ matrix.os }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            artifact: sgib-windows
          - os: ubuntu-latest
            args: --linux
            artifact: sgib-linux
          - os: macos-latest
            args: --mac --arm64
            artifact: sgib-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Упаковать
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: warn
