            * выделили деталь — всё, что её закрывает от камеры, показывается прозрачным каркасом (кнопка «заслонки», пересчёт при повороте камеры);
            * кнопка «вокруг» вращает и приближает вокруг выделенного предмета, ⌖ наводит камеру на него;
