name: Собрать Windows EXE — Форма 3D

# Ручной запуск: Actions -> "Собрать Windows EXE — Форма 3D" -> Run workflow.
# Плюс автозапуск при изменениях в папке forma/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'forma/**'
      - '.github/workflows/build-forma-windows.yml'

jobs:
  build-exe:
    name: EXE + ZIP (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # без этого кириллица в выводе падает на Windows (cp1251/charmap)
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: bash

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: forma/requirements.txt

      - name: Установить зависимости
        working-directory: forma
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Прогнать тесты ядра
        working-directory: forma
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # публикуем имена упавших тестов аннотациями: логи иногда недоступны
            grep -E "^(FAIL|ERROR):" tests.log | while read -r line; do
              echo "::error::$line"
            done
            # и последние строки целиком — если упало не тестом, а падением
            tail -25 tests.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            tail -60 tests.log
          fi
          exit "$rc"

      - name: Подготовить иконку и версию
        working-directory: forma
        run: |
          python tools/make_icon.py
          python tools/write_version_info.py

      - name: Собрать EXE
        working-directory: forma
        run: |
          pyinstaller packaging/forma.spec --noconfirm --clean --distpath dist --workpath build/pyi
          ls -la dist
          python - <<'PY'
          from pathlib import Path
          exe = Path('dist/Forma3D.exe')
          print(f"EXE: {exe.stat().st_size / 1024 / 1024:.1f} МБ")
          PY

      - name: Проверить, что EXE не распух
        working-directory: forma
        run: |
          python - <<'PY'
          from pathlib import Path
          size = Path('dist/Forma3D.exe').stat().st_size / 1024 / 1024
          print(f"EXE: {size:.1f} МБ")
          if size > 60:
              raise SystemExit(
                  f"EXE вырос до {size:.0f} МБ — похоже, в сборку попала лишняя "
                  "библиотека (scipy/skimage/Pillow/networkx). Проверьте "
                  "packaging/forma.spec и requirements.txt."
              )
          PY

      - name: Проверить собранный EXE (самопроверка моделей)
        working-directory: forma
        run: |
          rm -f selftest.txt
          ./dist/Forma3D.exe --selftest --report selftest.txt &
          exe_pid=$!
          for i in $(seq 1 180); do
            if [ -s selftest.txt ]; then break; fi
            if ! kill -0 "$exe_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -s selftest.txt ]; then
            echo "EXE не отчитался о самопроверке за 180 с"
            taskkill //F //IM Forma3D.exe || true
            echo "=== диагностическая сборка с консолью (чтобы видеть ошибку) ==="
            FORMA_CONSOLE=1 pyinstaller packaging/forma.spec --noconfirm --clean \
              --distpath distc --workpath build/pyic 2>&1 | tail -3
            ./distc/Forma3D.exe --selftest 2>&1 | tail -40 || true
            exit 1
          fi
          cat selftest.txt

      - name: Проверить интерфейс внутри EXE (API, 3D-ресурсы, снимки)
        working-directory: forma
        run: |
          rm -f uitest.txt
          ./dist/Forma3D.exe --uistest --report uitest.txt &
          exe_pid=$!
          for i in $(seq 1 240); do
            if [ -s uitest.txt ]; then break; fi
            if ! kill -0 "$exe_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -s uitest.txt ]; then
            echo "EXE не отчитался о проверке интерфейса за 240 с"
            taskkill //F //IM Forma3D.exe || true
            exit 1
          fi
          cat uitest.txt
          grep -q "ИТОГ: всё в порядке" uitest.txt

      - name: Подготовить ZIP с понятным именем
        working-directory: forma
        run: |
          mkdir -p release
          cp dist/Forma3D.exe release/
          cp packaging/README_FIRST.txt release/ЧИТАЙ_МЕНЯ.txt
          cp packaging/icon_256.png release/icon.png
          python - <<'PY'
          from pathlib import Path
          import zipfile, sys
          sys.path.insert(0, '.')
          from forma.agent import command_reference_md
          from forma.instruction import full_instruction, commands_catalog
          from forma.version import __version__
          root = Path('release')
          (root / 'СПРАВКА_КОМАНДЫ.md').write_text(command_reference_md(), encoding='utf-8')
          (root / 'ИНСТРУКЦИЯ_ДЛЯ_НЕЙРОСЕТИ.md').write_text(full_instruction(), encoding='utf-8')
          (root / 'ВСЕ_КОМАНДЫ.md').write_text(commands_catalog(), encoding='utf-8')
          recipes = Path('docs/RECIPES.md')
          if recipes.exists():
              (root / 'РЕЦЕПТЫ.md').write_text(recipes.read_text(encoding='utf-8'), encoding='utf-8')
          examples = Path('release/examples')
          examples.mkdir(exist_ok=True)
          for p in Path('examples').glob('*.forma'):
              (examples / p.name).write_text(p.read_text(encoding='utf-8'), encoding='utf-8')
          zip_path = Path(f'Forma3D-{__version__}-windows.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      zf.write(p, p.relative_to(root))
          print('ZIP:', zip_path, zip_path.stat().st_size, 'байт')
          PY

      - name: Загрузить в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Forma3D-windows
          path: |
            forma/Forma3D-*-windows.zip
            forma/dist/Forma3D.exe
            forma/selftest.txt
            forma/uitest.txt
          if-no-files-found: error
          retention-days: 60

      - name: Опубликовать EXE и ZIP в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forma3d-exe-${{ github.run_number }}-${{ github.run_attempt }}
          name: Форма 3D — Windows EXE (сборка ${{ github.run_number }})
          body: |
            **Форма 3D** — параметрический 3D-редактор, которым управляют текстом.

            * `Forma3D-…-windows.zip` — распакуй и запусти `Forma3D.exe` (рекомендуется).
            * `Forma3D.exe` — то же приложение одним файлом.

            **Что нового в 0.41 — ориентация каждой детали и точная стыковка**

            * **единый канон**: верх `+Z`, низ `−Z`, право `+X`, лево `−X`, перёд `−Y`, зад `+Y`; плоские знаки стоят в XZ лицом `−Y`, а `plane=плашмя` кладёт их в XY лицом `+Z`;
            * у **всех 104 примитивов** есть пункт «Исходная ориентация»: габариты по осям, острия и выступы, масса/вырез, полости и оси отверстий; пояснения видны в карточках, поиске, полной справке и каталоге для нейросети;
            * **`parallel [деталь] on=хозяин axis=… host_axis=…`** совмещает выбранные локальные оси (`flip=да` — антипараллельно), не сдвигая центр детали;
            * **`perpendicular [деталь] on=хозяин axis=… host_axis=… direction=…`** ставит выбранную ось перпендикулярно оси хозяина в заданном направлении;
            * **`place … side=… face=… gap=…`** разворачивает деталь СВОЕЙ контактной стороной к локальной стороне хозяина; зазор считается по крайним точкам фактического повёрнутого объёма, составные части поворачиваются вместе;
            * при выделении в 3D видны личные оси **ПРАВО / ПЕРЁД / ВЕРХ** — отдельной панели ориентации нет;
            * миска и параболическая чаша стоят дном вниз и раскрыты `+Z`; сплошной купол лишён осевой пустоты; инь-ян стоит в XZ, его одинаково скруглённые половины объединяются в одно тело;
            * 23 новых регрессионных теста (`tests/test_v041.py`), всего 898 тестов; рецепты §34.

            **Что нового в 0.40 — механика и произвольные формы**

            * **починен интерфейс**: с 0.38 панель не отвечала — в `renderTools()` было два `const order` в одной области видимости, для JavaScript это фатальная `SyntaxError`, и модуль не загружался целиком. Второе объявление переименовано, на такой повтор теперь есть тест;
            * **`ladder`** (`лестница`) — лестница целиком: боковые рейки `rail=капсула|брусок|овал` с толщиной `rail_d`, перекладины `rung=цилиндр|брусок` с толщиной `rung_d`, число `rungs`, отступ `margin`, наклон `tilt` (90° — стоит, 0° — лежит); вся лестница — один объём;
            * **`lever`** (`рычаг`) — палка `shaft=цилиндр|брусок` (`diameter`/`size`) и ручка `knob=шар|цилиндр|нет` (`knob_d`, `knob_h`), наклон `angle`; ручка сидит на конце и не выходит за `length`;
            * **`button`** (`кнопка`) — **две отдельные детали**: шляпка с верхом `плоская|вогнутая|выпуклая` (ложбинка `sag`) и гнездо `base=цилиндр|квадрат` с вырезом под неё; `fit=плотно` или `fit=зазор gap=…`. В сцене это `<имя>` (шляпка) и `<имя>_гнездо` — шляпку двигают и анимируют отдельно;
            * **`tri_prism`** (`треугольная_призма`) — треугольник с любыми углами: стороны `a`, `b`, `c` или `base` с углами `angle_a`, `angle_b`; равнобедренный, прямоугольный и тупоугольный равно честные, невозможный треугольник — понятная ошибка; `round` скругляет рёбра;
            * **`torus_sector`** (`сектор_тора`) — дуга бублика: `major`, `minor`, `angle`, `start`, и `hole` — сквозное отверстие посередине дуги (полое кольцо под подвес, род 1);
            * пример **`examples/mech.forma`** — 19 деталей: три лестницы, четыре рычага, три кнопки (шесть объектов), три призмы и три сектора тора; 38 автотестов (`tests/test_v040.py`), 9 новых проверок `--uistest`, плакат `docs/whatsnew_040.png`, рецепты §33.

            **Что нового в 0.39 — восемь новых тел**

            * **`disc`** (`круг`) и **`oval`** (`овал`) — плоские тела с объёмом: диаметр/толщина, ширина/длина и скругление кромки `round`; это не плоские фигуры, а плиты;
            * **`pie`** (`сектор_круга`) — кусок пирога: `angle`, `start` и толщина; `angle=360` даёт целый круг;
            * **`ingot`** (`слиток`) — объёмная трапеция: нижняя площадка больше верхней, `taper` — скос, `round` — углы; объём сходится с формулой усечённой пирамиды;
            * **`paraboloid`** (`параболоид`) — чаша или купол вращения; `wall=0` — сплошной купол, `wall>0` — настоящая чаша со стенкой;
            * **`saddle`** (`седло`, гиперболический параболоид) — `mode=гипар` (крыша с прямыми рёбрами) или `mode=седло` (чипс); толщина делает герметичную плиту;
            * **`stairs`** (`ступеньки`) — марш одной деталью: `steps` (частота), `rise`, `run`, `width` и `shape=прямая|скруглённая|скошенная`;
            * **`bead`** (`бусина`) — шар с каналом под шнур: `diameter`, `height`, `hole`, `chamfer`; тело строится вращением профиля, поэтому ширина точная;
            * исправлено скругление углов плоских контуров (перевёрнутый знак): `shape=скруглённая` у ступенек действительно округляет кромки;
            * пример **`examples/more_solids.forma`** — все восемь тел в одной сцене; 33 автотеста (`tests/test_v039.py`), 8 новых проверок `--uistest`, плакат `docs/whatsnew_039.png`, рецепты §32.

            **Что нового в 0.38 — порядок примитивов и три новых тела**

            * **каталог от простого к сложному**: в панели два раздела — «Примитивы» четырьмя ступенями (стандартные тела → производные → природные → готовые детали) и «Инструменты и способы». Раньше список открывался звездой и тарелкой, теперь первым видно лист и куб;
            * **`octa`** (`октаэдр`) — восемь треугольных граней, ширина и высота отдельно: `octa radius=30 height=80`; без `height` — правильный октаэдр;
            * **`ellipsoid`** (`эллипсоид`) — три полуоси в миллиметрах вместо `scale`: `ellipsoid x=60 y=40 z=22 x=…`; годится для голов, камней, посуды;
            * **`скоба`** (П / U / рамка) — деталь из листа: `стороны=3` даёт две полки и стенку (`open=вниз` — П, `вверх` — U-лоток), `стороны=4` — замкнутую прямоугольную рамку;
            * **однозначные имена**: `лист` — плоскость-лист, лист растения — `листок`; `плоскость` больше не уводит в разравнивание, `дуга` — в банан, `точить` — в заострение, `зеркало` — в зеркало-изделие; любая команда находит себя по имени;
            * пример **`examples/primitives.forma`** — четырнадцать стандартных тел в два ряда, каждое одной строкой;
            * 25 автотестов (`tests/test_v038.py`), 6 новых проверок `--uistest`, плакат `docs/whatsnew_038.png`, рецепты §31, карточки «Октаэдр», «Эллипсоид», «Скоба (П / U)», «Форма П», «Форма U».

            **Что нового в 0.37 — воронка, ориентация и посадка по осям хозяина**

            * **`воронка`** (`funnel`) — конус, трубка-носок и сквозной канал одной герметичной деталью: `top`, `bottom`, `height`, `spout`, `wall`, `lip`; стенка честная, кромка сверху открыта, канал в носке проходит насквозь;
            * **`ориентация`** — куда смотрят верх, низ, бока и перёд после поворотов, где центр габарита и где центр массы; предупреждает, если центр коробки попал в пустоту (тор, воронка); стороны можно задать вручную: `ориентация [деталь] верх=+x перед=-y`;
            * **`place … осями=хозяина`** — посадка по собственным осям повёрнутого хозяина: крышка садится на его настоящий верх и разворачивается вместе с ним (`align=нет` — оставить свою ориентацию); работают все стороны — top/bottom/left/right/front/back;
            * **зазор от крайней границы** хозяина, а не от центра: `offset=length(хозяин)` — слева на одну его длину; `gap=` — короткий синоним; стороны можно писать по-русски: `сторона=слева`;
            * **центр массы вместо центра коробки** — мерки `mx/my/mz`, `place … side=center центр=масса`, `на_границе … сторона=верх` (поиск только в верхней половине);
            * примеры **`examples/funnel.forma`** (кухонная воронка, маслёнка, сопло) и **`examples/orientation.forma`** (повёрнутый корпус, крышка на его верху, шайба слева);
            * 33 автотеста (`tests/test_v037.py`), 5 новых проверок `--uistest`, плакат `docs/whatsnew_037.png`, рецепты §30, карточки «Воронка» и «Деталь по осям хозяина».

            **Что нового в 0.36 — крюк, полуовал и посадка на настоящую границу**

            * **`крюк`** (он же `крючок`, `hook`) — гнутый пруток одной герметичной деталью: прямой хвост, дуга загиба настоящей окружностью и ушко на конце; `wire` — толщина прутка, `radius` — изгиб, `length` — хвост, `open=90…330` — угол загиба (90° кронштейн, 240° крючок для сумки, 270° вешалка), `eye=нет` убирает ушко;
            * **`полуовал`** — пластина с прямой кромкой снизу и дугой эллипса сверху; `hole` — диаметр сквозного отверстия, `hole=0` — сплошная накладка, слишком большое отверстие само подрезается под кромку, `hole_y` двигает его по высоте; подвес, накладка, подпятник, ушко, шильдик;
            * **`на_границе [деталь] on=хозяин`** — посадка на настоящую поверхность, а не на центр габаритной коробки: команда ищет ближайшую точку поверхности к `point=[x,y,z]`; `offset` — зазор, `align=нормаль` — развернуть деталь по нормали. Шайба садится на кольцо тора, шарик — на бок трубки, наклейка — на верх куба; точка внутри отверстия сажает деталь на внутреннюю кромку;
            * примеры **`examples/hook.forma`** (вешалка, крючок и кронштейн), **`examples/half_oval.forma`** (подвес, накладка, ушко), **`examples/surface.forma`** (детали на кольце тора и на кубе);
            * 27 автотестов (`tests/test_v036.py`), 8 новых проверок `--uistest`, плакат `docs/whatsnew_036.png`, рецепты §29, карточки «Крюк», «Полуовал» и «Деталь на границу».

            **Что нового в 0.35 — мерки соседа, размер по мерке и ряд с градацией**

            * **мерки соседа в любом параметре**: `0.5*width(ящик)`, `height(стол)`, `0.5*длина(доска)` — деталь ставится не на «пару сантиметров», а на долю длины соседа; добавились русские имена `ширина/глубина/высота/длина` (длина — наибольший габарит);
            * **`размер [деталь] width=1.5*width(сосед)`** — габарит по мерке: масштаб считается сам по фактическим размерам, остальные оси не меняются; есть `depth`, `height`, `length`, `factor`, `keep`;
            * **`ряд` — массив ступеней изменения**, а не одинаковых копий: `count`, `step`, `grow` (рост), `turn` (поворот за копию), `axis`; шаг можно задавать меркой — `step=[0.35*width(плита),0,0]`;
            * **сила инструмента ступенями**: `инструмент=вмятина|скрутка|сужение|сдвиг|надуть`, `сила` и `шаг_силы` — вмятины всё глубже, крутка сильнее, сужение резче; `soft` и `radius` настраивают пятно;
            * пример **`examples/wifi.forma`** — значок Wi-Fi: кольца, каждое в 1.5 раза больше, верхние половины после среза; **`examples/graded.forma`** — шесть брусков с нарастающей круткой и плита, размер которой задан мерками от ряда;
            * 23 автотеста (`tests/test_v035.py`), новые проверки `--uistest`, плакат `docs/whatsnew_035.png`, рецепты §28, карточки «Ряд с градацией» и «Размер по мерке».

            **Что нового в 0.34 — объёмный аниме-бюст, волосы, оригами, складки, цепь и инструкция для ИИ**

            * **аниме-пример стал объёмным бюстом**: `examples/anime_face.forma` — больше не плоская панель, а голова одним SDF-полем из пяти эллипсоидов (лоб, скулы, челюсть, подбородок через `smin`), отдельно нос и уши, шея капсулой, плечи; голова, шея и тело сварены в один объём `фигура`, его можно обойти кругом;
            * **волосы по-настоящему**: `волосинки` (пучок тонких волосков из общей основы, с изгибом и завитком на конце), `локон` (спираль с сужением и остриём), `чёлка` (ряд прядей по дуге через лоб, рваный край); все три дают одно тело, `at` — абсолютные координаты;
            * **лицо**: у `глаз` появились `rim` (тёмный контур по всему глазу — та самая аниме-подводка) и `depth` (глубина купола: 0.2 — наклейка, 1.0 — выпуклый глаз); `бровь` и `губы` ставятся точно в точку `at`;
            * **сгиб от угла, как в настоящем оригами**: `сгиб` режет деталь плоскостью по произвольной линии — `at` точка на линии, `dir` направление линии в градусах (0 — вдоль X, 45 — от угла), `angle` насколько сложить, `side` какая половина подвижная; длина сохраняется, лист не тянется;
            * **складки и заломы**: `складка` ставит след сгиба на готовую деталь — `mode=канавка` вычитает, `mode=гребень` приращивает, `bend` изгибает линию, `taper` сужает концы; одежда перестаёт быть гладким ящиком;
            * **цепь и соединение деталей**: `цепь` строит зацепленные звенья (звено вытянутое, соседние повёрнуты на 90°), `соединить [a, b]` вешает цепь между двумя готовыми деталями с провисом и сама подбирает число звеньев по длине;
            * **оригами — отдельная ниша**: новый пример `examples/origami.forma` собран только из листов и сгибов, склейка подписана отдельной деталью `клей`; `examples/chain.forma` — цепь, подвес и провис;
            * **инструкция для нейросети — отдельно от запроса**: кнопки «Скопировать инструкцию для ИИ» и «Скопировать все команды» в панели помощи; текст собирается из реестра команд, поэтому новая команда попадает туда сама; в ZIP лежат `ИНСТРУКЦИЯ_ДЛЯ_НЕЙРОСЕТИ.md` и `ВСЕ_КОМАНДЫ.md`;
            * 30 автотестов (`tests/test_v034.py`), новые проверки `--uistest`, плакат `docs/whatsnew_034.png`, рецепты §27.

            **Что нового в 0.33 — место в пространстве, меры и бюджет объёма**

            * `check имя положение x=… y=… z=…` и `check имя центр …` — абсолютное место детали с допуском в миллиметрах;
            * меры `top/bottom/height/width/depth/cx/cy/cz/volume` раскрываются в аргументах любой команды;
            * зазор, плоскость и паз доводятся по фактической геометрии, а не по габаритной коробке;
            * кубическая сетка стала бюджетом объёма: `сетка`, `вписать`, `check в_сетке`, кнопка «Записать бюджет»;
            * 39 автотестов, плакат `docs/whatsnew_033.png`, рецепты §26.

            **Что было раньше** — 0.31: меню у курсора, панели, часы без фризов, файлы в «Загрузки»; 0.30: плоскость-лист, рулон, гофра, оригами-сгиб; 0.29: дисковая пила и объяснения ошибок; 0.28: живые превью в карточках; 0.27: превью модели, отражения, свечение; 0.26: аниме- и манга-подача; 0.25: сгибы бумаги и рельеф; 0.24 и раньше — история в README.

