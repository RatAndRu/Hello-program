            **Что было в 0.16.0 — несколько сцен, кисть по граням и крепёж**

            * заготовленные сцены в одном файле: `animate … scene=дверь` / `scene=ящик`; в плеере переключатель «все сцены / дверь / ящик», у каждой сцены своя длительность, сценарий не меняется;
            * новые виды анимации: `jump height=120 elastic=да` (упругое сжатие при отталкивании и приземлении), `fall height=180 elastic=нет`, `fan rpm=900` (разгон вентилятора); `roll` крутит колесо вокруг собственной оси — колёса катятся по рейкам, а не летают вокруг центра модели;
            * контекстное меню правой кнопкой на предмете: выделить, скрыть/показать, показать полигонами (или вернуть сплошной вид), выделить все кубы пространства, где он находится, удалить;
            * кисть по полигонам: клик красит одну грань, «сброс» возвращает материал, покраска не сбивается анимацией;
            * бесшовная развёртка `auto` — трипланарная по мировым осям, без швов и перпендикулярных стыков на составных деталях;
            * восемь новых фигур крепежа и фурнитуры: `nut`, `bolt`, `screw`, `hinge`, `bracket`, `bearing`, `caster`, `pulley` — всего в «Инструментах» 16 фигур;
            * шкаф: ручка ящика в группе ящика, петли в группе двери, стенки и рейки не пропадают ни в одном кадре;
            * новый пример «Механика» — вентилятор, прыжок и падение; примеров стало двенадцать.

            **Что было в 0.15.0 — готовые фигуры, кубы пространства и конец анимации**

            * восемь готовых фигур одной командой: `star`, `cup`, `plate`, `spring`, `gear`, `washer`, `cube_hole`, `ring` — настоящие замкнутые тела, их можно резать и проверять;
            * кнопка «Инструменты»: у каждой фигуры поля параметров (лучи, глубина впадин, сглаживание, бевел, стенка, витки, модуль…), «Добавить» пишет строку в сценарий; рядом приёмы — надпись, резьба, уклон, сечение/проба/паспорт, скрутка и изгиб, фаска и облегчение;
            * «повтор: авто / всегда / стоп» в плеере: «стоп» останавливает анимацию на последнем кадре, настройка запоминается; в сценарии — `animate … loop=нет`;
            * режим «кубы»: пространство делится на кубические секторы с настраиваемым размером, выделение кликом или рамкой, Shift — добавить, Ctrl — убрать; приписка к объёму хранит число кубов, индексы (`i 0…1, …`), центр и объём, а в сценарий добавляется комментарий с теми же координатами;
            * примеры сокращены до одиннадцати: банан, гриб, кубик с отверстием, кружка со студией, «надпись, резьба и сечение», кружка с пошаговой сборкой и витрина инструментов убраны — их место заняли «Инструменты».

            **Что было в 0.14.0 — у каждого объекта своя анимация**

            * группы: `дверь = group [фасад, ручка]` — группа двигается одним клипом, а объекты внутри неё могут анимироваться сами;
            * клип привязан к объекту: `animate дверь turn angle=-95 axis=z pivot=[-481,-216,0]`; у каждого объекта своя очередь клипов, поэтому дверь, ящик и колёсики движутся одновременно;
            * `pivot=[x,y,z]` — поворот вокруг настоящей петли, а не вокруг центра детали;
            * `roll distance=250 radius=13` — качение колеса (угол = путь / радиус), `spin turns=2` — точное число оборотов;
            * подпись «движется: …» показывает активные объекты, а при просмотре кадров сборки подсвечивается тот, который появился или меняется;
            * пример «Шкаф»: накладные двери, ящик на направляющих, рейки и колёсики — один клип открывает дверь, выдвигает ящик и катит колёса.

            **Что было в 0.13.0 — сечения, пробы, паспорт, надписи, резьба**

            * `section z=40` строит 2D-сечение детали: контуры (внешние и внутренние), площадь, отверстия; в отчёте появилась панель сечения, а в меню «Экспорт» — DXF и SVG для проверки формы по чертежу;
            * `probe x=0 y=0 z=40` отвечает «материал есть / пусто» и показывает расстояние до стенки — так проверяют полости и тонкие стенки;
            * паспорт детали в отчёте и по команде `passport`: габариты, центр, масса, минимальная стенка, полость и найденные вертикальные отверстия (ø, координаты, сквозное или глухое);
            * честный контроль формы: у `simplify` параметр `deviation=0.2` (двустороннее расстояние Хаусдорфа), проверка `check деталь deviation "эталон.stl" 0.3` сравнивает модель с эталоном в миллиметрах;
            * `text "ФОРМА 3D" size=20 depth=3` — объёмные надписи своим векторным шрифтом (латиница, кириллица, цифры) без внешних файлов;
            * `emboss [деталь] text="ФОРМА" size=14 depth=1` выдавливает надпись на плоской грани или обёртывает вокруг цилиндра; `mode=engrave` гравирует, `mode=relief` делает рельеф;
            * `thread diameter=10 length=24 pitch=1.5` — настоящая винтовая резьба (болт), `internal=true` — гайка с внутренней резьбой; `draft [деталь] angle=2` — технологический уклон стенок;
            * пример «Надпись, резьба и сечение» показывает всё сразу: болт, гайку, табличку с рельефной надписью, уклон, сечение и пробу материала.

            **Что было в 0.12.0 — дорожки, свои клипы и ключевые кадры**

            * клипы играют параллельно: `track=1…8`, клипы одной дорожки идут друг за другом, разных — одновременно;
            * свои виды анимации: `move` (перемещение), `scale` (масштаб), `turn` (доворот), `wait` (пауза), `morph` (изменение геометрии по параметру сценария);
            * у `move`/`scale`/`turn` можно указать `object=имя` — движется только эта деталь, вокруг своего центра;
            * ключевые кадры `keyframe имя at=2 pos=[0,0,30] rot=[0,0,90] scale=1.2` с плавной интерполяцией; ключи и клипы играют вместе;
            * `morph` действительно перестраивает геометрию: кадры с разным значением параметра (`R`, `H`, …) строятся на сервере и кешируются;
            * оси подписаны однозначно: x — влево/вправо, y — глубина, z — вверх, `-z` — в обратную сторону;
            * таймлайн прокручивается внутри панели: десятки клипов, ключей и шагов сборки не вылезают за окно;
            * «сборка по шагам» работает и внутри клипов: в её время показываются настоящие кадры сценария;
            * измерения `height/width/top/cx/volume(объект)` прямо в формулах и `place [деталь] on=корпус side=top offset=2`;
            * в GLB пишутся все клипы и ключи (`FormaMove`, `FormaScale`, `FormaTurn`, `FormaKeys_*`, узлы `FormaPivot_*`).

            **Что было в 0.11.0 — анимация играет, история пишется сама**

            * анимация снова работает: исправлена ошибка загрузки, обрывавшая настройку тайм-лайна (`applyShading`); клипы `animate` играют у кружки, человека и любой модели, у кружки вращение включено в примере;
            * кнопка «играть» показывает вращение даже без строк `animate` — предпросмотр не записывается в сценарий;
            * ось вращения проходит через центр модели: ручка кружки больше не заставляет её «плясать» по кругу;
            * сбой оформления (свет, тени) больше не показывается как «не удалось показать модель» — модель уже в сцене;
            * история пишется автоматически: правка редактора, команда, материал, текстура и удаление объекта становятся шагами, откат и возврат работают кнопками и кликом по шагу;
