            * кубы пространства обхватывают модель при любой ячейке: бюджет 48 000 клеток вместо обрезки 32 на ось, объём сужается до выбранного предмета, подпись честно говорит «5 мм → клетки по 13,7 мм»;
            * во время анимации подсвечивается строка сценария, которая играет сейчас (параллельные движения — бледнее), текст сам подкручивается;
