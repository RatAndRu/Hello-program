name: Собрать Windows EXE — Форма 3D

# Ручной запуск: Actions -> "Собрать Windows EXE — Форма 3D" -> Run workflow.
# Плюс автозапуск при изменениях в папке forma/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'forma/**'
      - '.github/workflows/build-forma-windows.yml'

jobs:
  build-exe:
    name: EXE + ZIP (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # без этого кириллица в выводе падает на Windows (cp1251/charmap)
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: bash

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: forma/requirements.txt

      - name: Установить зависимости
        working-directory: forma
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Прогнать тесты ядра
        working-directory: forma
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # публикуем имена упавших тестов аннотациями: логи иногда недоступны
            grep -E "^(FAIL|ERROR):" tests.log | while read -r line; do
              echo "::error::$line"
            done
            tail -60 tests.log
          fi
          exit "$rc"

      - name: Подготовить иконку и версию
        working-directory: forma
        run: |
          python tools/make_icon.py
          python tools/write_version_info.py

      - name: Собрать EXE
        working-directory: forma
        run: |
          pyinstaller packaging/forma.spec --noconfirm --clean --distpath dist --workpath build/pyi
          ls -la dist
          python - <<'PY'
          from pathlib import Path
          exe = Path('dist/Forma3D.exe')
          print(f"EXE: {exe.stat().st_size / 1024 / 1024:.1f} МБ")
          PY

      - name: Проверить, что EXE не распух
        working-directory: forma
        run: |
          python - <<'PY'
          from pathlib import Path
          size = Path('dist/Forma3D.exe').stat().st_size / 1024 / 1024
          print(f"EXE: {size:.1f} МБ")
          if size > 60:
              raise SystemExit(
                  f"EXE вырос до {size:.0f} МБ — похоже, в сборку попала лишняя "
                  "библиотека (scipy/skimage/Pillow/networkx). Проверьте "
                  "packaging/forma.spec и requirements.txt."
              )
          PY

      - name: Проверить собранный EXE (самопроверка моделей)
        working-directory: forma
        run: |
          rm -f selftest.txt
          ./dist/Forma3D.exe --selftest --report selftest.txt &
          exe_pid=$!
          for i in $(seq 1 180); do
            if [ -s selftest.txt ]; then break; fi
            if ! kill -0 "$exe_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -s selftest.txt ]; then
            echo "EXE не отчитался о самопроверке за 180 с"
            taskkill //F //IM Forma3D.exe || true
            echo "=== диагностическая сборка с консолью (чтобы видеть ошибку) ==="
            FORMA_CONSOLE=1 pyinstaller packaging/forma.spec --noconfirm --clean \
              --distpath distc --workpath build/pyic 2>&1 | tail -3
            ./distc/Forma3D.exe --selftest 2>&1 | tail -40 || true
            exit 1
          fi
          cat selftest.txt

      - name: Проверить интерфейс внутри EXE (API, 3D-ресурсы, снимки)
        working-directory: forma
        run: |
          rm -f uitest.txt
          ./dist/Forma3D.exe --uistest --report uitest.txt &
          exe_pid=$!
          for i in $(seq 1 240); do
            if [ -s uitest.txt ]; then break; fi
            if ! kill -0 "$exe_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -s uitest.txt ]; then
            echo "EXE не отчитался о проверке интерфейса за 240 с"
            taskkill //F //IM Forma3D.exe || true
            exit 1
          fi
          cat uitest.txt
          grep -q "ИТОГ: всё в порядке" uitest.txt

      - name: Подготовить ZIP с понятным именем
        working-directory: forma
        run: |
          mkdir -p release
          cp dist/Forma3D.exe release/
          cp packaging/README_FIRST.txt release/ЧИТАЙ_МЕНЯ.txt
          cp packaging/icon_256.png release/icon.png
          python - <<'PY'
          from pathlib import Path
          import zipfile, sys
          sys.path.insert(0, '.')
          from forma.agent import command_reference_md
          from forma.version import __version__
          root = Path('release')
          (root / 'СПРАВКА_КОМАНДЫ.md').write_text(command_reference_md(), encoding='utf-8')
          recipes = Path('docs/RECIPES.md')
          if recipes.exists():
              (root / 'РЕЦЕПТЫ.md').write_text(recipes.read_text(encoding='utf-8'), encoding='utf-8')
          examples = Path('release/examples')
          examples.mkdir(exist_ok=True)
          for p in Path('examples').glob('*.forma'):
              (examples / p.name).write_text(p.read_text(encoding='utf-8'), encoding='utf-8')
          zip_path = Path(f'Forma3D-{__version__}-windows.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      zf.write(p, p.relative_to(root))
          print('ZIP:', zip_path, zip_path.stat().st_size, 'байт')
          PY

      - name: Загрузить в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Forma3D-windows
          path: |
            forma/Forma3D-*-windows.zip
            forma/dist/Forma3D.exe
            forma/selftest.txt
            forma/uitest.txt
          if-no-files-found: error
          retention-days: 60

      - name: Опубликовать EXE и ZIP в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forma3d-exe-${{ github.run_number }}-${{ github.run_attempt }}
          name: Форма 3D — Windows EXE (сборка ${{ github.run_number }})
          body: |
            **Форма 3D** — параметрический 3D-редактор, которым управляют текстом.

            * `Forma3D-…-windows.zip` — распакуй и запусти `Forma3D.exe` (рекомендуется).
            * `Forma3D.exe` — то же приложение одним файлом.

            **Что нового в 0.18.0 — покраска регионами, собранные часы и мотоцикл**

            * `paint` — покраска регионами одной командой: `paint кружка #2f6fb0 height=18..34`, `side=верх/низ/бок`, `box=[…]`, `radius=30..60`; цвет уходит и в PNG, и в GLB (COLOR_0), регион переживает пересборку;
            * кисть работает только у выделенного предмета и красит мазком с зажатой кнопкой, а не по одному полигону; каждый мазок — одна строка `paint` в сценарии;
            * вентилятор больше не дёргается: угол считается одной непрерывной фазой на объект, разгон 0,5 с, на стыках клипов скорость не скачет (проверено покадрово);
            * «Скелетон-часы»: модуль передачи 2.6, плотная компоновка — барабан, минутное, промежуточное, секундное и анкерное колёса, мотор, анкер и баланс с волоском; межосевые расстояния строго `m·(z1+z2)/2`, 36 проверок, 30 параллельных движений, все 60 деталей в одной сборке;
            * «Шкаф-витрина»: колёсики на кронштейнах (ось вдоль X, катятся по рейкам), настоящие петли из трёх частей, крепёж входит в детали; 16 из 16 деталей связаны;
            * «Мотоцикл»: 50 из 50 деталей связаны — зеркала и грипсы держатся на руле, крылья на стойках, амортизатор между рамой и маятником;
            * во время анимации клик по сцене ничего не выделяет — движение и подсветка не перебиваются;
            * правая кнопка только вращает и сдвигает камеру: она не выделяет предмет и не возвращает камеру в исходное положение;
            * камера наводится на деталь плавно и только при первом наведении — без телепорта на каждом кадре; строка сценария подкручивается плавно, а не прыжком;
            * винт с полукруглой головкой больше не падает с внутренней ошибкой; габариты, зазоры и число частей проверяются у всех витрин;
            * 271 автотест, `--uistest`, `--selftest` и стенд интерфейса — зелёные.

            **Что было в 0.17.0 — корпуса, часы и мотоцикл**

            * Delete (и Backspace) удаляет выделенный предмет или выделенный сектор пространства;
            * «Инструменты» — 44 карточки в пяти группах: примитивы, корпуса и посуда (корпус кружки, панель, ящик, коробка), механика, крепёж, природа; «Скрутка» и «Изгиб», «Болт» и «Гайка», «Фаска» и «Облегчение» разведены по разным карточкам;
            * десять новых команд: `panel`, `drawer`, `rail`, `profile2020`, `gusset`, `leg`, `grommet`, `worm`, `horn`, `knurl` — всего в реестре 101 команда;
            * новый пример «Мотоцикл»: база 1400 мм, колёса Ø600, вилка 31°, рама, бак, седло, двигатель с рёбрами, выпуск, амортизаторы; ничего не висит в воздухе; сцены «езда» (колёса катятся, подвеска качается) и «прыжок»;
            * новый пример «Скелетон-часы»: механизм m = 2, барабан → минутное → промежуточное → секундное → анкерное колесо, анкер, баланс с волоском, мотор; стрелки на 10:10:35, сцена «ход» — все 36 движений параллельны;
            * витрина из 44 предметов: массивы по кругу, сеткой и линейно, разброс листвы, оболочка, отверстия, протяжка, тела вращения и все новые детали;
            * экспорт анимации в **GIF** (свой кодек, до 240 кадров) и **WebM** (30 кадр/с) — файл ложится в «Загрузки»;
            * кубы пространства обхватывают модель при любой ячейке: бюджет 48 000 клеток вместо обрезки 32 на ось, объём сужается до выбранного предмета, подпись честно говорит «5 мм → клетки по 13,7 мм»;
            * во время анимации подсвечивается строка сценария, которая играет сейчас (параллельные движения — бледнее), текст сам подкручивается;
            * шаги сборки пропускают `check`, `color`, `probe`, `passport`, `light`, `scene`, `param`, `note` — анимация не стоит на проверках (у часов 109 кадров из 195 команд);
            * выделили деталь — всё, что её закрывает от камеры, показывается прозрачным каркасом (кнопка «заслонки», пересчёт при повороте камеры);
            * кнопка «вокруг» вращает и приближает вокруг выделенного предмета, ⌖ наводит камеру на него;
            * подпись и статус показывают габариты, объём, массу, треугольники, число частей и строку сценария выбранной детали;
            * анимация больше не включается сама при открытии примера или проекта — сначала готовая статичная модель, движение по кнопке ▶.

            **Что было в 0.16.0 — несколько сцен, кисть по граням и крепёж**

            * заготовленные сцены в одном файле: `animate … scene=дверь` / `scene=ящик`; в плеере переключатель «все сцены / дверь / ящик», у каждой сцены своя длительность, сценарий не меняется;
            * новые виды анимации: `jump height=120 elastic=да` (упругое сжатие при отталкивании и приземлении), `fall height=180 elastic=нет`, `fan rpm=900` (разгон вентилятора); `roll` крутит колесо вокруг собственной оси — колёса катятся по рейкам, а не летают вокруг центра модели;
            * контекстное меню правой кнопкой на предмете: выделить, скрыть/показать, показать полигонами (или вернуть сплошной вид), выделить все кубы пространства, где он находится, удалить;
            * кисть по полигонам: клик красит одну грань, «сброс» возвращает материал, покраска не сбивается анимацией;
            * бесшовная развёртка `auto` — трипланарная по мировым осям, без швов и перпендикулярных стыков на составных деталях;
            * восемь новых фигур крепежа и фурнитуры: `nut`, `bolt`, `screw`, `hinge`, `bracket`, `bearing`, `caster`, `pulley` — всего в «Инструментах» 16 фигур;
            * шкаф: ручка ящика в группе ящика, петли в группе двери, стенки и рейки не пропадают ни в одном кадре;
            * новый пример «Механика» — вентилятор, прыжок и падение; примеров стало двенадцать.

            **Что было в 0.15.0 — готовые фигуры, кубы пространства и конец анимации**

            * восемь готовых фигур одной командой: `star`, `cup`, `plate`, `spring`, `gear`, `washer`, `cube_hole`, `ring` — настоящие замкнутые тела, их можно резать и проверять;
            * кнопка «Инструменты»: у каждой фигуры поля параметров (лучи, глубина впадин, сглаживание, бевел, стенка, витки, модуль…), «Добавить» пишет строку в сценарий; рядом приёмы — надпись, резьба, уклон, сечение/проба/паспорт, скрутка и изгиб, фаска и облегчение;
            * «повтор: авто / всегда / стоп» в плеере: «стоп» останавливает анимацию на последнем кадре, настройка запоминается; в сценарии — `animate … loop=нет`;
            * режим «кубы»: пространство делится на кубические секторы с настраиваемым размером, выделение кликом или рамкой, Shift — добавить, Ctrl — убрать; приписка к объёму хранит число кубов, индексы (`i 0…1, …`), центр и объём, а в сценарий добавляется комментарий с теми же координатами;
            * примеры сокращены до одиннадцати: банан, гриб, кубик с отверстием, кружка со студией, «надпись, резьба и сечение», кружка с пошаговой сборкой и витрина инструментов убраны — их место заняли «Инструменты».

            **Что было в 0.14.0 — у каждого объекта своя анимация**

            * группы: `дверь = group [фасад, ручка]` — группа двигается одним клипом, а объекты внутри неё могут анимироваться сами;
            * клип привязан к объекту: `animate дверь turn angle=-95 axis=z pivot=[-481,-216,0]`; у каждого объекта своя очередь клипов, поэтому дверь, ящик и колёсики движутся одновременно;
            * `pivot=[x,y,z]` — поворот вокруг настоящей петли, а не вокруг центра детали;
            * `roll distance=250 radius=13` — качение колеса (угол = путь / радиус), `spin turns=2` — точное число оборотов;
            * подпись «движется: …» показывает активные объекты, а при просмотре кадров сборки подсвечивается тот, который появился или меняется;
            * пример «Шкаф»: накладные двери, ящик на направляющих, рейки и колёсики — один клип открывает дверь, выдвигает ящик и катит колёса.

            **Что было в 0.13.0 — сечения, пробы, паспорт, надписи, резьба**

            * `section z=40` строит 2D-сечение детали: контуры (внешние и внутренние), площадь, отверстия; в отчёте появилась панель сечения, а в меню «Экспорт» — DXF и SVG для проверки формы по чертежу;
            * `probe x=0 y=0 z=40` отвечает «материал есть / пусто» и показывает расстояние до стенки — так проверяют полости и тонкие стенки;
            * паспорт детали в отчёте и по команде `passport`: габариты, центр, масса, минимальная стенка, полость и найденные вертикальные отверстия (ø, координаты, сквозное или глухое);
            * честный контроль формы: у `simplify` параметр `deviation=0.2` (двустороннее расстояние Хаусдорфа), проверка `check деталь deviation "эталон.stl" 0.3` сравнивает модель с эталоном в миллиметрах;
            * `text "ФОРМА 3D" size=20 depth=3` — объёмные надписи своим векторным шрифтом (латиница, кириллица, цифры) без внешних файлов;
            * `emboss [деталь] text="ФОРМА" size=14 depth=1` выдавливает надпись на плоской грани или обёртывает вокруг цилиндра; `mode=engrave` гравирует, `mode=relief` делает рельеф;
            * `thread diameter=10 length=24 pitch=1.5` — настоящая винтовая резьба (болт), `internal=true` — гайка с внутренней резьбой; `draft [деталь] angle=2` — технологический уклон стенок;
            * пример «Надпись, резьба и сечение» показывает всё сразу: болт, гайку, табличку с рельефной надписью, уклон, сечение и пробу материала.

            **Что было в 0.12.0 — дорожки, свои клипы и ключевые кадры**

            * клипы играют параллельно: `track=1…8`, клипы одной дорожки идут друг за другом, разных — одновременно;
            * свои виды анимации: `move` (перемещение), `scale` (масштаб), `turn` (доворот), `wait` (пауза), `morph` (изменение геометрии по параметру сценария);
            * у `move`/`scale`/`turn` можно указать `object=имя` — движется только эта деталь, вокруг своего центра;
            * ключевые кадры `keyframe имя at=2 pos=[0,0,30] rot=[0,0,90] scale=1.2` с плавной интерполяцией; ключи и клипы играют вместе;
            * `morph` действительно перестраивает геометрию: кадры с разным значением параметра (`R`, `H`, …) строятся на сервере и кешируются;
            * оси подписаны однозначно: x — влево/вправо, y — глубина, z — вверх, `-z` — в обратную сторону;
            * таймлайн прокручивается внутри панели: десятки клипов, ключей и шагов сборки не вылезают за окно;
            * «сборка по шагам» работает и внутри клипов: в её время показываются настоящие кадры сценария;
            * измерения `height/width/top/cx/volume(объект)` прямо в формулах и `place [деталь] on=корпус side=top offset=2`;
            * в GLB пишутся все клипы и ключи (`FormaMove`, `FormaScale`, `FormaTurn`, `FormaKeys_*`, узлы `FormaPivot_*`).

            **Что было в 0.11.0 — анимация играет, история пишется сама**

            * анимация снова работает: исправлена ошибка загрузки, обрывавшая настройку тайм-лайна (`applyShading`); клипы `animate` играют у кружки, человека и любой модели, у кружки вращение включено в примере;
            * кнопка «играть» показывает вращение даже без строк `animate` — предпросмотр не записывается в сценарий;
            * ось вращения проходит через центр модели: ручка кружки больше не заставляет её «плясать» по кругу;
            * сбой оформления (свет, тени) больше не показывается как «не удалось показать модель» — модель уже в сцене;
            * история пишется автоматически: правка редактора, команда, материал, текстура и удаление объекта становятся шагами, откат и возврат работают кнопками и кликом по шагу;
            * удаление объектов из списка кнопкой 🗑 (в сценарий пишется `удалить имя`), Ctrl+Z возвращает;
            * кисти человека в SDF-сборке соединены с предплечьями: фигура — одна замкнутая оболочка, самопроверка проходит целиком.

            **Что было в 0.10.0 — подсветка выбора, спайка и песочница текстур**

            * выбранный в правом меню объект подсвечивается в 3D (свечение и рамка), двойной клик наводит на него камеру;
            * скрытые детали (цилиндр и ручка кружки, вошедшие в `union`/`weld`) остаются скрытыми после пересборки и открываются одним кликом по глазку;
            * новые команды `trim` и `weld` с допуском: отсекают лишнее и спаивают шов — внутри не остаётся геометрии «одна в другой»;
            * число сегментов ограничено допуском 0,06 мм: `segments=400` больше не раздувает модель; `optimize all tolerance=0.15` и кнопка «облегчить» убирают лишние грани у всех объектов;
            * песочница генеративных текстур: 8 узоров, два цвета, масштаб, вариация и рельеф 0…1; рельеф запекается в карту нормалей, которая видна и в окне, и в GLB (Blender видит normalTexture);
            * командная строка стала многострочной (Enter — выполнить, Shift+Enter — новая строка): большие сценарии вставляются целиком;
            * пример «Яблоко» переделан: настоящая верхняя чашечка с черешком и нижняя ямка, 9/9 проверок; перевёрнутость исправлена;
            * из примеров убран «человек-манекен» — остался витринный манекен в T-позе и анатомическая фигура;
            * исправлено ложное «нет ни одной детали» на старте и добавлена честная диагностика, если GLB загрузился пустым.

            **Что было в 0.9.0**

            * данные приложения лежат рядом с EXE: `projects`, `exports`, `renders`, `prompts`, `textures`, `imports`; старые папки в `%APPDATA%` переносятся и удаляются;
            * полноценный редактор анимации: тайм-лайн с клипами, прокрутка времени, покадровый шаг, play/pause, скорость;
            * клипов может быть несколько; каждый уходит в GLB отдельным действием (`FormaSpin`, `FormaFormation`, `FormaExplode`);
            * анимация сборки `animate kind=assembly` проигрывает шаги сценария настоящими кадрами;
            * многострочный сценарий вставляется в командную строку и заменяет текущий (откат Ctrl+Z).

            **Что было в 0.7.0**

            * `fillet` скругляет выбранные кромки: `edges=convex` (наружные), `concave` (внутренние), `all`; размер детали не меняется;
            * новый `chamfer` — плоская фаска 45° с шириной в миллиметрах;
            * математические поверхности (from_sdf, blob) считаются массивами numpy + marching cubes: в 3–4 раза быстрее, без падений на «плохих» точках формулы;
            * результат SDF упрощается с контролем объёма: меньше треугольников при той же форме;
            * метрики быстрее в 2–3 раза (толщина стенки — по упрощённой копии, один объект не считается дважды): 15 примеров собираются за 12 с вместо 29;
            * `tri_quality` считает «иглой» угол меньше 3° — веерные торцы больше не брак;
            * шестерня с настоящим зубчатым венцом и четырьмя формами окон, пробка бутылки с 32 ложбинами и пояском;
            * 22 регрессионных теста, включая скругление и фаску.

            **Что было в 0.6.0**

            * правая кнопка мыши теперь перемещает сцену, колесо — приближает; в режиме «выбор» левая кнопка тянет рамку, средняя вращает;
            * выделение рамкой: обводите область мышью — подсветятся все треугольники внутри, Shift добавляет к прежним, Ctrl+клик убирает область;
            * все готовые файлы (GLB, STL, OBJ, PLY, 3MF, BLEND, ZIP, PNG, .forma) сохраняются в папку «Загрузки»;
            * текстуры можно создавать свои: узор (полосы, клетка, волны, градиент, шум, камень, точки, сетка) и два любых цвета — прямо в панели материала;
            * ползунки шероховатости, металличности и цвет больше не откатываются при переключении объектов: значения записываются в сценарий;
            * убраны швы текстур: рисунок генерируется бесшовным по построению;
            * тесселяция по размеру: куб — 12 треугольников, сфера Ø400 — меньше 20 тысяч вместо фиксированных тысяч на любой размер, число сегментов считается по допуску;
            * свет: добавлена минимальная освещённость, тёмных провалов внутри и снизу модели больше нет;
            * фаска `bevel` теперь настоящая: радиус в миллиметрах, размер детали не меняется (раньше куб 60 мм раздувался на 42 %);
            * bend и twist дробят сетку по длине ребра — объём сохраняется с точностью 0,01 %, изгиб плавный;
            * новые проверки: `sharp_edge`, `tri_quality`, `wall_min` (с координатой самого тонкого места);
            * `box round=` разрешает скругление ровно в половину толщины (плита 150×75×10 с round=5);
            * импорт: `unit=auto` больше не угадывает масштаб (считает миллиметрами), `repair` по умолчанию выключен и предупреждает об изменении объёма;
            * повторное имя объекта — понятная ошибка вместо молчаливой замены; `R = 10/0` объясняет деление на ноль; `fillet [нет]` подсказывает формат;
            * from_sdf не падает на «плохих» точках формулы и ровняет сетку по целому числу ячеек;
            * новые команды: `clean` (сварка вершин и мусор), экспорт 3MF, `forma diff a b`, `forma doctor`, `forma build --strict` и `--digest`, `--json`, `--trace`;
            * в запрос к нейросети добавлена таблица метрик прошлой сборки;
            * 18 новых регрессионных тестов: объём и габарит держатся в пределах 0,1–1 %.

