name: Собрать Windows EXE — Форма 3D

# Ручной запуск: Actions -> "Собрать Windows EXE — Форма 3D" -> Run workflow.
# Плюс автозапуск при изменениях в папке forma/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'forma/**'
      - '.github/workflows/build-forma-windows.yml'

jobs:
  build-exe:
    name: EXE + ZIP (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # без этого кириллица в выводе падает на Windows (cp1251/charmap)
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: bash

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: forma/requirements.txt

      - name: Установить зависимости
        working-directory: forma
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Прогнать тесты ядра
        working-directory: forma
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # публикуем имена упавших тестов аннотациями: логи иногда недоступны
            grep -E "^(FAIL|ERROR):" tests.log | while read -r line; do
              echo "::error::$line"
            done
            tail -60 tests.log
          fi
          exit "$rc"

      - name: Подготовить иконку и версию
        working-directory: forma
        run: |
          python tools/make_icon.py
          python tools/write_version_info.py

      - name: Собрать EXE
        working-directory: forma
        run: |
          pyinstaller packaging/forma.spec --noconfirm --clean --distpath dist --workpath build/pyi
          ls -la dist
          python - <<'PY'
          from pathlib import Path
          exe = Path('dist/Forma3D.exe')
          print(f"EXE: {exe.stat().st_size / 1024 / 1024:.1f} МБ")
          PY

      - name: Проверить, что EXE не распух
        working-directory: forma
        run: |
          python - <<'PY'
          from pathlib import Path
          size = Path('dist/Forma3D.exe').stat().st_size / 1024 / 1024
          print(f"EXE: {size:.1f} МБ")
          if size > 60:
              raise SystemExit(
                  f"EXE вырос до {size:.0f} МБ — похоже, в сборку попала лишняя "
                  "библиотека (scipy/skimage/Pillow/networkx). Проверьте "
                  "packaging/forma.spec и requirements.txt."
              )
          PY

      - name: Проверить собранный EXE (самопроверка моделей)
        working-directory: forma
        run: |
          rm -f selftest.txt
          ./dist/Forma3D.exe --selftest --report selftest.txt &
          exe_pid=$!
          for i in $(seq 1 180); do
            if [ -s selftest.txt ]; then break; fi
            if ! kill -0 "$exe_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -s selftest.txt ]; then
            echo "EXE не отчитался о самопроверке за 180 с"
            taskkill //F //IM Forma3D.exe || true
            echo "=== диагностическая сборка с консолью (чтобы видеть ошибку) ==="
            FORMA_CONSOLE=1 pyinstaller packaging/forma.spec --noconfirm --clean \
              --distpath distc --workpath build/pyic 2>&1 | tail -3
            ./distc/Forma3D.exe --selftest 2>&1 | tail -40 || true
            exit 1
          fi
          cat selftest.txt

      - name: Проверить интерфейс внутри EXE (API, 3D-ресурсы, снимки)
        working-directory: forma
        run: |
          rm -f uitest.txt
          ./dist/Forma3D.exe --uistest --report uitest.txt &
          exe_pid=$!
          for i in $(seq 1 240); do
            if [ -s uitest.txt ]; then break; fi
            if ! kill -0 "$exe_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -s uitest.txt ]; then
            echo "EXE не отчитался о проверке интерфейса за 240 с"
            taskkill //F //IM Forma3D.exe || true
            exit 1
          fi
          cat uitest.txt
          grep -q "ИТОГ: всё в порядке" uitest.txt

      - name: Подготовить ZIP с понятным именем
        working-directory: forma
        run: |
          mkdir -p release
          cp dist/Forma3D.exe release/
          cp packaging/README_FIRST.txt release/ЧИТАЙ_МЕНЯ.txt
          cp packaging/icon_256.png release/icon.png
          python - <<'PY'
          from pathlib import Path
          import zipfile, sys
          sys.path.insert(0, '.')
          from forma.agent import command_reference_md
          from forma.version import __version__
          root = Path('release')
          (root / 'СПРАВКА_КОМАНДЫ.md').write_text(command_reference_md(), encoding='utf-8')
          recipes = Path('docs/RECIPES.md')
          if recipes.exists():
              (root / 'РЕЦЕПТЫ.md').write_text(recipes.read_text(encoding='utf-8'), encoding='utf-8')
          examples = Path('release/examples')
          examples.mkdir(exist_ok=True)
          for p in Path('examples').glob('*.forma'):
              (examples / p.name).write_text(p.read_text(encoding='utf-8'), encoding='utf-8')
          zip_path = Path(f'Forma3D-{__version__}-windows.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      zf.write(p, p.relative_to(root))
          print('ZIP:', zip_path, zip_path.stat().st_size, 'байт')
          PY

      - name: Загрузить в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Forma3D-windows
          path: |
            forma/Forma3D-*-windows.zip
            forma/dist/Forma3D.exe
            forma/selftest.txt
            forma/uitest.txt
          if-no-files-found: error
          retention-days: 60

      - name: Опубликовать EXE и ZIP в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forma3d-exe-${{ github.run_number }}-${{ github.run_attempt }}
          name: Форма 3D — Windows EXE (сборка ${{ github.run_number }})
          body: |
            **Форма 3D** — параметрический 3D-редактор, которым управляют текстом.

            * `Forma3D-…-windows.zip` — распакуй и запусти `Forma3D.exe` (рекомендуется).
            * `Forma3D.exe` — то же приложение одним файлом.

            **Что нового в 0.10.0 — подсветка выбора, спайка и песочница текстур**

            * выбранный в правом меню объект подсвечивается в 3D (свечение и рамка), двойной клик наводит на него камеру;
            * скрытые детали (цилиндр и ручка кружки, вошедшие в `union`/`weld`) остаются скрытыми после пересборки и открываются одним кликом по глазку;
            * новые команды `trim` и `weld` с допуском: отсекают лишнее и спаивают шов — внутри не остаётся геометрии «одна в другой»;
            * число сегментов ограничено допуском 0,06 мм: `segments=400` больше не раздувает модель; `optimize all tolerance=0.15` и кнопка «облегчить» убирают лишние грани у всех объектов;
            * песочница генеративных текстур: 8 узоров, два цвета, масштаб, вариация и рельеф 0…1; рельеф запекается в карту нормалей, которая видна и в окне, и в GLB (Blender видит normalTexture);
            * командная строка стала многострочной (Enter — выполнить, Shift+Enter — новая строка): большие сценарии вставляются целиком;
            * пример «Яблоко» переделан: настоящая верхняя чашечка с черешком и нижняя ямка, 9/9 проверок; перевёрнутость исправлена;
            * из примеров убран «человек-манекен» — остался витринный манекен в T-позе и анатомическая фигура;
            * исправлено ложное «нет ни одной детали» на старте и добавлена честная диагностика, если GLB загрузился пустым.

            **Что было в 0.9.0**

            * данные приложения лежат рядом с EXE: `projects`, `exports`, `renders`, `prompts`, `textures`, `imports`; старые папки в `%APPDATA%` переносятся и удаляются;
            * полноценный редактор анимации: тайм-лайн с клипами, прокрутка времени, покадровый шаг, play/pause, скорость;
            * клипов может быть несколько; каждый уходит в GLB отдельным действием (`FormaSpin`, `FormaFormation`, `FormaExplode`);
            * анимация сборки `animate kind=assembly` проигрывает шаги сценария настоящими кадрами;
            * многострочный сценарий вставляется в командную строку и заменяет текущий (откат Ctrl+Z).

            **Что было в 0.7.0**

            * `fillet` скругляет выбранные кромки: `edges=convex` (наружные), `concave` (внутренние), `all`; размер детали не меняется;
            * новый `chamfer` — плоская фаска 45° с шириной в миллиметрах;
            * математические поверхности (from_sdf, blob) считаются массивами numpy + marching cubes: в 3–4 раза быстрее, без падений на «плохих» точках формулы;
            * результат SDF упрощается с контролем объёма: меньше треугольников при той же форме;
            * метрики быстрее в 2–3 раза (толщина стенки — по упрощённой копии, один объект не считается дважды): 15 примеров собираются за 12 с вместо 29;
            * `tri_quality` считает «иглой» угол меньше 3° — веерные торцы больше не брак;
            * шестерня с настоящим зубчатым венцом и четырьмя формами окон, пробка бутылки с 32 ложбинами и пояском;
            * 22 регрессионных теста, включая скругление и фаску.

            **Что было в 0.6.0**

            * правая кнопка мыши теперь перемещает сцену, колесо — приближает; в режиме «выбор» левая кнопка тянет рамку, средняя вращает;
            * выделение рамкой: обводите область мышью — подсветятся все треугольники внутри, Shift добавляет к прежним, Ctrl+клик убирает область;
            * все готовые файлы (GLB, STL, OBJ, PLY, 3MF, BLEND, ZIP, PNG, .forma) сохраняются в папку «Загрузки»;
            * текстуры можно создавать свои: узор (полосы, клетка, волны, градиент, шум, камень, точки, сетка) и два любых цвета — прямо в панели материала;
            * ползунки шероховатости, металличности и цвет больше не откатываются при переключении объектов: значения записываются в сценарий;
            * убраны швы текстур: рисунок генерируется бесшовным по построению;
            * тесселяция по размеру: куб — 12 треугольников, сфера Ø400 — меньше 20 тысяч вместо фиксированных тысяч на любой размер, число сегментов считается по допуску;
            * свет: добавлена минимальная освещённость, тёмных провалов внутри и снизу модели больше нет;
            * фаска `bevel` теперь настоящая: радиус в миллиметрах, размер детали не меняется (раньше куб 60 мм раздувался на 42 %);
            * bend и twist дробят сетку по длине ребра — объём сохраняется с точностью 0,01 %, изгиб плавный;
            * новые проверки: `sharp_edge`, `tri_quality`, `wall_min` (с координатой самого тонкого места);
            * `box round=` разрешает скругление ровно в половину толщины (плита 150×75×10 с round=5);
            * импорт: `unit=auto` больше не угадывает масштаб (считает миллиметрами), `repair` по умолчанию выключен и предупреждает об изменении объёма;
            * повторное имя объекта — понятная ошибка вместо молчаливой замены; `R = 10/0` объясняет деление на ноль; `fillet [нет]` подсказывает формат;
            * from_sdf не падает на «плохих» точках формулы и ровняет сетку по целому числу ячеек;
            * новые команды: `clean` (сварка вершин и мусор), экспорт 3MF, `forma diff a b`, `forma doctor`, `forma build --strict` и `--digest`, `--json`, `--trace`;
            * в запрос к нейросети добавлена таблица метрик прошлой сборки;
            * 18 новых регрессионных тестов: объём и габарит держатся в пределах 0,1–1 %.

            Внутри ZIP: программа, справка по командам и примеры (кружка, банан, гриб,
            ваза, бутылка, шестерня, кузов, манекен и анатомическая фигура),
            а также РЕЦЕПТЫ.md с готовыми текстовыми сценариями.
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            forma/Forma3D-*-windows.zip
            forma/dist/Forma3D.exe
