name: Собрать Windows EXE — Форма 3D

# Ручной запуск: Actions -> "Собрать Windows EXE — Форма 3D" -> Run workflow.
# Плюс автозапуск при изменениях в папке forma/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'forma/**'
      - '.github/workflows/build-forma-windows.yml'

jobs:
  build-exe:
    name: EXE + ZIP (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # без этого кириллица в выводе падает на Windows (cp1251/charmap)
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: bash

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: forma/requirements.txt

      - name: Установить зависимости
        working-directory: forma
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Прогнать тесты ядра
        working-directory: forma
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee tests.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # публикуем имена упавших тестов аннотациями: логи иногда недоступны
            grep -E "^(FAIL|ERROR):" tests.log | while read -r line; do
              echo "::error::$line"
            done
            # и последние строки целиком — если упало не тестом, а падением
            tail -25 tests.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            tail -60 tests.log
          fi
          exit "$rc"

      - name: Подготовить иконку и версию
        working-directory: forma
        run: |
          python tools/make_icon.py
          python tools/write_version_info.py

      - name: Собрать EXE
        working-directory: forma
        run: |
          pyinstaller packaging/forma.spec --noconfirm --clean --distpath dist --workpath build/pyi
          ls -la dist
          python - <<'PY'
          from pathlib import Path
          exe = Path('dist/Forma3D.exe')
          print(f"EXE: {exe.stat().st_size / 1024 / 1024:.1f} МБ")
          PY

      - name: Проверить, что EXE не распух
        working-directory: forma
        run: |
          python - <<'PY'
          from pathlib import Path
          size = Path('dist/Forma3D.exe').stat().st_size / 1024 / 1024
          print(f"EXE: {size:.1f} МБ")
          if size > 60:
              raise SystemExit(
                  f"EXE вырос до {size:.0f} МБ — похоже, в сборку попала лишняя "
                  "библиотека (scipy/skimage/Pillow/networkx). Проверьте "
                  "packaging/forma.spec и requirements.txt."
              )
          PY

      - name: Проверить собранный EXE (самопроверка моделей)
        working-directory: forma
        run: |
          rm -f selftest.txt
          ./dist/Forma3D.exe --selftest --report selftest.txt &
          exe_pid=$!
          for i in $(seq 1 180); do
            if [ -s selftest.txt ]; then break; fi
            if ! kill -0 "$exe_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -s selftest.txt ]; then
            echo "EXE не отчитался о самопроверке за 180 с"
            taskkill //F //IM Forma3D.exe || true
            echo "=== диагностическая сборка с консолью (чтобы видеть ошибку) ==="
            FORMA_CONSOLE=1 pyinstaller packaging/forma.spec --noconfirm --clean \
              --distpath distc --workpath build/pyic 2>&1 | tail -3
            ./distc/Forma3D.exe --selftest 2>&1 | tail -40 || true
            exit 1
          fi
          cat selftest.txt

      - name: Проверить интерфейс внутри EXE (API, 3D-ресурсы, снимки)
        working-directory: forma
        run: |
          rm -f uitest.txt
          ./dist/Forma3D.exe --uistest --report uitest.txt &
          exe_pid=$!
          for i in $(seq 1 240); do
            if [ -s uitest.txt ]; then break; fi
            if ! kill -0 "$exe_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -s uitest.txt ]; then
            echo "EXE не отчитался о проверке интерфейса за 240 с"
            taskkill //F //IM Forma3D.exe || true
            exit 1
          fi
          cat uitest.txt
          grep -q "ИТОГ: всё в порядке" uitest.txt

      - name: Подготовить ZIP с понятным именем
        working-directory: forma
        run: |
          mkdir -p release
          cp dist/Forma3D.exe release/
          cp packaging/README_FIRST.txt release/ЧИТАЙ_МЕНЯ.txt
          cp packaging/icon_256.png release/icon.png
          python - <<'PY'
          from pathlib import Path
          import zipfile, sys
          sys.path.insert(0, '.')
          from forma.agent import command_reference_md
          from forma.version import __version__
          root = Path('release')
          (root / 'СПРАВКА_КОМАНДЫ.md').write_text(command_reference_md(), encoding='utf-8')
          recipes = Path('docs/RECIPES.md')
          if recipes.exists():
              (root / 'РЕЦЕПТЫ.md').write_text(recipes.read_text(encoding='utf-8'), encoding='utf-8')
          examples = Path('release/examples')
          examples.mkdir(exist_ok=True)
          for p in Path('examples').glob('*.forma'):
              (examples / p.name).write_text(p.read_text(encoding='utf-8'), encoding='utf-8')
          zip_path = Path(f'Forma3D-{__version__}-windows.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      zf.write(p, p.relative_to(root))
          print('ZIP:', zip_path, zip_path.stat().st_size, 'байт')
          PY

      - name: Загрузить в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Forma3D-windows
          path: |
            forma/Forma3D-*-windows.zip
            forma/dist/Forma3D.exe
            forma/selftest.txt
            forma/uitest.txt
          if-no-files-found: error
          retention-days: 60

      - name: Опубликовать EXE и ZIP в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forma3d-exe-${{ github.run_number }}-${{ github.run_attempt }}
          name: Форма 3D — Windows EXE (сборка ${{ github.run_number }})
          body: |
            **Форма 3D** — параметрический 3D-редактор, которым управляют текстом.

            * `Forma3D-…-windows.zip` — распакуй и запусти `Forma3D.exe` (рекомендуется).
            * `Forma3D.exe` — то же приложение одним файлом.

            **Что нового в 0.30 — плоскость, рулон, оригами-сгиб и гофрирование**

            * **`sheet` — плоскость как тонкий параллелепипед**, а не висячий полигон: у листа есть толщина, замкнутый объём и объём ровно `длина × ширина × толщина`; 120×200×1.2 → 28 800 мм³;
            * **волнистость** — `step` (шаг волны), `amp` (амплитуда), `wave` = `вдоль` / `поперёк` / `крест` (вафельный лист); сетка кратна волнам, поэтому заявленная амплитуда не срезается;
            * **свёртка в рулон** — `roll` (оборотов) и `gap` (зазор между витками): лист наматывается архимедовой спиралью с точным сохранением длины, ось рулона — по ширине, деталь ложится на пол; невозможные сочетания объясняются словами, что увеличить;
            * **`fold` — оригами-сгиб** — `parts=2` пополам, `parts=3` на треть, до 12 частей гармошкой, `angle` (90…180°), `gap` (просвет между слоями), `axis` и `offset`; сгиб изометрический, длина сохраняется, внутренний радиус `gap/2` — слои не проваливаются друг в друга, поверхность не пересекает себя (объём сохраняется);
            * **`corrugate` — гофрирование готовой детали** — `гофра`, `вафля`, `рифление`, `зигзаг` с шагом, высотой, поворотом узора и осью; по построению не протыкает себя, работает и на листе, и на цилиндре;
            * **`cardboard` — гофрокартон одним телом** — линер, гофра и второй линер булевой операцией: `layer=3` и `layer=2`, настройки `liner`, `flute`, `step`;
            * в «Инструментах» четыре новые карточки с живыми превью; 100…250 трис у плоского листа, рулон из 6 оборотов — около 19 000 трис;
            * 530 автотестов (новые 30 — `tests/test_v030.py`), 153 команды, 85 карточек.

            **Что нового в 0.29 — дисковая пила, честное зеркало, причина «нет модели»**

            * **новый примитив «дисковая пила» `saw`** — плоское полотно с настоящими зубьями по кругу и посадочным отверстием под вал: `diameter`, `thickness`, `teeth`, `tooth`, `shape` (треугольные, трапеция-карбид, крюк, волна), `rake` (передний угол), `gullet` (пазуха), `kerf` (пропил шире полотна), `hole`, `windows` (компенсационные отверстия), `detail`; вершина зуба ложится ровно на заданный диаметр, в «Инструментах» есть карточка с живой миниатюрой;
            * **зеркало показывает отражение в правильном масштабе** — вместо кубической карты план-зеркало: сцена рисуется из отражённой камеры и натягивается на пластину по экранной проекции, поэтому предмет над зеркалом повторяется в том же размере и на своём месте; нормаль пластины направляется к наблюдателю (раньше у повёрнутой детали бралась нижняя грань), то, что лежит под зеркалом, в отражение не попадает;
            * **светится только то, что должно** — ореол строится исключительно по светящимся (`emissive`) материалам, остальные детали в проходе свечения чёрные и не «светятся за компанию»; ползунок «Свечение» по-прежнему задаёт силу;
            * **колесо в превью исправлено** — «от себя» приближает, «на себя» отдаляет, пределы 0.45…3.2;
            * **понятно, почему нет модели** — превью пишет, какой параметр вышел из рамок и какие у него границы (`teeth = 900, а допустимо 4…200`), подсвечивает поле в карточке и показывает блок «Почему нет модели» в окне 3D;
            * **порядок в окнах** — ракурс в шапке «Модели» собран одной капсулой, редкие переключатели (автоповорот, «к предмету», «вокруг выделенного», «заслонки») переехали в панель «вид → Показ» с подписями, дубли «сетка/полигонаж» убраны; шапки панелей растут по высоте вместо обрезки, кнопки не сжимаются, карточки инструментов собраны сеткой «инспектора» (подпись над значением, две колонки), описание — в две строки;
            * 500 автотестов (новые 28 — `tests/test_v029.py`), 149 команд, 81 карточка в «Инструментах».

            **Что нового в 0.28.1 — стрелки у параметров инструментов**

            * у каждого параметра в карточках «Инструментов» и «Приёмов» появились кнопки **▾ / ▴**: число меняется по шагу карточки (с учётом `min`/`max`), а **текстовые значения листаются по кругу** — вид линзы, сторона инь-яна, тип патрона, форма зубьев короны, узор решётки, вид клинка, стиль причёски и экрана, форма зеркала, узор `pattern`, стиль `anime` и ещё 25 параметров с вариантами;
            * у цвета стрелки перебирают палитру, у времени `21:38` — минуту с переходом через час; у пути к картинке и у списка точек стрелок нет (значение свободное);
            * удержание стрелки повторяет шаг, в самом поле работают клавиши **↑ / ↓**; каждый шаг сразу пересобирает живую миниатюру карточки;
            * 472 автотеста (новые 4 проверяют, что каждое подставляемое стрелкой значение действительно строится).

            **Что нового в 0.28.0 — превью в карточках, четыре формы и карандаш**

            * **превью прямо в карточках «Инструментов»** — миниатюра стоит под описанием и пересобирается сама при правке ползунка или галочки; модель по-прежнему **крутится** мышью, колесо приближает, двойной щелчок возвращает вид, ракурс не сбрасывается при пересборке; строятся только видимые карточки (IntersectionObserver), галочка «живые превью» выключает их совсем;
            * **`crown`** — корона/тиара/зубчатый венец: полое кольцо с зазубринами, отдельные настройки зубьев (`teeth`, `tooth`, `tip` — скругление вершин, `shape` — треугольные/скруглённые/волна), `wall` и `rim`; одно цельное тело с одним сквозным отверстием;
            * **`yin_yang`** — знаменитая «запятая» тайцзи настоящей формы (половина круга, похожая на шестёрку), `side=правый` — зеркальная половина; половинки складываются в целый знак при `at=[0,0,thick]`;
            * **`lens`** — линза со сферическими поверхностями: выпуклая, вогнутая, плосковыпуклая, плосковогнутая и мениск; `sag` — прогиб, `edge` — толщина по краю (у вогнутых считается сама), `rim` — шлифованная кромка;
            * **`cartridge`** — патрон: винтовочный (закраина, плечико, острое оживало) и пистолетный (прямая гильза и круглая пуля); длина детали **ровно равна `length`** — 7.62×56 → 56.00 мм, 9×29 → 29.00 мм;
            * **карандашный режим `скетч`** у `anime`: штриховка по тени (`hatch`, `hatch_angle`, `hatch_step`, второй слой поперёк в глубокой тени), зерно бумаги (`paper_tex` — шум и волокна), а `lines` выбирает, где рисовать внутренние линии: по деталям, **по группам** (шов только между сборками) или **по материалам**;
            * новые настройки есть и в окне (панель «вид → Стиль»: чипы `аниме / манга / комикс / скетч / линия`, ползунки штриховки, «зерно», список «Линии»), и на PNG-снимках, и в строке `anime …`;
            * 468 автотестов, 148 команд, 80 карточек в «Инструментах».

            **Что нового в 0.27.0 — видно всё: превью, отражения, свечение**

            * **3D-превью в карточках «Инструментов»** — кнопка «3D» открывает мини-окно: модель можно крутить, вписывать, смотреть каркасом и обновлять по полям карточки, **не добавляя её в сцену**; рядом габарит `Ш×В×Г мм` и число треугольников, кнопка «Добавить в сценарий»;
            * **зеркало отражает соседей** — в окне у зеркальных деталей своя кубическая карта (CubeCamera) и она обновляется при движении камеры; в PNG от зеркального пикселя пускается луч, и в отражении видны соседние предметы, а не только студия;
            * **свечение исправлено** — ореол строится по маске видимости, поэтому больше не «просвечивает» сквозь корпус и стекло; панель `display` с цифрами переехала к стеклу, и цифры LED-часов больше не срезаются стенками ниши;
            * **ползунки честные и сохраняются** — панель «вид» (свет, фон, экспозиция, тени, сетка, пол, оси, полигонаж, сила свечения) пишется в сценарий строкой `scene …`; у `scene` появились `axes`, `poly` и `bloom`; камера больше не сбрасывается при пересборке;
            * **две кнопки уборки** — «очистить сцену» (предметы) и «очистить сценарий» (текст) отдельно, обе отменяются Ctrl+Z;
            * `rotate` / `translate` / `scale` / `place` / `mirror` двигают **составные детали** вместе с корпусом: поворот часов больше не оставляет цифры и стекло на месте;
            * 434 автотеста, 144 команды, 76 карточек в «Инструментах».

            **Что нового в 0.26.0 — аниме и манга: контуры по форме**

            * **`anime`** — подача модели как рисунка: чёрные контуры идут **по форме**, а не обводят только силуэт: силуэт + изломы поверхности (рёбра, складки, фаски) + перепад глубины + стыки деталей (как Line Art в Blender);
            * режимы **`mode=аниме | манга | комикс | линия | выкл`** — цвет со ступенями тона, чёрно-белая манга с растром и заливкой в тени, комикс с толстым контуром и точками, чистый контурный рисунок на бумаге;
            * настройки: `line` (толщина), `color`, `crease` (угол излома), `depth` (порог уступа), `seams` (линия на стыке деталей), `inner` (внутренние линии), `toon` (ступени тона), `tone` (растр), `paper` (цвет бумаги или фон сцены), `shade`;
            * **живое окно**: панель «вид → Стиль» — чипы `обычный / аниме / манга / комикс / линия`, ползунки контура и тона; стиль переключается без пересборки модели;
            * кнопка **«в сценарий»** вставляет строку `anime …` — стиль сохраняется в проекте и попадает на PNG-снимки, zip-выгрузку и в отчёт;
            * контуры в PNG считаются по буферам глубины, нормалей и номеров деталей; светодиоды и другой эмиссив не тонируются — в манге остаются бликом;
            * 419 автотестов, 144 команды, 76 карточек в «Инструментах».

            **Что нового в 0.24.0 — семь фигур-знаков и сердце за секунду**

            * **семь новых примитивов**: `arrow` (стрелка-указатель, с вырезом-оперением `tail`), `tee` (буква Т / тавр), `crescent` (полумесяц, `bite` — радиус выкуса в долях радиуса), `swirl` (завиток-наплыв со спиральной канавкой — «мягкое мороженое»), `lightning` (молния классического силуэта), `banana` (банан / бровь / стручок — дуга с утолщением), `yoke` (буква Y / рогатка);
            * у каждой фигуры **габарит совпадает с параметром** даже после скругления `round`: после сглаживания деталь масштабируется в точный размер (проверено тестами);
            * **`stand=да`** ставит плоский знак вертикально, как табличку — сразу на пол, толщиной в глубину;
            * **сердце в 3 раза быстрее**: `round` у `heart` переписан на сжатие контура + шар, 3.7 с → 1.1 с, 3 366 трис вместо 121 328;
            * категория «Знаки и фигуры» в «Инструментах»: 7 новых карточек с полями;
            * 364 автотеста, `--uistest`, `--selftest` — зелёные.

            **Что нового в 0.23.0 — сварка объёмов, светящиеся цифры и новые формы**

            * **`fuse` — сварка объёмов**: `fuse [a, b] radius=8` сливает детали в одно тело и скругляет вогнутые рёбра — на стыке больше нет резкого шва, модели перестают выглядеть «приставленными друг к другу»; `edges=все` сглаживает и внешние рёбра; 0.15 с на деталь, топология не меняется, тело остаётся замкнутым;
            * **свечение**: `material=led|neon|lamp` или `emissive=#RRGGBB emissive_strength=4`; в окне сам включается bloom (EffectComposer + UnrealBloomPass), в PNG-снимках — ореол, в GLB — `KHR_materials_emissive_strength`;
            * **прозрачность**: `material=glass|screen` или `transmission=0.7` — `KHR_materials_transmission` в GLB, настоящее смешивание в отчётах, `MeshPhysicalMaterial` в окне; в панели материала три новых ползунка;
            * **новые фигуры**: `heart` (настоящая кривая сердца), `plus` (перекрестие), `sector` (сектор шара с любым углом — от дольки до полусферы), `spiral` (плоская улитка), `rope` (кручёная верёвка из винтовых нитей), `seven_seg` (семисегментные цифры);
            * **новый пример `clock_led.forma`** — настольные часы с горящим циферблатом: сварной корпус, ниша, экран, стекло, LED-цифры 21:38; 6 проверок, все зелёные;
            * три новых приёма в «Инструментах» (всего 26 карточек фигур и приёмов);
            * 340 автотестов, `--uistest`, `--selftest` — зелёные.

            **Что нового в 0.22.0 — настоящее яйцо, капля, крупа в тарелке и горка**

            * **яйцо переделано**: низ — четверть эллипса, верх — кривая Безье, без шипа; самая широкая точка на 45 % высоты, H/⌀ = 1.43, `proportion` 0…1 и `sharp=верх|низ`;
