name: Собрать Windows EXE — Форма 3D

# Ручной запуск: Actions -> "Собрать Windows EXE — Форма 3D" -> Run workflow.
# Плюс автозапуск при изменениях в папке forma/.
on:
  workflow_dispatch:
  push:
    paths:
      - 'forma/**'
      - '.github/workflows/build-forma-windows.yml'

jobs:
  build-exe:
    name: EXE + ZIP (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # без этого кириллица в выводе падает на Windows (cp1251/charmap)
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    defaults:
      run:
        shell: bash

    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          # Нужны прежние release-теги для ZIP только с изменёнными файлами.
          fetch-depth: 0

      - name: Установить Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: forma/requirements.txt

      - name: Установить зависимости
        working-directory: forma
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Прогнать тесты ядра
        working-directory: forma
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee tests.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            # публикуем имена упавших тестов аннотациями: логи иногда недоступны
            grep -E "^(FAIL|ERROR):" tests.log | while read -r line; do
              echo "::error::$line"
            done
            # и последние строки целиком — если упало не тестом, а падением
            tail -25 tests.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            tail -60 tests.log
          fi
          exit "$rc"

      - name: Проверить JS-регрессии редактора
        working-directory: forma
        run: |
          node --check web/js/app.js
          node --check web/js/viewer.js
          node tests/editor_regression_test.js
          node tests/occluders_test.js
          node tests/ui_bounds_test.js
          node tests/interior_tools_test.js
          node tests/primitive_cards_test.js
          node tests/line_render_test.js

      - name: Проверить и экспортировать оригинальный параметрический скелет
        working-directory: forma
        run: |
          python tools/build_skeleton_original.py

      - name: Экспортировать модели 0.53–0.58 в GLB и Forma
        working-directory: forma
        run: |
          python - <<'PY'
          from pathlib import Path
          from forma.run import build
          from forma.version import __version__
          output = Path('release/models')
          output.mkdir(parents=True, exist_ok=True)
          for stem, suffix in (('thinkpad_x1', 'thinkpad-x1'),
                               ('architecture_selectable_055', 'architecture'),
                               ('architecture_selectable_055_preview', 'architecture-preview'),
                               ('handle_rosettes_055', 'handles-rosettes'),
                               ('selection_details_055', 'selection-details'),
                               ('fittings_053', 'fittings'),
                               ('glyphs_expansion_053', 'glyphs-expansion'),
                               ('smooth_transitions_054', 'smooth-transitions'),
                               ('smooth_transitions_054_preview', 'smooth-transitions-preview'),
                               ('057/track_holes', 'track-holes'),
                               ('057/lightning', 'lightning'),
                               ('057/bicycle_chain', 'bicycle-chain'),
                               ('057/jar', 'jar'),
                               ('057/bottle', 'bottle'),
                               ('057/lids', 'lids'),
                               ('057/switch', 'switch'),
                               ('058/bottle_styles', 'bottle-styles'),
                               ('058/petaloid_bottom', 'petaloid-bottom'),
                               ('058/jar_styles', 'jar-styles'),
                               ('living_room_diorama', 'living-room'),
                               ('train_carriage', 'train-carriage')):
              source_dir = Path('examples') if stem in (
                  'thinkpad_x1', 'living_room_diorama', 'train_carriage') else Path('showcase/sources')
              source = source_dir / f'{stem}.forma'
              script = source.read_text(encoding='utf-8')
              result = build(script, analyze_model=False)
              if not result.ok:
                  raise SystemExit(f'{stem}: {result.error}')
              base = output / f'Forma3D-{__version__}-{suffix}'
              Path(str(base) + '.glb').write_bytes(result.glb())
              Path(str(base) + '.forma').write_text(script, encoding='utf-8')
              print(base, len(result.visible_solids()), 'objects')
          PY

      - name: Подготовить иконку и версию
        working-directory: forma
        run: |
          python tools/make_icon.py
          python tools/write_version_info.py

      - name: Собрать EXE
        working-directory: forma
        run: |
          pyinstaller packaging/forma.spec --noconfirm --clean --distpath dist --workpath build/pyi
          ls -la dist
          python - <<'PY'
          from pathlib import Path
          exe = Path('dist/Forma3D.exe')
          print(f"EXE: {exe.stat().st_size / 1024 / 1024:.1f} МБ")
          PY

      - name: Проверить, что EXE не распух
        working-directory: forma
        run: |
          python - <<'PY'
          from pathlib import Path
          size = Path('dist/Forma3D.exe').stat().st_size / 1024 / 1024
          print(f"EXE: {size:.1f} МБ")
          if size > 60:
              raise SystemExit(
                  f"EXE вырос до {size:.0f} МБ — похоже, в сборку попала лишняя "
                  "библиотека (scipy/skimage/Pillow/networkx). Проверьте "
                  "packaging/forma.spec и requirements.txt."
              )
          PY

      - name: Проверить собранный EXE (самопроверка моделей)
        working-directory: forma
        run: |
          rm -f selftest.txt
          ./dist/Forma3D.exe --selftest --report selftest.txt &
          exe_pid=$!
          for i in $(seq 1 180); do
            if [ -s selftest.txt ]; then break; fi
            if ! kill -0 "$exe_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -s selftest.txt ]; then
            echo "EXE не отчитался о самопроверке за 180 с"
            taskkill //F //IM Forma3D.exe || true
            echo "=== диагностическая сборка с консолью (чтобы видеть ошибку) ==="
            FORMA_CONSOLE=1 pyinstaller packaging/forma.spec --noconfirm --clean \
              --distpath distc --workpath build/pyic 2>&1 | tail -3
            ./distc/Forma3D.exe --selftest 2>&1 | tail -40 || true
            exit 1
          fi
          cat selftest.txt

      - name: Проверить интерфейс внутри EXE (API, 3D-ресурсы, снимки)
        working-directory: forma
        run: |
          rm -f uitest.txt
          ./dist/Forma3D.exe --uistest --report uitest.txt &
          exe_pid=$!
          for i in $(seq 1 240); do
            if [ -s uitest.txt ]; then break; fi
            if ! kill -0 "$exe_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -s uitest.txt ]; then
            echo "EXE не отчитался о проверке интерфейса за 240 с"
            taskkill //F //IM Forma3D.exe || true
            exit 1
          fi
          cat uitest.txt
          grep -q "ИТОГ: всё в порядке" uitest.txt

      - name: Подготовить ZIP с понятным именем
        working-directory: forma
        run: |
          mkdir -p release
          cp dist/Forma3D.exe release/
          cp packaging/README_FIRST.txt release/ЧИТАЙ_МЕНЯ.txt
          cp packaging/icon_256.png release/icon.png
          cp examples/assets/human_skeleton.LICENSE.txt release/ЛИЦЕНЗИЯ_СКЕЛЕТ.txt
          cp docs/human_skeleton_original.md release/ОРИГИНАЛЬНЫЙ_СКЕЛЕТ.md
          cp examples/assets/human_skeleton_original.audit.json release/АУДИТ_ОРИГИНАЛЬНОГО_СКЕЛЕТА.json
          python - <<'PY'
          from pathlib import Path
          import zipfile, sys
          sys.path.insert(0, '.')
          from forma.agent import command_reference_md
          from forma.instruction import full_instruction, commands_catalog
          from forma.version import __version__
          root = Path('release')
          (root / 'СПРАВКА_КОМАНДЫ.md').write_text(command_reference_md(), encoding='utf-8')
          (root / 'ИНСТРУКЦИЯ_ДЛЯ_НЕЙРОСЕТИ.md').write_text(full_instruction(), encoding='utf-8')
          (root / 'ВСЕ_КОМАНДЫ.md').write_text(commands_catalog(), encoding='utf-8')
          recipes = Path('docs/RECIPES.md')
          if recipes.exists():
              (root / 'РЕЦЕПТЫ.md').write_text(recipes.read_text(encoding='utf-8'), encoding='utf-8')
          examples = Path('release/examples')
          examples.mkdir(exist_ok=True)
          for p in Path('examples').glob('*.forma'):
              (examples / p.name).write_text(p.read_text(encoding='utf-8'), encoding='utf-8')
          zip_path = Path(f'Forma3D-{__version__}-windows.zip')
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      zf.write(p, p.relative_to(root))
          print('ZIP:', zip_path, zip_path.stat().st_size, 'байт')
          exe_path = Path('dist/Forma3D.exe')
          exe_zip = Path(f'Forma3D-{__version__}-exe.zip')
          with zipfile.ZipFile(exe_zip, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              zf.write(exe_path, 'Forma3D.exe')
          with zipfile.ZipFile(exe_zip) as zf:
              assert zf.namelist() == ['Forma3D.exe'], zf.namelist()
              assert zf.testzip() is None
              assert zf.read('Forma3D.exe') == exe_path.read_bytes()
          print('EXE-only ZIP:', exe_zip, exe_zip.stat().st_size, 'байт; только Forma3D.exe')
          PY

      - name: Подготовить ZIP только с изменёнными файлами
        id: update-zip
        # Дополнительный source-only архив не должен блокировать публикацию
        # уже протестированного EXE. Ошибка останется видна предупреждением
        # шага; обязательные тесты и проверки бинарника выше не ослабляются.
        continue-on-error: true
        working-directory: forma
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Старые release-теги могли указывать на main. Точная база — SHA
          # предыдущего успешного запуска этого workflow на той же ветке.
          base=""
          while IFS= read -r run_sha; do
            if [ -n "$run_sha" ] && [ "$run_sha" != "$GITHUB_SHA" ]; then
              base="$run_sha"
              break
            fi
          done < <(gh run list --workflow build-forma-windows.yml \
            --branch "$GITHUB_REF_NAME" --limit 30 \
            --json headSha,status,conclusion \
            --jq '.[] | select(.status == "completed" and .conclusion == "success") | .headSha')
          if [ -z "$base" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git mktree </dev/null)"
          fi
          version="$(python -c 'from forma.version import __version__; print(__version__)')"
          short_base="${base:0:12}"
          echo "Delta base: $base"
          python tools/build_update_zip.py --base "$base" --head HEAD \
            --output "Forma3D-${version}-update-from-${short_base}.zip"

      - name: Загрузить в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Forma3D-windows
          path: |
            forma/Forma3D-*-windows.zip
            forma/Forma3D-*-exe.zip
            forma/dist/Forma3D.exe
            forma/examples/assets/human_skeleton.glb
            forma/examples/assets/human_skeleton.LICENSE.txt
            forma/examples/assets/human_skeleton_original.glb
            forma/examples/assets/human_skeleton_original.audit.json
            forma/release/models/*.glb
            forma/release/models/*.forma
            forma/selftest.txt
            forma/uitest.txt
          if-no-files-found: error
          retention-days: 60

      - name: Загрузить необязательный source-delta в Artifacts
        if: steps.update-zip.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Forma3D-source-delta
          path: forma/Forma3D-*-update-from-*.zip
          if-no-files-found: error
          retention-days: 60

      - name: Опубликовать EXE и ZIP в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forma3d-exe-${{ github.run_number }}-${{ github.run_attempt }}
          name: Форма 3D — Windows EXE (сборка ${{ github.run_number }})
          body_path: .github/forma-release-notes.md
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            forma/Forma3D-*-windows.zip
            forma/Forma3D-*-exe.zip
            forma/dist/Forma3D.exe
            forma/examples/assets/human_skeleton.glb
            forma/examples/assets/human_skeleton.LICENSE.txt
            forma/examples/assets/human_skeleton_original.glb
            forma/examples/assets/human_skeleton_original.audit.json
            forma/release/models/*.glb
            forma/release/models/*.forma

      - name: Прикрепить необязательный source-delta к релизу
        if: steps.update-zip.outcome == 'success'
        working-directory: forma
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "forma3d-exe-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            Forma3D-*-update-from-*.zip --clobber
