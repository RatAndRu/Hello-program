name: Собрать Android APK — ЗакрепФото

# Ручной запуск: Actions -> "Собрать Android APK — ЗакрепФото" -> Run workflow.
# Плюс автозапуск при изменениях Android/PWA-части на этой ветке.
on:
  workflow_dispatch:
  push:
    paths:
      - 'pinphotos/**'
      - '.github/workflows/build-pinphotos-android.yml'

jobs:
  build-apk:
    name: Debug APK (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK (API 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Подготовить постоянный ключ подписи (если секрет задан)
        env:
          PINPHOTOS_KEYSTORE_BASE64: ${{ secrets.PINPHOTOS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PINPHOTOS_KEYSTORE_BASE64" ]; then
            echo "$PINPHOTOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pinphotos-release.p12"
            echo "PINPHOTOS_KEYSTORE_FILE=$RUNNER_TEMP/pinphotos-release.p12" >> "$GITHUB_ENV"
            echo "Постоянная подпись: включена"
          else
            echo "Постоянная подпись: секрет не задан, будет временная debug-подпись"
          fi

      - name: Собрать APK
        working-directory: pinphotos/android-widget
        env:
          PINPHOTOS_STORE_PASSWORD: ${{ secrets.PINPHOTOS_STORE_PASSWORD }}
          PINPHOTOS_KEY_PASSWORD: ${{ secrets.PINPHOTOS_KEY_PASSWORD }}
          PINPHOTOS_KEY_ALIAS: ${{ secrets.PINPHOTOS_KEY_ALIAS }}
        run: |
          set +e
          if [ -n "$PINPHOTOS_KEYSTORE_FILE" ]; then
            gradle assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/pinphotos-gradle.log"
          else
            gradle assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/pinphotos-gradle.log"
          fi
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo '### Ошибки сборки PinPhotos'
              echo '```text'
              grep -E '^(e: |.*error:|.*FAILED|.*Exception)' "$RUNNER_TEMP/pinphotos-gradle.log" | head -80 | while IFS= read -r line; do echo "::error::$line"; done || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"

      - name: Загрузить готовый APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinphotos-debug-apk
          path: pinphotos/android-widget/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # Главное для человека: тот же APK кладём в GitHub Releases,
      # где он виден сразу и скачивается одним кликом без ZIP-обёртки.
      - name: Подготовить APK с понятным именем
        run: |
          if [ -f pinphotos/android-widget/app/build/outputs/apk/release/app-release.apk ]; then
            cp pinphotos/android-widget/app/build/outputs/apk/release/app-release.apk PinPhotos-debug.apk
          else
            cp pinphotos/android-widget/app/build/outputs/apk/debug/app-debug.apk PinPhotos-debug.apk
          fi

      - name: Опубликовать APK в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pinphotos-apk-${{ github.run_number }}-${{ github.run_attempt }}
          name: ЗакрепФото — APK (сборка ${{ github.run_number }})
          body: Debug APK приложения «ЗакрепФото» (одно приложение + виджет 3×2). Скачай файл PinPhotos-debug.apk ниже и установи на телефон.
          prerelease: true
          fail_on_unmatched_files: true
          files: PinPhotos-debug.apk
