name: Deploy to fly.io

on:
  push:
    branches: [arena/805d166e-hello-program]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0.5
        options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check FLY_API_TOKEN
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "SECRET_MISSING"
            exit 1
          fi
          echo "SECRET_SET"

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh -s -- -y
          export PATH="$HOME/.fly/bin:$PATH"
          fly version

      - name: Configure flyctl token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          mkdir -p "$HOME/.fly"
          echo "api_token = \"$FLY_API_TOKEN\"" > "$HOME/.fly/config.yml"
          cat "$HOME/.fly/config.yml"

      - name: Show app config
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          echo "=== fly.toml ==="
          cat recipe/fly.toml
          echo "=== Dockerfile ==="
          cat recipe/Dockerfile

      - name: Create app (ignore if exists)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          fly apps create bliny-kefir-ratandru 2>&1 || true

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          cd recipe
          flyctl deploy --app bliny-kefir-ratandru --verbose
