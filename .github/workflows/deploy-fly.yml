name: Deploy to fly.io

on:
  push:
    branches: [arena/805d166e-hello-program]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh -s -- -y
          export PATH="$HOME/.fly/bin:$PATH"
          fly version

      - name: Deploy to fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          cd recipe
          flyctl deploy --remote-only --app bliny-kefir-ratandru --verbose
