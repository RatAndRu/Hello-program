name: Deploy Forma online

on:
  push:
    branches:
      - arena/4e4defc4-hello-program
    paths:
      - 'forma/**'
      - 'fly.toml'
      - '.dockerignore'
      - '.github/workflows/deploy-forma-online.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forma-online-production
  cancel-in-progress: false

env:
  FLY_APP_NAME: forma3d-ratandru

jobs:
  verify:
    name: Tests and static production container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: forma/requirements.txt

      - name: Install dependencies
        run: pip install -r forma/requirements.txt Pillow

      - name: Focused regression
        env:
          PYTHONPATH: forma:forma/tests
        run: python -m unittest -v test_showcase test_photo_saddle_bracket test_train_carriage test_living_room_052

      - name: Build static production image
        run: docker build --build-arg "FORMA_REVISION=$GITHUB_SHA" -t "forma3d-showcase:$GITHUB_SHA" -f forma/showcase/Dockerfile .

      - name: Start production container
        run: docker run -d --name forma-showcase -p 8000:8000 "forma3d-showcase:$GITHUB_SHA"

      - name: Wait for production health
        run: |
          set -e
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz > /tmp/forma-health.json; then
              if grep -q "$GITHUB_SHA" /tmp/forma-health.json; then
                cat /tmp/forma-health.json
                exit 0
              fi
            fi
            sleep 2
          done
          echo '::error::Static production container did not become healthy.'
          cat /tmp/forma-health.json 2>/dev/null || true
          exit 1

      - name: Verify static assets, GLB structure and disabled API
        run: python forma/showcase/acceptance.py --base http://127.0.0.1:8000 --revision "$GITHUB_SHA"

      - name: Container logs on failure
        if: failure()
        run: docker logs forma-showcase

      - name: Stop container
        if: always()
        run: docker rm -f forma-showcase || true

  deploy:
    name: Fly.io always-on static showcase
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo '::error::Добавьте FLY_API_TOKEN в Settings → Secrets and variables → Actions. Токен в логи и чат не выводим.'
            exit 1
          fi

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure Fly application
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          flyctl apps list 2>&1 | tee /tmp/forma-fly-app.log
          if ! awk 'NR > 1 {print $1}' /tmp/forma-fly-app.log | grep -Fxq "$FLY_APP_NAME"; then
            flyctl apps create "$FLY_APP_NAME" --org "${FLY_ORG:-personal}" 2>&1 | tee -a /tmp/forma-fly-app.log
            flyctl apps list 2>&1 | tee -a /tmp/forma-fly-app.log
          fi
          awk 'NR > 1 {print $1}' /tmp/forma-fly-app.log | grep -Fxq "$FLY_APP_NAME"

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -o pipefail
          # PyPI иногда отдаёт повреждённое колесо: pip справедливо падает на
          # проверке SHA-256 из simple-index. Не отключаем проверку, а делаем
          # новую сборку; pip в Dockerfile использует --no-cache-dir.
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3"
            if flyctl deploy --app "$FLY_APP_NAME" --local-only --build-arg "FORMA_REVISION=$GITHUB_SHA" 2>&1 | tee -a /tmp/forma-fly-deploy.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Keep exactly one showcase machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -o pipefail
          flyctl scale count 1 --app "$FLY_APP_NAME" --yes 2>&1 | tee -a /tmp/forma-fly-deploy.log

      - name: Verify public revision
        run: |
          set -e
          for attempt in $(seq 1 18); do
            if curl -fsS "https://$FLY_APP_NAME.fly.dev/healthz?revision=$GITHUB_SHA" > /tmp/forma-public-health.json \
                && grep -q "$GITHUB_SHA" /tmp/forma-public-health.json; then
              cat /tmp/forma-public-health.json
              exit 0
            fi
            sleep 10
          done
          echo '::error::Публичный health-check не подтвердил новый revision статического стенда.'
          cat /tmp/forma-public-health.json 2>/dev/null || true
          exit 1

      - name: External public acceptance
        run: |
          set -o pipefail
          # После rolling deploy отдельное соединение к большому GLB может быть
          # разорвано proxy. Проверку не ослабляем: повторяем её целиком, а
          # постоянное расхождение SHA/GLB/revision по-прежнему даёт failure.
          for attempt in 1 2 3; do
            echo "External acceptance attempt ${attempt}/3"
            if python forma/showcase/acceptance.py --base "https://$FLY_APP_NAME.fly.dev" --revision "$GITHUB_SHA" --allow-proxy-decode 2>&1 | tee /tmp/forma-public-acceptance.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Report sanitized deployment error
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          paths = [
              Path('/tmp/forma-fly-app.log'),
              Path('/tmp/forma-fly-deploy.log'),
              Path('/tmp/forma-public-acceptance.log'),
          ]
          text = '\n'.join(path.read_text(encoding='utf-8', errors='replace')
                            for path in paths if path.exists()) or 'Нет журнала деплоя.'
          text = re.sub(r'FlyV1\s+\S+', '[REDACTED FLY TOKEN]', text)
          text = re.sub(r'fm2_[A-Za-z0-9_.-]+', '[REDACTED FLY TOKEN]', text)
          text = re.sub(r'([?&]token=)[^&\s]+', r'\1[REDACTED]', text)
          text = re.sub(r'(?i)(authorization:\s*bearer\s+)\S+', r'\1[REDACTED]', text)
          tail = '\n'.join(text.splitlines()[-40:])
          message = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error::Deployment: ' + message)
          PY
