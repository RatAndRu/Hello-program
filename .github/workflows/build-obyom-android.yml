name: Собрать Android APK — Объём (3D-сканер)
on:
  workflow_dispatch:
  push:
    paths:
      - 'obyom/**'
      - '.github/workflows/build-obyom-android.yml'
jobs:
  tests:
    name: Проверки (без сцен)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Градиенты сплэтов, потоки, ZIP, сдвиг вершин, плоские грани
        working-directory: obyom/tests
        run: |
          node --stack-size=200 gradcheck.mjs
          node --stack-size=200 tpool.mjs
          node --stack-size=200 tunit.mjs
  build-apk:
    name: APK (Android)
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Подготовить постоянный ключ подписи
        env:
          OBYOM_KEYSTORE_BASE64: ${{ secrets.OBYOM_KEYSTORE_BASE64 }}
          PINPHOTOS_KEYSTORE_BASE64: ${{ secrets.PINPHOTOS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$OBYOM_KEYSTORE_BASE64" ]; then
            echo "$OBYOM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/obyom-release.p12"
            echo "OBYOM_KEYSTORE_FILE=$RUNNER_TEMP/obyom-release.p12" >> "$GITHUB_ENV"
            echo "Постоянная подпись Объём: отдельный ключ"
          elif [ -n "$PINPHOTOS_KEYSTORE_BASE64" ]; then
            echo "$PINPHOTOS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/obyom-release.p12"
            echo "OBYOM_KEYSTORE_FILE=$RUNNER_TEMP/obyom-release.p12" >> "$GITHUB_ENV"
            echo "PINPHOTOS_KEYSTORE_FILE=$RUNNER_TEMP/obyom-release.p12" >> "$GITHUB_ENV"
            echo "Постоянная подпись Объём: общий издательский ключ репозитория"
          else
            echo "Постоянная подпись не задана: будет debug-подпись"
          fi
      - name: Собрать APK
        working-directory: obyom/android
        env:
          OBYOM_STORE_PASSWORD: ${{ secrets.OBYOM_STORE_PASSWORD }}
          OBYOM_KEY_PASSWORD: ${{ secrets.OBYOM_KEY_PASSWORD }}
          OBYOM_KEY_ALIAS: ${{ secrets.OBYOM_KEY_ALIAS }}
          PINPHOTOS_STORE_PASSWORD: ${{ secrets.PINPHOTOS_STORE_PASSWORD }}
          PINPHOTOS_KEY_PASSWORD: ${{ secrets.PINPHOTOS_KEY_PASSWORD }}
          PINPHOTOS_KEY_ALIAS: ${{ secrets.PINPHOTOS_KEY_ALIAS }}
        run: |
          set +e
          if [ -n "$OBYOM_KEYSTORE_FILE" ]; then gradle assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/obyom-build.log"; else gradle assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/obyom-build.log"; fi
          code=${PIPESTATUS[0]}
          { echo '## Объём build log (tail)'; echo '```text'; tail -n 220 "$RUNNER_TEMP/obyom-build.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then grep -E '^(e: |FAILED|FAILURE:|.*error:|.*Error:|Execution failed|Caused by:)' "$RUNNER_TEMP/obyom-build.log" | head -n 30 | tr -d '\r' | while IFS= read -r line; do echo "::error title=ObyomBuild::$line"; done; fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: obyom-android-apk
          path: obyom/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Подготовить APK с понятным именем
        run: |
          if [ -f obyom/android/app/build/outputs/apk/release/app-release.apk ]; then cp obyom/android/app/build/outputs/apk/release/app-release.apk Obyom.apk; else cp obyom/android/app/build/outputs/apk/debug/app-debug.apk Obyom.apk; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: obyom-apk-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Объём — APK (сборка ${{ github.run_number }})
          body: 3D-сканер небольших предметов (полигоны и сплэты) без нейросетей. Скачай Obyom.apk и установи на телефон. Для обновлений поверх не меняй ключ подписи после первой установки.
          prerelease: true
          fail_on_unmatched_files: true
          files: Obyom.apk
