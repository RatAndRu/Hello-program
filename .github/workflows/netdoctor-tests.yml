name: NET DOCTOR — самотесты

# Автопроверка диагностического инструмента: синтаксис + 40 встроенных тестов.
# Тесты должны проходить и без установленной библиотеки qrcode (она необязательна).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: Диагностика сети (net doctor)
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Синтаксис
        working-directory: netdiagn
        run: python -m py_compile net_doctor.py

      - name: Самотесты (без необязательных библиотек)
        working-directory: netdiagn
        run: python net_doctor.py --selftest --no-color

      - name: Самотесты с QR-кодом (необязательная зависимость)
        working-directory: netdiagn
        run: |
          python -m pip install --quiet qrcode
          python net_doctor.py --selftest --no-color

      - name: Проверка «холодного» запуска без сервера
        working-directory: netdiagn
        # Коды возврата инструмента: 0 — проблем нет, 2 — проблемы найдены,
        # 1 — внутренняя ошибка. На «чужой» машине без локальной сети код 2 — это
        # нормальный результат диагностики, а вот код 1 пропускать нельзя.
        run: |
          set +e
          python net_doctor.py --no-server --wait 0 --no-color --report /tmp/report.txt
          rc=$?
          set -e
          echo "код возврата: $rc"
          if [ "$rc" -eq 1 ]; then echo "внутренняя ошибка инструмента"; exit 1; fi
          test -s /tmp/report.txt
          echo "отчёт создан, строк: $(wc -l < /tmp/report.txt)"
          head -5 /tmp/report.txt
