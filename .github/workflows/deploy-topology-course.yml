name: Deploy topology course site

# Публикует forma/topology-course/index.html на Fly.io отдельным приложением.
# Секрет FLY_API_TOKEN тот же, что у deploy-forma-online.yml (Settings → Secrets).
on:
  push:
    branches:
      - arena/4e8fdd4f-hello-program
    paths:
      - 'forma/topology-course/**'
      - '.github/workflows/deploy-topology-course.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-course-site
  cancel-in-progress: true

env:
  FLY_APP_NAME: topology-course-ratandru
  SITE_DIR: forma/topology-course

jobs:
  check:
    name: Сборка страницы и проверки
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Пересобрать index.html и проверить целостность
        run: |
          set -euo pipefail
          python "$SITE_DIR/build.py" --check

      - name: Образ собирается и отдаёт страницу
        run: |
          set -euo pipefail
          docker build -t topology-course:ci -f "$SITE_DIR/deploy/Dockerfile" "$SITE_DIR"
          docker run -d --name topology-ci -p 8081:80 topology-course:ci
          code=000
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o /tmp/ci.html -w '%{http_code}' http://127.0.0.1:8081/ || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 1
          done
          size=$(wc -c < /tmp/ci.html 2>/dev/null || echo 0)
          echo "HTTP $code, ${size} байт"
          head -c 400 /tmp/ci.html || true
          echo
          if [ "$code" != "200" ] || [ "$size" -lt 100000 ]; then
            docker logs topology-ci || true
            echo "::error::Контейнер не отдал собранную страницу (HTTP $code, ${size} байт)"
            exit 1
          fi
          grep -q "Топология тел" /tmp/ci.html || { echo "::error::В ответе нет заголовка курса"; exit 1; }
          echo "Контейнер отдаёт страницу: ${size} байт"

      - name: Убрать тестовый контейнер
        if: always()
        run: docker rm -f topology-ci || true

      - name: Собранный файл не отличается от закоммиченного
        run: |
          set -euo pipefail
          cp "$SITE_DIR/index.html" /tmp/before.html
          python "$SITE_DIR/build.py"
          if ! cmp -s /tmp/before.html "$SITE_DIR/index.html"; then
            echo '::error::index.html устарел: запустите python forma/topology-course/build.py и закоммитьте результат.'
            exit 1
          fi

  deploy:
    name: Fly.io
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo '::error::Добавьте FLY_API_TOKEN в Settings → Secrets and variables → Actions. Токен в логи и чат не выводим.'
            exit 1
          fi

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure Fly application
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          set -euo pipefail
          flyctl apps list 2>&1 | tee /tmp/topo-fly-app.log
          if ! awk 'NR > 1 {print $1}' /tmp/topo-fly-app.log | grep -Fxq "$FLY_APP_NAME"; then
            flyctl apps create "$FLY_APP_NAME" --org "${FLY_ORG:-personal}" 2>&1 | tee -a /tmp/topo-fly-app.log
            flyctl apps list 2>&1 | tee -a /tmp/topo-fly-app.log
          fi
          awk 'NR > 1 {print $1}' /tmp/topo-fly-app.log | grep -Fxq "$FLY_APP_NAME"

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Deploy attempt ${attempt}/3"
            if flyctl deploy "$SITE_DIR" \
                 --config "$PWD/$SITE_DIR/fly.toml" \
                 --app "$FLY_APP_NAME" \
                 --local-only 2>&1 | tee -a /tmp/topo-fly-deploy.log; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Показать лог деплоя при ошибке
        if: failure()
        run: |
          if [ -f /tmp/topo-fly-deploy.log ]; then
            tail -n 25 /tmp/topo-fly-deploy.log | while IFS= read -r line; do
              echo "::error title=flyctl::$line"
            done
          else
            echo '::error title=flyctl::лог деплоя не создан'
          fi

      - name: Verify public site
        run: |
          set -euo pipefail
          url="https://${FLY_APP_NAME}.fly.dev/"
          status=000
          for attempt in $(seq 1 60); do
            status=$(curl -sS -o /tmp/site.html -w '%{http_code}' --max-time 15 "$url" || true)
            size=$(wc -c < /tmp/site.html 2>/dev/null || echo 0)
            echo "attempt ${attempt}: HTTP ${status}, ${size} байт"
            if [ "$status" = "200" ] && [ "$size" -gt 100000 ] && grep -q "Топология тел" /tmp/site.html; then
              echo "Сайт доступен: $url (${size} байт)"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=flyctl::Сайт не ответил ожидаемым содержимым: $url"
          exit 1

      - name: Диагностика при сбое проверки
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app "$FLY_APP_NAME" || true
          flyctl machines list --app "$FLY_APP_NAME" || true
          flyctl logs --app "$FLY_APP_NAME" --no-tail || true
