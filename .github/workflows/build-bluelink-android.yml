name: Собрать Android APK — BlueLink

# Ручной запуск: Actions -> "Собрать Android APK — BlueLink" -> Run workflow.
# Плюс автозапуск при изменениях приложения BlueLink.
on:
  workflow_dispatch:
  push:
    paths:
      - 'bluelink/**'
      - '.github/workflows/build-bluelink-android.yml'

jobs:
  build-apk:
    name: APK (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Android SDK (API 34)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Установить Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Подпись: по умолчанию используется постоянный ключ из репозитория
      # (bluelink/android/bluelink-dev.p12). Если задан секрет BLUELINK_KEYSTORE_BASE64,
      # он имеет приоритет. Главное — подпись больше не меняется от сборки к сборке.
      - name: Подготовить ключ подписи из секрета (если задан)
        env:
          BLUELINK_KEYSTORE_BASE64: ${{ secrets.BLUELINK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BLUELINK_KEYSTORE_BASE64" ]; then
            echo "$BLUELINK_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bluelink-release.p12"
            echo "BLUELINK_KEYSTORE_FILE=$RUNNER_TEMP/bluelink-release.p12" >> "$GITHUB_ENV"
            echo "Подпись: ключ из секрета"
          else
            echo "Подпись: постоянный ключ из репозитория (bluelink-dev.p12)"
          fi

      - name: Собрать APK
        working-directory: bluelink/android
        env:
          BLUELINK_STORE_PASSWORD: ${{ secrets.BLUELINK_STORE_PASSWORD }}
          BLUELINK_KEY_PASSWORD: ${{ secrets.BLUELINK_KEY_PASSWORD }}
          BLUELINK_KEY_ALIAS: ${{ secrets.BLUELINK_KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee /tmp/gradle.log

      # Отпечаток постоянного ключа. Если он изменится, Android перестанет ставить
      # обновления поверх установленной версии — поэтому сборка падает сразу.
      - name: Проверить подпись APK
        run: |
          APK=bluelink/android/app/build/outputs/apk/release/app-release.apk
          EXPECTED="94:59:A5:7F:EA:9E:41:D0:C8:7E:B9:02:FB:DF:AB:6E:AF:63:17:B2:9F:1A:35:55:3F:8A:F0:C9:25:33:1B:A9"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -5
          ACTUAL_RAW=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" \
            | sed -n 's/.*SHA-256 digest: //p' | head -1)
          ACTUAL=$(echo "$ACTUAL_RAW" | tr -d ':' | tr 'a-f' 'A-F')
          echo "Отпечаток: $ACTUAL_RAW"
          if [ -n "$BLUELINK_KEYSTORE_FILE" ]; then
            echo "Используется ключ из секрета — сверка с эталоном пропущена"
          elif [ "$ACTUAL" != "$(echo "$EXPECTED" | tr -d ':')" ]; then
            echo "::error::Отпечаток подписи изменился — обновление APK сломается"
            exit 1
          else
            echo "Подпись постоянная: обновления установятся поверх старой версии"
          fi

      - name: Лог при ошибке (временный)
        if: failure()
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs bluelink/android/app/build/outputs/apk/release/app-release.apk > /tmp/sig.txt 2>&1 || true
          cd "$RUNNER_TEMP" && mkdir -p logrepo && cd logrepo
          git init -q && git config user.name ci-bot && git config user.email ci@example.com
          cp /tmp/sig.txt build.log
          cp /tmp/gradle.log compile.log 2>/dev/null || true
          git add build.log compile.log 2>/dev/null || git add build.log
          git commit -q -m "лог сборки" || true
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/bluelink-build-log || true

      - name: Загрузить APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bluelink-apk
          path: bluelink/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Подготовить APK с понятным именем
        run: cp bluelink/android/app/build/outputs/apk/release/app-release.apk BlueLink.apk

      # Постоянный тег: ссылка на скачивание не меняется от сборки к сборке.
      # https://github.com/RatAndRu/Hello-program/releases/download/bluelink-latest/BlueLink.apk
      - name: Опубликовать APK в GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bluelink-latest
          name: BlueLink — APK (последняя сборка)
          body: |
            **Скачать:** https://github.com/RatAndRu/Hello-program/releases/download/bluelink-latest/BlueLink.apk

            Последняя сборка №${{ github.run_number }} от ${{ github.event.head_commit.timestamp }}.

            BlueLink — Bluetooth-пульт: поиск устройств, обзор GATT, управление характеристиками,
            профили устройств и съёмка камерой умных очков (демо-режим, BLE-поток, Wi-Fi/HTTP).
            Установить на телефон с Android 8.0+.
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: BlueLink.apk
