plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.example.pinphotoswidget'
    compileSdk 34
    defaultConfig { applicationId 'com.example.pinphotoswidget'; minSdk 26; targetSdk 34; versionCode 3; versionName '0.3' }
    // Веб-интерфейс единого приложения: Gradle копирует PWA из ../../ (папка pinphotos/)
    // в assets APK. Никакого второго приложения и второй иконки.
    sourceSets { main { assets.srcDirs += "$buildDir/generated/pinphotosAssets" } }
}
kotlin { jvmToolchain(17) }

// Копируем именно интерфейс, без android-widget/ и README, чтобы не затащить лишнее в APK
tasks.register('copyWebAssets', Copy) {
    from('../../') {
        include 'index.html', 'styles.css', 'app.js', 'manifest.webmanifest', 'sw.js', 'icons/**'
    }
    into("$buildDir/generated/pinphotosAssets")
}
tasks.named('preBuild') { dependsOn('copyWebAssets') }
