plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.example.pinphotoswidget'
    compileSdk 34
    defaultConfig { applicationId 'com.example.pinphotoswidget'; minSdk 26; targetSdk 34; versionCode 27; versionName '1.21' }
    signingConfigs {
        release {
            def ks = System.getenv('PINPHOTOS_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('PINPHOTOS_STORE_PASSWORD')
                keyAlias System.getenv('PINPHOTOS_KEY_ALIAS') ?: 'pinphotos'
                keyPassword System.getenv('PINPHOTOS_KEY_PASSWORD') ?: System.getenv('PINPHOTOS_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('PINPHOTOS_KEYSTORE_FILE')) signingConfig signingConfigs.release
            // Только оптимизация готовой сборки: R8 и сжатие ресурсов не меняют интерфейс и функции.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
kotlin { jvmToolchain(17) }
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.biometric:biometric:1.1.0'
}
