plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.example.shadowmorse'
    compileSdk 34
    defaultConfig { applicationId 'com.example.shadowmorse'; minSdk 26; targetSdk 34; versionCode 5; versionName '2.1' }
    signingConfigs {
        release {
            def ks = System.getenv('SHADOWMORSE_KEYSTORE_FILE') ?: System.getenv('PINPHOTOS_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SHADOWMORSE_STORE_PASSWORD') ?: System.getenv('PINPHOTOS_STORE_PASSWORD')
                keyAlias System.getenv('SHADOWMORSE_KEY_ALIAS') ?: System.getenv('PINPHOTOS_KEY_ALIAS') ?: 'pinphotos'
                keyPassword System.getenv('SHADOWMORSE_KEY_PASSWORD') ?: System.getenv('PINPHOTOS_KEY_PASSWORD') ?: System.getenv('SHADOWMORSE_STORE_PASSWORD') ?: System.getenv('PINPHOTOS_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('SHADOWMORSE_KEYSTORE_FILE') || System.getenv('PINPHOTOS_KEYSTORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
kotlin { jvmToolchain(17) }
dependencies { }
