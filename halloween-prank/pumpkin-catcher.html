<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Тыквенный ловец 🎃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Pirata+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b0f05;font-family:system-ui,"Segoe UI",Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
body.locked, body.locked *{cursor:none !important}
#game{position:fixed;inset:0}
#c{display:block;width:100%;height:100%}
#hud{position:fixed;top:14px;left:0;right:0;text-align:center;color:#ffe2a8;font-size:24px;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none;display:none}
.overlay{position:fixed;inset:0;display:none;overflow:hidden}
.overlay.on{display:block}
button{background:#ff7a18;color:#2a1200;border:0;border-radius:14px;padding:14px 30px;font-size:20px;font-weight:700;cursor:pointer;margin-top:16px;box-shadow:0 4px 0 #b84d00;font-family:inherit}
button:active{transform:translateY(3px);box-shadow:none}

#start{z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(27,15,5,.92);color:#ffd27a;text-align:center;padding:20px}
#start.on{display:flex}
#start h1{font-size:34px;margin:0 0 10px}
#start p{max-width:460px;color:#f3e3c3;line-height:1.5}
#start small{color:#c9a777;margin-top:12px}

/* скример */
#scare{background:#000;z-index:20}
#scareImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scareImg.flick{animation:flick .03s steps(1) infinite}
@keyframes flick{0%{opacity:1;filter:contrast(1.3)}50%{opacity:.35;filter:contrast(1.6) brightness(1.4)}100%{opacity:1}}
#text{position:absolute;left:0;right:0;bottom:8%;text-align:center;color:#e00000;font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,4vw,36px);line-height:1.45;padding:0 20px;text-shadow:0 0 14px #600,0 0 4px #000;min-height:6em}
.shake{animation:shake .08s infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-10px,5px)}50%{transform:translate(9px,-6px)}75%{transform:translate(-5px,-9px)}100%{transform:translate(0,0)}}

/* глитч */
#glitch{background:#000;z-index:21}
#gstatic{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:none}
#gscreen{position:absolute;inset:0;overflow:hidden;font-family:Consolas,"Courier New",monospace;display:none}
#gscreen pre{margin:0;padding:24px;font-size:clamp(12px,1.8vw,20px);line-height:1.35;white-space:pre-wrap}
#gscreen > div{position:absolute}

/* удаление */
#wipe{background:#000;color:#e8e8e8;font-family:Consolas,"Courier New",monospace;text-align:center;z-index:22;display:none;flex-direction:column;align-items:center;justify-content:center}
#wipe.on{display:flex}
#wipeTitle{font-size:clamp(18px,2.6vw,28px);margin-bottom:8px}
#wipeSub{font-size:clamp(13px,1.6vw,18px);color:#bdbdbd;margin-bottom:18px;min-height:1.4em}
#wipeFile{font-size:clamp(12px,1.4vw,16px);color:#8a8a8a;height:1.6em;margin-bottom:22px;max-width:90vw;overflow:hidden;white-space:nowrap}
#barBox{width:min(60vw,560px);height:22px;border:1px solid #ccc;padding:2px;display:none}
#bar{height:100%;width:0;background:#e8e8e8}
#pct{margin-top:12px;font-size:clamp(14px,1.8vw,20px);min-height:1.5em}
#cancel{position:fixed;left:0;top:0;margin:0;padding:12px 26px;background:#2a2a2a;color:#eee;box-shadow:none;border:1px solid #888;border-radius:6px;font-size:16px;font-weight:400;pointer-events:none;z-index:24}
.decoy{position:fixed;left:0;top:0;pointer-events:none;z-index:98;will-change:transform}
.decoy svg{display:block}
.decoy svg.spin{animation:spin 1s linear infinite;transform-origin:12px 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#fake{position:fixed;left:0;top:0;width:26px;height:26px;pointer-events:none;z-index:99;display:none}
#fake.on{display:block}

/* финал */
#ending{background:#000;z-index:25;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#ending.on{display:flex}
#endTitle{font-family:"Creepster","Pirata One",Impact,serif;color:#c80000;font-size:clamp(48px,11vw,150px);line-height:1.05;text-shadow:0 0 18px #800,0 0 40px #400;margin:0;letter-spacing:2px}
#endSub{color:#8a8a8a;font-family:Consolas,"Courier New",monospace;margin-top:18px;font-size:clamp(14px,1.8vw,20px)}
#ending button{background:#c80000;color:#fff;box-shadow:0 4px 0 #500}
</style>
</head>
<body>

<div id="game"><canvas id="c"></canvas></div>
<div id="hud"></div>
<div id="vignette"></div>

<!-- Старт / конец игры -->
<div id="start" class="overlay on">
  <h1 id="startTitle">🎃 Тыквенный ловец</h1>
  <p id="startText">Лови тыквы кликом. Летучие мыши воруют тыквы — сбей мышь, и тыква выпадет. Призраки съедают тыквы — их тоже можно сбить. Пять жизней.</p>
  <button id="startBtn">Полный экран и играть</button>
  <small id="startHint">Игра идёт в полноэкранном режиме — кнопка выше сделает это сама.</small>
</div>

<!-- Скример -->
<div id="scare" class="overlay">
  <img id="scareImg" src="scare.jpg" alt="">
  <div id="text"></div>
</div>

<!-- Глитч -->
<div id="glitch" class="overlay">
  <canvas id="gstatic"></canvas>
  <div id="gscreen"></div>
</div>

<!-- Фальшивое удаление -->
<div id="wipe" class="overlay">
  <div id="wipeTitle"></div>
  <div id="wipeSub"></div>
  <div id="wipeFile"></div>
  <div id="barBox"><div id="bar"></div></div>
  <div id="pct"></div>
  <button id="cancel" type="button" tabindex="-1">Отменить</button>
  <div id="fake"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 2 L3 19 L8 14.5 L11 21 L14 19.8 L11 13.5 L17.5 13.5 Z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg></div>
</div>

<!-- Финал -->
<div id="ending" class="overlay">
  <h1 id="endTitle">Весёлого Хэллоуина!</h1>
  <div id="endSub">Ничего не удалено. Честно 🎃</div>
  <button id="again">Перезапустить игру</button>
</div>

<script>
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rnd = a => a[Math.floor(Math.random() * a.length)];
const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hex = () => Math.floor(Math.random() * 0xffffffff).toString(16).toUpperCase().padStart(8, '0');

/* ---------- Полный экран ---------- */
function goFullscreen(){
  const el = document.documentElement;
  const f = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!f) return;
  try { const p = f.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}

/* ---------- Canvas ---------- */
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

/* ---------- Звук (Web Audio, без внешних файлов) ---------- */
let audioCtx = null;
function ac(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function note(freq, dur, type, vol){
  const a = ac(), t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const melody = [523,659,784,659,587,698,880,698,523,659,784,1047,988,784,659,523];
let melodyIdx = 0, musicTimer = null;
function startMusic(){
  stopMusic();
  musicTimer = setInterval(() => {
    const f = melody[melodyIdx % melody.length];
    note(f, 0.2, 'triangle', 0.045);
    if (melodyIdx % 4 === 0) note(f / 4, 0.5, 'sine', 0.06);
    melodyIdx++;
  }, 240);
}
function stopMusic(){ clearInterval(musicTimer); musicTimer = null; }
function popSound(){ note(880, 0.09, 'square', 0.03); }
function thudSound(){ note(90, 0.3, 'sine', 0.25); }
function squeakSound(){ note(1500 + Math.random() * 500, 0.1, 'square', 0.03); }

function distortionCurve(k){
  const n = 2048, c = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const x = i * 2 / n - 1;
    c[i] = (3 + k) * x * 20 * Math.PI / 180 / (Math.PI + k * Math.abs(x));
  }
  return c;
}

// Крик: пилообразный «голос» с вибрато, формантами (гласная «а»), шумом и перегрузом
function scream(){
  const a = ac(), t = a.currentTime, dur = 2.1;
  const shaper = a.createWaveShaper();
  shaper.curve = distortionCurve(90);
  shaper.oversample = '4x';
  const master = a.createGain();
  master.gain.setValueAtTime(0.0001, t);
  master.gain.exponentialRampToValueAtTime(1.0, t + 0.025);
  master.gain.exponentialRampToValueAtTime(0.6, t + 0.8);
  master.gain.exponentialRampToValueAtTime(0.25, t + 1.6);
  master.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  master.connect(shaper).connect(a.destination);

  const voice = a.createGain();
  voice.gain.value = 0.35;
  const oscs = [];
  [0, 12, -10].forEach(det => {
    const o = a.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(230, t);
    o.frequency.exponentialRampToValueAtTime(660, t + 0.25);
    o.frequency.exponentialRampToValueAtTime(430, t + dur);
    o.detune.value = det;
    o.connect(voice);
    o.start(t); o.stop(t + dur + 0.05);
    oscs.push(o);
  });
  const lfo = a.createOscillator(), lg = a.createGain();
  lfo.frequency.value = 7; lg.gain.value = 40;
  lfo.connect(lg);
  oscs.forEach(o => lg.connect(o.frequency));
  lfo.start(t); lfo.stop(t + dur);

  [[800, 9, 1.4], [1300, 7, 1.0], [2700, 6, 0.6]].forEach(([f, q, gn]) => {
    const bp = a.createBiquadFilter(), g = a.createGain();
    bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
    g.gain.value = gn;
    voice.connect(bp).connect(g).connect(master);
  });

  // хрип
  const buf = a.createBuffer(1, a.sampleRate * dur, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const n = a.createBufferSource(), bp = a.createBiquadFilter(), ng = a.createGain();
  n.buffer = buf;
  bp.type = 'bandpass'; bp.Q.value = 1.5;
  bp.frequency.setValueAtTime(2200, t);
  bp.frequency.linearRampToValueAtTime(4200, t + 0.5);
  ng.gain.value = 0.5;
  n.connect(bp).connect(ng).connect(master);
  n.start(t);

  // удар баса
  note(48, 0.9, 'sine', 0.7);
}

// Битый треск: сэмплированный шум с понижением битности
function crackle(){
  const a = ac(), t = a.currentTime;
  const dur = 0.04 + Math.random() * 0.16;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  const hold = randInt(8, 48);
  let v = 0;
  for (let i = 0; i < len; i++){
    if (i % hold === 0) v = Math.round((Math.random() * 2 - 1) * 4) / 4;
    d[i] = v * (1 - i / len);
  }
  const src = a.createBufferSource(), g = a.createGain();
  src.buffer = buf;
  g.gain.value = 0.6;
  src.connect(g).connect(a.destination);
  src.start(t);
}
// Визг/писк: квадратный сигнал со скачком частоты
function squeal(){
  const a = ac(), t = a.currentTime, dur = 0.08 + Math.random() * 0.25;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(800 + Math.random() * 2800, t);
  o.frequency.exponentialRampToValueAtTime(90 + Math.random() * 300, t + dur);
  g.gain.setValueAtTime(0.05, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function glitchSound(){
  if (Math.random() < 0.7) crackle();
  if (Math.random() < 0.4) squeal();
}

/* ---------- Игра ---------- */
const MAX_LIVES = 5;
let pumpkins = [], bats = [], ghosts = [], bursts = [];
let score = 0, lives = MAX_LIVES, eaten = 0;
let running = false, scareDone = false;
let playMs = 0, scareMs = 40000 + Math.random() * 40000;   // накопительное время игры (80 с максимум)
let scareScoreTarget = randInt(12, 22), scareSoonSet = false;
let pendingScare = false, pendingSince = 0;
let lastSpawn = 0, nextBatAt = 0, nextGhostAt = 0, last = 0;

function spawnGap(){ return Math.max(450, 950 - score * 12); }
function spawnPumpkin(x, y, v){
  pumpkins.push({
    x: x ?? (40 + Math.random() * Math.max(10, W - 80)),
    y: y ?? -40,
    v: v ?? (90 + score * 2.5 + Math.random() * 60),
    r: 30, wob: Math.random() * 6
  });
}
function loseLife(){
  lives--;
  thudSound();
  $('hud').textContent = hudText();
  if (lives <= 0) gameOver();
}
function hudText(){ return `🎃 ${score}     ${'❤️'.repeat(Math.max(0, lives))}`; }

function spawnBat(now){
  const fromLeft = Math.random() < 0.5;
  const bat = {
    x: fromLeft ? -60 : W + 60,
    y: H * (0.18 + Math.random() * 0.25),
    state: 'fly', target: null, carry: 0,
    until: 0, phase: Math.random() * 6, dead: false,
    dirX: fromLeft ? 1 : -1
  };
  bat.target = pickTarget(null);
  if (!bat.target) bat.state = 'roam';
  bats.push(bat);
}
function pickTarget(exclude){
  const taken = new Set(bats.map(b => b.target).filter(Boolean));
  const cand = pumpkins.filter(p => p.y > 0 && p.y < H * 0.85 && !taken.has(p) && p !== exclude);
  return cand.length ? rnd(cand) : null;
}
function spawnGhost(){
  const fromLeft = Math.random() < 0.5;
  const speed = 260 + Math.random() * 50 + score * 2;
  const x = fromLeft ? -80 : W + 80;
  const y = H * (0.1 + Math.random() * 0.5);
  const g = { x, y, vx: (fromLeft ? 1 : -1) * speed, vy: 0, speed, target: null, phase: Math.random() * 6, r: 34 };
  g.target = pickTarget(null);
  ghosts.push(g);
}

function addBurst(x, y, text){ bursts.push({ x, y, text, t: 0 }); }

function update(dt, now){
  // падающие тыквы
  if (now - lastSpawn > spawnGap()){ lastSpawn = now; spawnPumpkin(); }
  for (const p of pumpkins){
    p.y += p.v * dt / 1000;
    p.wob += dt / 300;
    p.x += Math.sin(p.wob) * 0.3;
  }
  for (let i = pumpkins.length - 1; i >= 0; i--){
    if (pumpkins[i].y > H + 40){ pumpkins.splice(i, 1); loseLife(); }
  }

  // призраки: летят за конкретной тыквой быстрее мышей, съедают её
  if (now >= nextGhostAt){
    spawnGhost();
    nextGhostAt = now + randInt(9000, 14000) - Math.min(score * 80, 4000);
  }
  for (const g of ghosts){
    g.phase += dt / 200;
    if (!g.target || !pumpkins.includes(g.target)){
      g.target = pickTarget(null);
    }
    if (g.target){
      const t = g.target;
      const dx = t.x - g.x, dy = t.y - g.y, d = Math.hypot(dx, dy) || 1;
      const sp = g.speed * dt / 1000;
      if (d < 36){
        // съел тыкву
        pumpkins.splice(pumpkins.indexOf(t), 1);
        eaten++;
        addBurst(t.x, t.y, '👻 −1');
        g.target = null;
        loseLife();
        if (lives <= 0) return;
      } else {
        g.x += dx / d * Math.min(sp, d);
        g.y += dy / d * Math.min(sp, d);
      }
    } else {
      // цели нет — летит по прямой и улетает
      g.x += g.vx * dt / 1000;
      g.y += g.vy * dt / 1000;
    }
  }
  ghosts = ghosts.filter(g => g.x > -120 && g.x < W + 120 && g.y > -120 && g.y < H + 120);

  // летучие мыши
  if (now >= nextBatAt){
    spawnBat(now);
    nextBatAt = now + randInt(6000, 10000) - Math.min(score * 100, 3000);
  }
  for (const b of bats) updateBat(b, dt, now);
  bats = bats.filter(b => !b.dead);

  for (const b of bursts) b.t += dt;
  bursts = bursts.filter(b => b.t < 900);
}

function batFlapY(b){ return b.y + Math.sin(b.phase) * 46; }

function updateBat(b, dt, now){
  b.phase += dt / 1000 * Math.PI * 2 * 2.2;     // машет крыльями ~2 раза в секунду
  const sp = (170 + score * 2) * dt / 1000;

  if (b.state === 'fly'){
    if (!b.target || !pumpkins.includes(b.target)){
      b.target = pickTarget(null);
      if (!b.target){ b.state = b.carry > 0 ? 'leave' : 'roam'; return; }
    }
    const t = b.target;
    const dx = t.x - b.x, dy = t.y - b.y, d = Math.hypot(dx, dy) || 1;
    if (d < 32){
      // хватает тыкву
      pumpkins.splice(pumpkins.indexOf(t), 1);
      b.target = null;
      b.carry++;
      squeakSound();
      addBurst(b.x, b.y, '🦇 украл!');
      b.state = 'confused';
      b.until = now + 1500;
    } else {
      b.x += dx / d * Math.min(sp, d);
      b.y += dy / d * Math.min(sp, d);
    }
  } else if (b.state === 'confused'){
    // замешательство: мечется на месте, потом выбирает следующую тыкву
    b.x += Math.sin(now / 180) * 0.9;
    b.y += Math.cos(now / 230) * 0.6;
    if (now >= b.until){
      if (b.carry >= 2){ b.state = 'leave'; }
      else {
        b.target = pickTarget(null);
        b.state = b.target ? 'fly' : (b.carry > 0 ? 'leave' : 'roam');
      }
    }
  } else if (b.state === 'roam'){
    b.x += b.dirX * sp * 0.9;
    if (b.x < -80 || b.x > W + 80){ b.dead = true; }
  } else if (b.state === 'leave'){
    const dir = b.x < W / 2 ? -1 : 1;
    b.x += dir * sp * 1.3;
    if (b.x < -80 || b.x > W + 80){
      if (b.carry > 0){ loseLife(); }
      b.dead = true;
    }
  }
}

function killBat(b){
  b.dead = true;
  for (let i = 0; i < b.carry; i++) spawnPumpkin(b.x + (i ? 24 : -24), batFlapY(b), 120);
  if (b.carry) addBurst(b.x, batFlapY(b), '💥 тыква!');
  else addBurst(b.x, batFlapY(b), '💥');
  b.carry = 0;
  popSound();
}

/* ---------- Тыква-голова на фоне: глаза следят за курсором ---------- */
const mouse = { x: innerWidth / 2, y: innerHeight / 2 };
window.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('pointerdown', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
function groundY(x){ return H - 40 - Math.sin(x / 60) * 12; }
function drawBgPumpkin(now){
  const w = Math.min(240, W * 0.22), h = w * 0.82;
  const cx = W * 0.84;
  const gy = groundY(cx) + 6;          // линия земли под тыквой
  const cy = gy - h / 2;
  ctx.save();
  // тень на земле — тыква стоит на ней
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.ellipse(cx, gy + 2, w * 0.6, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.85;
  // тело
  const bg = ctx.createRadialGradient(cx - w * 0.15, cy - h * 0.2, w * 0.05, cx, cy, w * 0.6);
  bg.addColorStop(0, '#4a2208');
  bg.addColorStop(1, '#170700');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2); ctx.fill();
  // рёбра
  ctx.strokeStyle = 'rgba(255,122,24,0.16)';
  ctx.lineWidth = 2;
  for (const k of [0.35, 0.7]){
    ctx.beginPath(); ctx.ellipse(cx, cy, w / 2 * k, h / 2 - 2, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // подсветка от луны (луна справа сверху)
  ctx.strokeStyle = 'rgba(255,150,60,0.4)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2 - 3, h / 2 - 3, 0, -1.2, 0.6); ctx.stroke();
  // черенок
  ctx.fillStyle = '#1f1004';
  ctx.beginPath();
  ctx.moveTo(cx - 9, cy - h / 2 + 6);
  ctx.quadraticCurveTo(cx - 6, cy - h / 2 - 22, cx + 10, cy - h / 2 - 30);
  ctx.lineTo(cx + 14, cy - h / 2 - 24);
  ctx.quadraticCurveTo(cx + 4, cy - h / 2 - 8, cx + 9, cy - h / 2 + 6);
  ctx.closePath(); ctx.fill();
  // глаза: чёрная глазница и светящийся зрачок, смещённый к курсору
  const flick = 0.85 + 0.15 * Math.sin(now / 90);
  const eyes = [cx - w * 0.17, cx + w * 0.17], ey = cy - h * 0.1, es = w * 0.11;
  for (const ex of eyes){
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.moveTo(ex - es, ey - es * 0.6);
    ctx.lineTo(ex + es, ey - es * 0.6);
    ctx.lineTo(ex, ey + es * 1.1);
    ctx.closePath(); ctx.fill();
    const dx = mouse.x - ex, dy = mouse.y - ey, d = Math.hypot(dx, dy) || 1;
    const off = Math.min(es * 0.32, d * 0.02);
    const ox = ex + dx / d * off, oy = ey + dy / d * off;
    ctx.globalAlpha = 0.85 * flick;
    ctx.fillStyle = '#ffb000';
    ctx.shadowColor = '#ff8a00';
    ctx.shadowBlur = 26;
    ctx.beginPath(); ctx.arc(ox, oy, es * 0.42, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.85;
  }
  // рот с зубами
  ctx.fillStyle = '#000';
  ctx.beginPath();
  const mx0 = cx - w * 0.27, mx1 = cx + w * 0.27, my0 = cy + h * 0.16, my1 = cy + h * 0.34;
  ctx.moveTo(mx0, my0);
  ctx.lineTo(mx1, my0);
  const teeth = 6;
  for (let i = 0; i <= teeth; i++){
    const x = mx1 - (mx1 - mx0) * i / teeth;
    ctx.lineTo(x, i % 2 ? my0 + (my1 - my0) * 0.45 : my1);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function draw(){
  const now = performance.now();
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2b1640');
  g.addColorStop(0.6, '#8a3a2a');
  g.addColorStop(1, '#ff7a18');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffe9b0';
  ctx.beginPath(); ctx.arc(W * 0.8, H * 0.15, 36, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1b0f05';
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H - 40 - Math.sin(x / 60) * 12);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  drawBgPumpkin(now);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of pumpkins){
    ctx.font = '58px serif';
    ctx.fillText('🎃', p.x, p.y);
  }
  for (const g2 of ghosts){
    ctx.save();
    ctx.globalAlpha = 0.85 + Math.sin(g2.phase) * 0.1;
    ctx.font = '62px serif';
    ctx.fillText('👻', g2.x, g2.y + Math.sin(g2.phase) * 8);
    ctx.restore();
  }
  for (const b of bats){
    const y = batFlapY(b);
    ctx.save();
    ctx.translate(b.x, y);
    ctx.scale(1 + 0.12 * Math.sin(b.phase * 2), 1);
    ctx.font = '56px serif';
    ctx.fillText('🦇', 0, 0);
    ctx.restore();
    if (b.carry > 0){
      ctx.font = '26px serif';
      ctx.fillText(b.carry > 1 ? '🎃🎃' : '🎃', b.x, y + 40);
    }
    if (b.state === 'confused'){
      ctx.font = '28px serif';
      ctx.fillText('❓', b.x + 36, y - 30);
    }
  }
  ctx.font = '600 22px system-ui, sans-serif';
  for (const b of bursts){
    ctx.save();
    ctx.globalAlpha = 1 - b.t / 900;
    ctx.fillStyle = '#fff';
    ctx.fillText(b.text, b.x, b.y - b.t / 25);
    ctx.restore();
  }
}

function loop(now){
  const dt = Math.min(50, now - last); last = now;
  if (running){
    update(dt, now);
    if (running) $('hud').textContent = hudText();
    playMs += dt;
    if (!scareDone && playMs >= scareMs && !pendingScare){ pendingScare = true; pendingSince = now; }
    if (pendingScare && !scareDone && now - pendingSince > 12000){
      // если не кликали — всё равно запускаем (без захвата курсора)
      running = false;
      startScare(false);
    }
  }
  draw();
  requestAnimationFrame(loop);
}

// Клики: тыквы, летучие мыши, призраки
function onPointer(e){
  if (!running){ return; }
  if (pendingScare && !scareDone){
    // скример стартует по клику — так можно захватить курсор (требование браузера)
    running = false;
    lockPointer();
    startScare(true);
    return;
  }
  let best = null, bestD = Infinity;
  const consider = (obj, x, y, r, kind) => {
    const d = Math.hypot(x - e.clientX, y - e.clientY);
    if (d < r && d < bestD){ best = { obj, kind }; bestD = d; }
  };
  pumpkins.forEach(p => consider(p, p.x, p.y, 36, 'pumpkin'));
  bats.forEach(b => consider(b, b.x, batFlapY(b), 44, 'bat'));
  ghosts.forEach(g => consider(g, g.x, g.y, 42, 'ghost'));
  if (!best) return;
  if (best.kind === 'pumpkin'){
    pumpkins.splice(pumpkins.indexOf(best.obj), 1);
    score++;
    if (!scareSoonSet && score >= scareScoreTarget){
      scareSoonSet = true;
      scareMs = Math.min(scareMs, playMs + randInt(2500, 6000));
    }
    addBurst(best.obj.x, best.obj.y, '+1');
    popSound();
  } else if (best.kind === 'bat'){
    killBat(best.obj);
  } else {
    ghosts.splice(ghosts.indexOf(best.obj), 1);
    addBaddPoof(best.obj.x, best.obj.y);
    popSound();
  }
  $('hud').textContent = hudText();
}
function addBaddPoof(x, y){ addBurst(x, y, '💨'); }
cv.addEventListener('pointerdown', onPointer);

function resetGame(){
  pumpkins = []; bats = []; ghosts = []; bursts = [];
  score = 0; lives = MAX_LIVES; eaten = 0;

  nextBatAt = now + 6000;
  nextGhostAt = now + 10000;
}

/* ---------- Захват курсора, отталкивание, обманные курсоры ---------- */
const cur = { x: innerWidth / 2, y: innerHeight / 2, vx: 0, vy: 0 };   // виртуальный курсор (при захвате)
const real = { x: -999, y: -999 };                                     // настоящий курсор (без захвата)
const btn = { x: 0, y: 0, vx: 0, vy: 0, w: 0, h: 0 };                 // кнопка «Отменить»
let locked = false, wipeActive = false;

function lockPointer(){
  try { const p = document.documentElement.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
}
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === document.documentElement;
  document.body.classList.toggle('locked', locked);
  $('fake').classList.toggle('on', locked && wipeActive);
});
document.addEventListener('mousemove', e => {
  if (locked){
    cur.x = clamp(cur.x + e.movementX, 0, W);
    cur.y = clamp(cur.y + e.movementY, 0, H);
  } else {
    real.x = e.clientX; real.y = e.clientY;
  }
});

function placeButton(){
  const b = $('cancel');
  btn.w = b.offsetWidth; btn.h = b.offsetHeight;
  btn.x = innerWidth / 2 - btn.w / 2;
  btn.y = innerHeight * 0.6 - btn.h / 2;
  btn.vx = btn.vy = 0;
  applyBtn();
}
function applyBtn(){ $('cancel').style.transform = `translate(${btn.x}px,${btn.y}px)`; }

/* Обманные курсоры: стандартные формы Windows, сами шевелятся, не кликаются */
const DECOY_SVG = {
  arrow: '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 2 L3 19 L8 14.5 L11 21 L14 19.8 L11 13.5 L17.5 13.5 Z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg>',
  hand: '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M9 2.5a1.6 1.6 0 0 1 3.2 0V10l.6-.1a1.8 1.8 0 0 1 2 1.5l.4-.1a1.7 1.7 0 0 1 2 1.4l.3-.1a1.6 1.6 0 0 1 1.9 1.4V17c0 3-2.2 5-5.2 5h-1.2c-2 0-3.2-1-4.4-2.6L3.6 14.5a1.6 1.6 0 0 1 2.3-2.2L9 15z" fill="#fff" stroke="#000" stroke-width="1.1"/></svg>',
  ibeam: '<svg width="20" height="26" viewBox="0 0 20 26"><path d="M4 1h12M4 25h12M10 1v24" stroke="#fff" stroke-width="4"/><path d="M4 1h12M4 25h12M10 1v24" stroke="#000" stroke-width="1.6"/></svg>',
  busy: '<svg width="26" height="26" viewBox="0 0 24 24" class="spin"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="4"/><circle cx="12" cy="12" r="9" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="14 42"/></svg>',
  resize: '<svg width="28" height="20" viewBox="0 0 28 20"><path d="M2 10h24M2 10l6-6M2 10l6 6M26 10l-6-6M26 10l-6 6" stroke="#fff" stroke-width="4" fill="none"/><path d="M2 10h24M2 10l6-6M2 10l6 6M26 10l-6-6M26 10l-6 6" stroke="#000" stroke-width="1.5" fill="none"/></svg>'
};
let decoys = [];
function makeDecoys(n){
  clearDecoys();
  const kinds = ['arrow','arrow','arrow','arrow','hand','hand','ibeam','busy','resize'];
  for (let i = 0; i < n; i++){
    const el = document.createElement('div');
    el.className = 'decoy';
    el.innerHTML = DECOY_SVG[rnd(kinds)];
    $('wipe').appendChild(el);
    decoys.push({ el, x: Math.random() * innerWidth, y: Math.random() * innerHeight, tx: 0, ty: 0, next: 0 });
  }
}
function clearDecoys(){ decoys.forEach(d => d.el.remove()); decoys = []; }
function updateDecoys(now){
  for (const d of decoys){
    if (now > d.next){
      d.tx = Math.random() * innerWidth;
      d.ty = Math.random() * innerHeight;
      d.next = now + randInt(400, 2200);
      if (Math.random() < 0.25){ d.x = d.tx; d.y = d.ty; }   // иногда дёргается
    }
    d.x += (d.tx - d.x) * 0.04;
    d.y += (d.ty - d.y) * 0.04;
    d.el.style.transform = `translate(${d.x}px,${d.y}px)`;
  }
}

function repelFrame(){
  if (!wipeActive) return;
  const now = performance.now();
  updateDecoys(now);
  const RANGE = 340;
  const bx = btn.x + btn.w / 2, by = btn.y + btn.h / 2;

  if (locked){
    // курсор отлетает от кнопки, сама кнопка на месте
    const dx = cur.x - bx, dy = cur.y - by, d = Math.hypot(dx, dy) || 1;
    if (d < RANGE){
      const s = (RANGE - d) / RANGE, k = 3 + s * s * 40;
      cur.vx += dx / d * k; cur.vy += dy / d * k;
    }
    cur.vx *= 0.86; cur.vy *= 0.86;
    cur.x += cur.vx; cur.y += cur.vy;
    const L = btn.x - 24, R = btn.x + btn.w + 24, T = btn.y - 24, B = btn.y + btn.h + 24;
    if (cur.x > L && cur.x < R && cur.y > T && cur.y < B){
      const m = Math.min(cur.x - L, R - cur.x, cur.y - T, B - cur.y);
      if (m === cur.x - L){ cur.x = L; cur.vx = -(Math.abs(cur.vx) + 4); }
      else if (m === R - cur.x){ cur.x = R; cur.vx = Math.abs(cur.vx) + 4; }
      else if (m === cur.y - T){ cur.y = T; cur.vy = -(Math.abs(cur.vy) + 4); }
      else { cur.y = B; cur.vy = Math.abs(cur.vy) + 4; }
    }
    cur.x = clamp(cur.x, 0, W); cur.y = clamp(cur.y, 0, H);
    $('fake').style.transform = `translate(${cur.x}px,${cur.y}px)`;
  } else {
    // без захвата: кнопка убегает от настоящего курсора
    const dx = bx - real.x, dy = by - real.y;
    const d = Math.hypot(dx, dy) || 1;
    if (real.x > -900 && d < RANGE){
      const s = (RANGE - d) / RANGE, k = 2 + s * s * 38;
      btn.vx += dx / d * k; btn.vy += dy / d * k;
    }
    btn.vx *= 0.88; btn.vy *= 0.88;
    btn.x += btn.vx; btn.y += btn.vy;
    btn.x = clamp(btn.x, 8, innerWidth - btn.w - 8);
    btn.y = clamp(btn.y, 8, innerHeight - btn.h - 8);
    applyBtn();
  }
  requestAnimationFrame(repelFrame);
}

/* ---------- Скример ---------- */
const LINES = [
  'Ты думал, это просто тыквы?',
  'Я смотрю на тебя через экран.',
  'Не оборачивайся. Ты уже не один(а).',
];
async function typeLines(el, lines){
  el.textContent = '';
  for (const line of lines){
    const div = document.createElement('div');
    el.appendChild(div);
    for (const ch of line){ div.textContent += ch; await sleep(40); }
    await sleep(700);
  }
}

async function startScare(capture){
  scareDone = true;
  running = false;
  pendingScare = false;
  stopMusic();
  $('game').style.display = 'none';
  $('hud').style.display = 'none';
  const scare = $('scare');
  scare.classList.add('on', 'shake');
  $('scareImg').classList.add('flick');
  setTimeout(() => scare.classList.remove('shake'), 1000);
  try { if (navigator.vibrate) navigator.vibrate([300, 120, 500, 120, 900]); } catch (e) {}
  scream();                       // сразу крик, без предвестников
  await sleep(1600);
  typeLines($('text'), LINES);
  await sleep(4200);
  scare.classList.remove('on');
  $('scareImg').classList.remove('flick');
  await glitchPhase(4500);
  await wipePhase();
}

/* ---------- Глитч-экраны (быстрое мерцание) ---------- */
const GS = $('gstatic'), GD = $('gscreen');
function drawStatic(){
  const w = 160, h = 90;
  GS.width = w; GS.height = h;
  const x = GS.getContext('2d');
  const im = x.createImageData(w, h);
  for (let i = 0; i < im.data.length; i += 4){
    const v = Math.random() * 255;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
    im.data[i + 3] = 255;
  }
  x.putImageData(im, 0, 0);
}
const GSCREENS = {
  bsod(){
    GD.style.background = '#0a5bd6'; GD.style.color = '#fff';
    GD.innerHTML = `<pre>:(\n\nНа вашем ПК возникла проблема, и его необходимо перезагрузить.\n\nSTOP: 0x${hex()}\nDELETE_IN_PROGRESS\n\nСбор данных об ошибке: ${randInt(0, 100)}% завершено</pre>`;
  },
  dump(){
    GD.style.background = '#000'; GD.style.color = rnd(['#0f0', '#fff', '#f44']);
    let s = '';
    for (let i = 0; i < 26; i++)
      s += `0x${hex()} ${rnd(['FAILED','NULL','ERR','??','DEL'])} ${rnd(['sector','block','file','cluster'])} ${Math.random().toString(36).slice(2, 12)}\n`;
    GD.innerHTML = `<pre>${s}</pre>`;
  },
  blocks(){
    GD.style.background = '#000'; GD.innerHTML = '';
    for (let i = 0; i < 40; i++){
      const d = document.createElement('div');
      d.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${rnd([4,20,120,300])}px;height:${rnd([2,8,40])}px;background:${rnd(['#f0f','#0ff','#fff','#f00','#00f','#ff0'])}`;
      GD.appendChild(d);
    }
  },
  flash(){ GD.style.background = rnd(['#fff', '#f00', '#0ff']); GD.innerHTML = ''; },
  face(){ GD.style.background = '#000'; GD.innerHTML = '<img src="scare.jpg" alt="" style="width:100%;height:100%;object-fit:cover;filter:invert(1) hue-rotate(180deg)">'; }
};
async function glitchPhase(ms){
  $('glitch').classList.add('on');
  const end = performance.now() + ms;
  const keys = Object.keys(GSCREENS);
  while (performance.now() < end){
    if (Math.random() < 0.4){
      GS.style.display = 'block'; GD.style.display = 'none';
      drawStatic();
    } else {
      GS.style.display = 'none'; GD.style.display = 'block';
      GSCREENS[rnd(keys)]();
    }
    glitchSound();
    await sleep(30 + Math.random() * 50);   // частая смена кадров
  }
  $('glitch').classList.remove('on');
  GD.style.display = 'none'; GS.style.display = 'none';
}

/* ---------- Фальшивое удаление: подсчёт → удаление ---------- */
const NAMES = ['Фото_2019', 'Диплом', 'Семейный_архив', 'Курсовая', 'Музыка', 'Видео_отпуск', 'Документы', 'Проекты', 'Пароли', 'Почта'];
const EXTS = ['jpg', 'docx', 'mp4', 'pdf', 'zip', 'psd', 'xlsx', 'dat'];
const TOTAL = 48219;

async function wipePhase(){
  const wipe = $('wipe');
  wipe.classList.add('on');
  wipeActive = true;
  cur.x = innerWidth / 2; cur.y = innerHeight / 2; cur.vx = 0; cur.vy = 0;
  $('fake').classList.toggle('on', locked);
  placeButton();
  makeDecoys(14);
  requestAnimationFrame(repelFrame);

  // дрон во время всей загрузки (монотонный)
  const a = ac();
  const drone = a.createOscillator(), dg = a.createGain();
  drone.type = 'sawtooth'; drone.frequency.value = 48;
  dg.gain.value = 0.05;
  drone.connect(dg).connect(a.destination);
  drone.start();

  $('wipeTitle').textContent = 'Подготовка к удалению файлов…';
  $('wipeSub').textContent = 'Подсчёт файлов на компьютере';
  $('barBox').style.display = 'none';
  $('pct').textContent = '';
  await sleep(600);

  // 1) подсчёт
  let count = 0;
  while (count < TOTAL){
    await sleep(90);
    if (Math.random() < 0.1) await sleep(500 + Math.random() * 900);
    count = Math.min(TOTAL, count + randInt(180, 1000));
    $('pct').textContent = `Найдено файлов: ${count.toLocaleString('ru-RU')}`;
    $('wipeFile').textContent = `C:\\Users\\Пользователь\\${rnd(NAMES)}\\${rnd(NAMES)}_${randInt(1, 999)}.${rnd(EXTS)}`;
  }
  await sleep(900);

  // 2) удаление
  $('wipeTitle').textContent = 'Удаление файлов…';
  $('wipeSub').textContent = 'Не выключайте компьютер';
  $('barBox').style.display = 'block';
  let p = 0, deleted = 0;
  while (p < 100){
    await sleep(120);
    if (Math.random() < 0.08) await sleep(600 + Math.random() * 1000);
    if (p > 97 && Math.random() < 0.5) await sleep(900 + Math.random() * 1200);
    p = Math.min(100, p + Math.random() * 0.9 + 0.15);
    deleted = Math.floor(TOTAL * p / 100);
    $('bar').style.width = p + '%';
    $('pct').textContent = `${Math.floor(p)}%  ·  удалено ${deleted.toLocaleString('ru-RU')} из ${TOTAL.toLocaleString('ru-RU')}`;
    $('wipeFile').textContent = `C:\\Users\\Пользователь\\${rnd(NAMES)}\\${rnd(NAMES)}_${randInt(1, 999)}.${rnd(EXTS)} — удалён`;
    if (Math.random() < 0.5) note(1200 + Math.random() * 600, 0.02, 'square', 0.02);
  }
  await sleep(1500);

  drone.stop();
  wipeActive = false;
  showEnding();
}

/* ---------- Финал ---------- */
function showEnding(){
  if (document.pointerLockElement) document.exitPointerLock();
  wipeActive = false;
  clearDecoys();
  $('wipe').classList.remove('on');
  $('scare').classList.remove('on');
  $('glitch').classList.remove('on');
  $('ending').classList.add('on');
}
$('again').addEventListener('click', () => { startGame(); });

last = performance.now();
lastSpawn = last;
requestAnimationFrame(loop);
