<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПИКСЕЛЬ — сценарий в картинку</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0F12;
  --surface:#17191E;
  --surface-2:#1E2128;
  --surface-3:#252A33;
  --line:#252A33;
  --line-strong:#303642;
  --text:#E6E8EE;
  --muted:#8B91A1;
  --faint:#5A6172;
  --accent:#FF7A45;
  --accent-hover:#FF8C5E;
  --ok:#2ECC71;
  --warn:#F5A623;
  --bad:#FF5A5A;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 8px 32px rgba(0,0,0,.38);
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit}

/* HEADER — 56px, один ряд, много воздуха */
.header{
  height:56px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid var(--line);
  background:var(--bg);
  position:sticky;top:0;z-index:10;
}
.brand{display:flex;align-items:center;gap:12px}
.mark{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,#FF7A45,#FFB347);
  display:grid;place-items:center;
  font-weight:800;font-size:15px;color:#1A0F0A;
  letter-spacing:-.02em;
}
.brand b{font-size:13.5px;letter-spacing:.10em;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.06em;margin-top:1px;font-weight:500}
.nav{display:flex;align-items:center;gap:8px}
.pill{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12.5px;cursor:pointer;transition:.15s}
.pill:hover{border-color:var(--line-strong);color:var(--text)}
.pill.active{background:var(--text);border-color:var(--text);color:#0E0F12;font-weight:600}
.btn-primary{
  padding:9px 16px;border-radius:999px;border:0;
  background:var(--accent);color:#fff;font-weight:600;font-size:12.5px;
  cursor:pointer;box-shadow:0 4px 14px rgba(255,122,69,.32);transition:.15s
}
.btn-primary:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-ghost{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12.5px;cursor:pointer}
.btn-ghost:hover{background:var(--surface);color:var(--text)}

/* LAYOUT — 12 колонок, max 1480 · фикс: не растягивать карточки друг под друга */
.layout{
  max-width:1480px;margin:0 auto;
  padding:16px;
  display:grid;
  grid-template-columns:1.15fr .95fr;
  gap:16px;
  align-items:start; /* КРИТИЧНО: карточки не тянутся на всю высоту */
  min-height:auto;
}
@media(max-width:960px){
  .layout{grid-template-columns:1fr; padding:12px}
}
/* CARDS — единая система */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;flex-direction:column;
  min-height:0;
}
.card-head{
  height:44px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid var(--line);
  background:var(--surface);
}
.card-head h2{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card-head .tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.seg button{padding:6px 12px;border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}
.seg button.active{background:var(--surface-3);color:var(--text);font-weight:600}

/* EDITOR */
.editor{flex:1;display:flex;min-height:420px}
.gutter{
  width:44px;background:var(--surface-2);
  border-right:1px solid var(--line);
  padding:10px 0;
  color:var(--faint);font-family:var(--mono);font-size:12px;line-height:20px;
  text-align:right;padding-right:8px;user-select:none;
}
#code{
  flex:1;
  background:#0F1216;
  color:#D6DEEB;
  border:0;outline:0;
  padding:10px 14px;
  font-family:var(--mono);font-size:12.8px;line-height:20px;
  resize:none;
}
#code::placeholder{color:#424957}
.editor-foot{
  height:36px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;
  border-top:1px solid var(--line);
  background:var(--surface-2);
  font-size:11.5px;color:var(--muted);
}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad)}

/* PREVIEW — ИСПРАВЛЕНО: квадрат, скролл, без наложений */
.preview-viewport{
  height:460px; /* фикс высота + скролл если не влезает */
  min-height:380px;
  max-height:560px;
  background:
    radial-gradient(circle at 30% 20%, rgba(255,122,69,.06), transparent 45%),
    var(--bg);
  display:grid;place-items:center;
  padding:20px;
  overflow:auto; /* скролл если зум большой */
  position:relative;
  border-bottom:1px solid var(--line);
}
.canvas-stack{
  display:flex;gap:16px;align-items:center;justify-content:center;
  flex-wrap:wrap;
}
.canvas-wrap{
  position:relative;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 1px var(--line);
  background:#0B0E13;
  flex:0 0 auto;
  display:grid;place-items:center;
  padding:6px;
}
.canvas-wrap label{
  position:absolute;top:6px;left:8px;
  background:rgba(0,0,0,.65);color:#fff;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border-radius:999px;
  pointer-events:none;
}
#pixelCanvas, #hdCanvas{
  display:block;
  image-rendering:pixelated; image-rendering: crisp-edges;
}
.preview-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  gap:12px;
}
.preview-tools{display:flex;align-items:center;gap:6px}
.tool{width:30px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:13px}
.tool.active{background:var(--text);color:#0E0F12;border-color:var(--text)}
.tool:hover{background:var(--surface-3);color:var(--text);border-color:var(--line-strong)}
.zoom{display:flex;gap:6px;align-items:center}
.zoom button{width:30px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);cursor:pointer;font-size:14px}
.zoom button:hover{color:var(--text);border-color:var(--line-strong)}
.zoom span{font-size:11px;color:var(--muted);min-width:36px;text-align:center}
.palette-dock{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;
  border-top:1px solid var(--line);
  background:var(--surface);
  overflow:auto;
}
.sw{width:22px;height:22px;border-radius:999px;border:2px solid transparent;cursor:pointer;flex:0 0 auto;box-shadow:0 0 0 1px var(--line)}
.sw.active{border-color:var(--text);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.pal-label{margin-left:auto;font-size:11px;color:var(--faint)}

/* FOOTER */
.footer{
  height:36px;
  max-width:1480px;margin:0 auto;padding:0 20px;
  display:flex;align-items:center;justify-content:space-between;
  border-top:1px solid var(--line);
  color:var(--faint);font-size:11px;
}
/* MISC */
kbd{font-family:var(--mono);font-size:10px;background:var(--surface-3);border:1px solid var(--line);border-bottom-color:#2a303c;border-radius:5px;padding:2px 5px;color:var(--muted)}
.muted{color:var(--muted);font-size:11px}
.examples{position:relative}
.menu{
  position:absolute;top:calc(100% + 8px);right:0;
  min-width:220px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);padding:6px;display:none;z-index:20
}
.menu.open{display:block}
.menu button{width:100%;text-align:left;padding:9px 12px;border-radius:8px;border:0;background:transparent;color:var(--text);font-size:13px;cursor:pointer}
.menu button:hover{background:var(--surface-2)}
.menu small{color:var(--muted);font-size:11px}
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="mark">П</div>
    <div><b>ПИКСЕЛЬ</b><small>сценарий → картинка</small></div>
  </div>
  <div class="nav">
    <div class="examples">
      <button class="pill" id="exBtn">Примеры ▾</button>
      <div class="menu" id="exMenu">
        <button data-ex="warrior">⚔️ Воин 32 <small>row-RLE</small></button>
        <button data-ex="warrior48">⚔️ Воин 48 HD <small>плотная сетка</small></button>
        <button data-ex="slime">🟢 Слайм <small>16×16</small></button>
        <button data-ex="tree">🌳 Дерево <small>24×24</small></button>
        <button data-ex="blank">∅ Пусто</button>
      </div>
    </div>
    <button class="btn-ghost" id="copyBtn">Копировать</button>
    <button class="btn-ghost" id="exportBtn">Экспорт</button>
    <button class="btn-primary" id="buildBtn">Собрать <span style="opacity:.7;margin-left:6px"><kbd>⌘</kbd><kbd>↵</kbd></span></button>
  </div>
</header>

<main class="layout">
  <!-- LEFT: редактор — главное -->
  <section class="card" style="min-height:480px">
    <div class="card-head">
      <h2>Сценарий</h2>
      <div class="tools">
        <select id="sizeSel" class="pill" style="padding:6px 10px">
          <option value="16">16</option><option value="32" selected>32</option><option value="48">48</option><option value="64">64</option>
        </select>
        <select id="palSel" class="pill" style="padding:6px 10px">
          <option value="pico8">PICO-8 · 16</option><option value="gameboy">Game Boy · 4</option><option value="sweet16">Sweet 16 · 16</option><option value="endesga32">Endesga 32</option><option value="lospec32">Lospec 32</option><option value="n64">N64 · 64</option>
        </select>
        <label class="pill" style="padding:5px 8px;display:flex;align-items:center;gap:6px">фон <input type="color" id="bgTop" value="#0B0E13" style="width:18px;height:18px;padding:0;border:0;border-radius:4px;background:transparent"></label>
        <span class="muted" id="status">готово</span>
      </div>
    </div>
    <div class="editor">
      <div class="gutter" id="gutter">1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10</div>
      <textarea id="code" spellcheck="false" placeholder="размер 32
палитра pico8
# строка: номер строки: столбец. цвета
# пример — воин:
4: 12. 4 4 4 4
# пустые строки — не пишем, это фон
"></textarea>
    </div>
    <div class="editor-foot">
      <span><span class="dot ok" id="dot"></span><span id="msg">Собери чтобы увидеть</span></span>
      <span class="muted">прозрачность = не пишем · <kbd>Ctrl</kbd>+<kbd>Enter</kbd></span>
    </div>
  </section>

  <!-- RIGHT: предпросмотр — второстепенно, но красиво -->
  <section class="card">
    <div class="card-head">
      <h2>Предпросмотр</h2>
      <div class="tools">
        <div class="seg" id="modeSeg">
          <button class="active" data-m="pixel">Пиксель</button>
          <button data-m="hd">HD ×4</button>
          <button data-m="split">Сравн.</button>
        </div>
      </div>
    </div>
    <div class="preview-viewport" id="stage">
      <div class="canvas-stack" id="stack">
        <div class="canvas-wrap" id="wrapPixel"><label>пиксель</label><canvas id="pixelCanvas" width="384" height="384"></canvas></div>
        <div class="canvas-wrap" id="wrapHD" hidden><label>HD ×4</label><canvas id="hdCanvas" width="384" height="384"></canvas></div>
      </div>
    </div>
    <div class="preview-bar">
      <div class="preview-tools" id="tools">
        <button class="tool active" data-t="brush" title="Кисть — клик ставит пиксель">🖌</button>
        <button class="tool" data-t="eraser" title="Ластик">⌫</button>
        <button class="tool" data-t="pick" title="Пипетка">👁</button>
        <button class="tool" id="gridBtn" title="Сетка">▦</button>
        <button class="tool" id="clearBtn" title="Очистить">✕</button>
      </div>
      <div class="zoom">
        <button id="minus" title="Уменьшить">−</button><span id="zoomVal">100%</span><button id="plus" title="Увеличить">+</button>
      </div>
    </div>
    <div class="palette-dock" id="palDock"></div>
  </section>
</main>

<footer class="footer">
  <span>ПИКСЕЛЬ v3 · row-RLE · <a href="https://github.com/RatAndRu/Hello-program" target="_blank" style="color:var(--muted);text-decoration:underline">GitHub</a></span>
  <span class="muted">клик по пикселю в режиме кисти — ставит цвет</span>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
